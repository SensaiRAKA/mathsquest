<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<title>Lily Pad Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: one column "pond" - a lily-pad trail for the weekend plan, specimen-tag cards for questions.
   Single, deliberate daylight palette (kid app on a tablet). */
:root{
  --pond:#E7F4EF; --pond2:#D3EBE3; --ink:#173A2E; --muted:#557067; --card:#FFFFFF; --line:#CFE2DA;
  --leaf:#2E9E5B; --leaf-deep:#1F7543; --leaf-soft:#DDF3E4;
  --sun:#FFB627; --sun-deep:#C98800; --sun-soft:#FFF2D2;
  --ok:#1A9A5E; --ok-bg:#DFF5E9; --bad:#D8414D; --bad-bg:#FDE6E8; --sel:#2D6CDF; --sel-bg:#E3ECFD;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-hand:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--pond);color:var(--ink)}
body{font-family:var(--f-body);font-size:18px;line-height:1.45;margin:0;min-height:100%;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 8% 0%,#FFF6DD 0,transparent 32%),radial-gradient(circle at 100% 40%,#DDF0FA 0,transparent 30%),var(--pond)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
button[disabled]{cursor:default}
h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:28px 0 10px;text-wrap:balance;line-height:1.15}
h3{font-family:var(--f-display);font-weight:700;line-height:1.2;margin:0 0 8px;text-wrap:balance}
b{font-weight:700}
mark{background:var(--sun-soft);color:inherit;border-radius:4px;padding:0 2px}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(231,244,239,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:780px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ava{width:42px;height:40px;flex:none}
.lvl{display:flex;flex-direction:column;flex:1;min-width:110px}
.lvl b{font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.xpbar{height:9px;background:var(--pond2);border-radius:9px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#FFD36B);border-radius:9px;transition:width .5s}
.chip{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.exam{background:var(--sun-soft);border-color:#F4CF7E;color:#6E4A00}
.streak{display:inline-flex;gap:4px}
.streak i{width:10px;height:10px;border-radius:50%;background:var(--pond2);border:1px solid var(--line)}
.streak i.on{background:var(--leaf);border-color:var(--leaf-deep)}

main{max-width:780px;margin:0 auto;padding:14px 16px 70px}

/* hero */
.hero{display:flex;gap:10px;align-items:flex-end}
.bigfrog{width:104px;height:96px;flex:none;animation:bob 3.2s ease-in-out infinite}
.bigfrog.sm{width:90px;height:82px;margin:0 auto}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{flex:1;min-width:0;background:var(--card);border:2px solid var(--ink);border-radius:22px 22px 22px 6px;padding:12px 14px;box-shadow:4px 4px 0 var(--ink);font-family:var(--f-hand);font-size:21px;line-height:1.3}
.bubble b{font-family:var(--f-body);font-size:18px}
.bubble .btnrow{margin-top:10px;font-family:var(--f-body)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 18px;border-radius:14px;font-family:var(--f-display);font-weight:700;font-size:19px;background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-deep);transition:transform .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf-deep)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:1px solid var(--line)}
.btn.ink{background:var(--ink);box-shadow:0 4px 0 #0B1F18}
.btn.sm{min-height:44px;font-size:16px;padding:8px 12px}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad);box-shadow:0 4px 0 #9E2B35}
.btn[disabled]{opacity:.4}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btnrow.center{justify-content:center}
.btnrow.spread{justify-content:space-between}
.link{color:var(--leaf-deep);text-decoration:underline;font-weight:700;padding:8px}
.skip{text-align:center;margin:4px 0 0}

/* pond trail */
.pond{display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#D7EEF3,#CDE9DE);border-radius:26px;padding:14px;border:2px solid #BFDDD2}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 4px 0;font-family:var(--f-display)}
.dayhead b{font-size:20px}
.dayhead span{font-size:15px;color:var(--muted);font-weight:600}
.pad{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:6px 10px 6px 6px;border-radius:999px 22px 22px 999px;background:rgba(255,255,255,.72);border:2px solid transparent;transition:transform .1s}
.pad.alt{margin-left:clamp(0px,6vw,46px);width:calc(100% - clamp(0px,6vw,46px))}
.pad:active{transform:scale(.98)}
.pad.next{background:#fff;border-color:var(--sun);box-shadow:0 4px 0 var(--sun-deep)}
.pad.done{background:rgba(255,255,255,.5)}
.lily{position:relative;width:62px;height:62px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8FD483,#4FAE58 70%);display:grid;place-items:center;
  -webkit-mask:conic-gradient(from 100deg,#000 0 330deg,transparent 330deg);mask:conic-gradient(from 100deg,#000 0 330deg,transparent 330deg)}
.pad.done .lily{background:radial-gradient(circle at 40% 35%,#B5E2A9,#79C374 70%)}
.lic{font-size:28px;line-height:1}
.tick{position:absolute;right:2px;bottom:4px;background:var(--ok);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:grid;place-items:center;font-weight:700}
.hopper{position:absolute;left:30px;top:-14px;width:40px;height:36px;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.pt{display:flex;flex-direction:column;min-width:0;flex:1}
.pt small{font-size:14px;color:var(--muted);font-weight:700}
.pt b{font-family:var(--f-display);font-size:19px;line-height:1.15}
.pt .sub{font-size:15px;color:var(--muted)}
.stars{color:var(--sun-deep);letter-spacing:2px;font-size:17px}
.mini{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

/* chapters */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cht{background:var(--card);border-radius:var(--r);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px;border-top:8px solid var(--hue)}
.chh{display:flex;gap:10px;align-items:center}
.ci{font-size:34px;line-height:1}
.chh small{display:block;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.chh b{font-family:var(--f-display);font-size:19px;line-height:1.15}
.chs{font-size:15px;color:var(--muted)}
.chb{display:flex;gap:6px;flex-wrap:wrap}
.chb .btn{flex:1;padding:8px 4px;font-size:15px;white-space:nowrap}
.extras{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-height:110px;box-shadow:0 4px 0 var(--line)}
.ex span{font-size:30px;line-height:1.1}
.ex b{font-family:var(--f-display);font-size:18px;line-height:1.15}
.ex small{font-size:14px;color:var(--muted)}
.foot{margin-top:30px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}

/* learn */
.qhead{display:flex;align-items:center;gap:10px}
.qx{min-width:46px;min-height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:18px;text-align:center}
.qx.armed{background:var(--bad);color:#fff;border-color:var(--bad);padding:0 10px;font-size:15px}
.ltitle{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2}
.lc{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line);margin-top:12px;border-left:8px solid var(--hue,var(--leaf))}
.lch{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lch h3{font-size:24px;margin:0;flex:1}
.le{font-size:36px;line-height:1}
.lnum{font-size:14px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.lc p{margin:8px 0}
.note{background:var(--sun-soft);border-radius:12px;padding:10px 12px;margin-top:10px}
.note.red{background:var(--bad-bg)}
.eqbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--leaf-soft);border-radius:12px;padding:10px;font-weight:700}
.eqbox span{background:#fff;border-radius:8px;padding:2px 8px}
.eqbox i{font-style:normal;color:var(--leaf-deep);font-size:15px}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:17px;margin:8px 0}
table.t th,table.t td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--pond);font-size:15px;white-space:nowrap}
.dia{max-width:420px;margin:8px auto}
.leafkey{columns:2;font-size:15px;margin:4px 0 0;padding-left:22px}
.teethrow,.cycrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:10px}
figure{margin:0;text-align:center}
figcaption{font-size:14px;font-weight:700}
.arr{font-size:22px;color:var(--muted)}
.emo{font-size:40px;line-height:1}
.emo.big{font-size:84px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 0}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--ink)}

/* quiz */
.pbar{flex:1;height:12px;background:var(--pond2);border-radius:12px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.combo{font-weight:800;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.qn{font-size:15px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.sec{margin:16px 0 6px;font-size:15px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:10px;letter-spacing:.02em}
.mk{background:var(--sun-soft);color:#6E4A00;border-radius:999px;padding:1px 9px;white-space:nowrap;align-self:flex-start}
.qc{background:var(--card);border-radius:22px;padding:16px;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.prompt{font-size:21px;font-weight:700;margin:0 0 10px;line-height:1.35}
.prompt.sm{font-size:18px}
.prompt.stmt{font-family:var(--f-hand);font-size:25px;font-weight:400}
.sentence{line-height:2.1}
.hint{font-size:15px;color:var(--muted);margin:-4px 0 10px}
.pic{text-align:center;margin:4px 0 12px}
.cap{font-weight:700;font-size:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:58px;border-radius:16px;background:var(--pond);border:2px solid var(--line);font-size:19px;font-weight:700;padding:8px 12px;text-align:left;transition:transform .08s;line-height:1.25}
.opt:active{transform:scale(.97)}
.opt.spell{font-size:22px;letter-spacing:.02em;text-align:center}
.opt.sent{font-weight:400;font-size:18px}
.ol{color:var(--muted);font-weight:700}
.opt.pick{background:var(--sel-bg);border-color:var(--sel)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:#0D5A37}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:#8A1F29}
.opt.also{border-color:var(--ok);border-style:dashed}
.opt.dim{opacity:.5}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfb{text-align:center;font-size:22px}
.fixbox{margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}
.glabel{font-size:15px;font-weight:700;color:var(--muted);margin:10px 0 6px}
.pin{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sun);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chp{min-height:50px;padding:8px 14px;border-radius:14px;background:var(--pond);border:2px solid var(--line);font-size:19px;font-weight:700}
.chp.gone{visibility:hidden}
.chp.bad{background:var(--bad-bg);border-color:var(--bad)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:44px;padding:2px 12px;margin:0 4px;border-radius:12px;border:2px dashed #9FC2B5;background:var(--pond);font-weight:700;vertical-align:middle;line-height:1.2}
.slot.filled{border-style:solid;border-color:var(--sel);background:var(--sel-bg)}
.slot.sel{border-color:var(--sun-deep);background:var(--sun-soft)}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.eqline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;font-size:18px}
.eqline .term{background:var(--leaf-soft);border-radius:10px;padding:8px 10px;font-weight:700}
.eqline .slot{margin:0}
.arrow{display:inline-flex;flex-direction:column;align-items:center;font-size:26px;line-height:1;color:var(--leaf-deep)}
.arrow small{font-size:13px;font-weight:700;color:var(--muted)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{min-height:58px;border-radius:14px;background:var(--pond);border:2px solid var(--line);font-size:17px;font-weight:700;padding:6px 10px;text-align:center;line-height:1.2}
.mi.r{background:#fff}
.mi.sel{background:var(--sel-bg);border-color:var(--sel)}
.mi.ok{background:var(--ok-bg);border-color:var(--ok);color:#0D5A37}
.mi.bad{background:var(--bad-bg);border-color:var(--bad)}
.tray{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sun-soft);border-radius:16px;padding:12px;margin-bottom:12px;text-align:center}
.tray small{font-size:14px;color:var(--muted);font-weight:700}
.tray b{font-size:24px;font-family:var(--f-display)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bk{border-radius:16px;border:2px solid var(--ink);background:#fff;padding:10px;min-height:92px;display:flex;flex-direction:column;gap:6px;text-align:left}
.bk b{font-family:var(--f-display);font-size:18px}
.bk .in{display:flex;flex-wrap:wrap;gap:5px}
.bk .in span{background:var(--ok-bg);border-radius:9px;padding:1px 8px;font-size:15px;font-weight:700}
.bk .in span.miss{background:var(--bad-bg);outline:1px dashed var(--bad)}
.bk.bad{border-color:var(--bad);background:var(--bad-bg)}
.seq{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px;counter-reset:s}
.seq li{flex:1 1 130px;display:flex;align-items:center;gap:8px;border:2px dashed #9FC2B5;border-radius:14px;padding:8px 10px;min-height:58px;background:var(--pond)}
.seq li.f{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.seq li.cur{border-color:var(--sun-deep);background:var(--sun-soft)}
.seq .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.seq .st{font-weight:700}
.seq .sp .emo{font-size:30px}
.cycnote{margin-top:8px}
.leafans{margin:10px 0 0;padding-left:24px;font-size:16px}
.leafans li.ok{color:#0D5A37}
.leafans li.bad{color:#8A1F29}
.pulse{animation:pl 1s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pl{50%{opacity:.25}}
.stepdone{border-radius:12px;padding:8px 10px;margin-bottom:8px;background:var(--ok-bg)}
.stepdone.bad{background:var(--bad-bg)}
.stepdone small{display:block;font-size:14px;color:var(--muted)}
.nb{display:flex;gap:12px;align-items:center;background:repeating-linear-gradient(#fff 0 30px,#D6E4F0 30px 31px);border:1px solid var(--line);border-left:4px solid #E8A0A8;border-radius:12px;padding:12px 14px;font-family:var(--f-hand);font-size:21px}
.pen{font-size:40px}
.model{background:var(--leaf-soft);border-radius:12px;padding:10px 12px;margin:6px 0 0;line-height:1.5}
.kw{font-size:16px;margin-top:10px}
table.diff td{width:50%}

/* feedback */
.fb{margin-top:14px;border-radius:18px;padding:14px;border:2px solid var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb .ft{font-family:var(--f-display);font-size:23px;font-weight:800;margin:0 0 4px}
.fb .fa{font-size:18px;margin:6px 0}
.fb .tip{font-size:17px;margin:6px 0}
.bonus{font-size:15px;background:var(--sun);border-radius:999px;padding:2px 8px;vertical-align:middle}
.slipnote{background:#fff;border:2px dashed var(--bad);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:16px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pp .3s}
@keyframes pp{50%{transform:scale(1.08)}}

/* results */
.res{text-align:center}
.rt{font-family:var(--f-display);font-size:22px;font-weight:700;margin:6px 0 0}
.score{font-family:var(--f-display);font-size:58px;font-weight:800;line-height:1.05;margin:4px 0;font-variant-numeric:tabular-nums}
.stars.big{font-size:44px;letter-spacing:6px;margin:0}
.sub{color:var(--muted);margin:2px 0}
.perfect{font-size:20px;font-weight:700}
.wrongs{margin-top:16px;text-align:left}
.wrongs h3{font-size:22px}
.wr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:16px}
.wr b{font-size:17px}
.small .model{font-size:16px}
.shaky{padding-left:20px;font-size:16px}
.shaky li{margin:4px 0}

.sync-row{display:none;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 16px 24px;font-size:14px}
.sync-row span{background:var(--card);color:var(--leaf-deep);font-weight:700;padding:5px 12px;border-radius:99px;cursor:pointer;border:1px solid var(--line)}
.sync-row button{color:var(--muted);font-weight:700;font-size:14px;text-decoration:underline}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:30;max-width:90%;text-align:center}
@media (max-width:440px){
  body{font-size:17px}
  .opts{grid-template-columns:1fr}
  .prompt{font-size:19px}
  .emo.big{font-size:70px}
  .chip.xp{display:none}
  .mi{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="top"><div class="topin" id="topin"></div></div>
<main id="app"></main>
<div class="sync-row" id="syncRow"><span id="syncCodeLabel"></span><button id="syncChangeBtn">Use a different code</button></div>
<canvas id="fx"></canvas>
<div class="toast" id="toast" hidden></div>
<script>
/* ================= CONTENT BANK =================

  {id:'c1r3', ch:'c1', k:'answer', m:2, q:'Write any two functions of a leaf.', pts:['Leaves make food for the plant using sunlight.','Leaves help in exchange of gases through stomata.'], bad:['Leaves absorb water and minerals from the soil.','Leaves carry water to all parts of the plant.'], kw:['food','exchange of gases','stomata']},
  {id:'c1r4', ch:'c1', k:'answer', m:1, q:'How do tendrils help a plant?', pts:['Tendrils are thin, thread-like parts.','They coil around a support and help weak plants climb up.'], bad:['Tendrils make food for the plant.','Tendrils store water for the plant.'], kw:['coil','support','climb']},
  {id:'c1r5', ch:'c1', k:'reason', m:1, q:'Plants cannot make food at night.', pts:['Plants need sunlight to make food.','There is no sunlight at night.'], bad:['Plants sleep at night.','Leaves close their veins at night.'], kw:['sunlight']},
  {id:'c1r6', ch:'c1', k:'reason', m:1, q:'Crotons are red coloured plants, yet they can make their food.', pts:['Croton leaves have chlorophyll.','The green chlorophyll is hidden under the red colour.'], bad:['Crotons eat insects for food.','Crotons take food from other plants.'], kw:['chlorophyll','hidden']},
  {id:'c1r7', ch:'c1', k:'answer', m:2, q:'How are plants and animals interdependent?', pts:['Animals depend on plants for food and oxygen.','Plants use the carbon dioxide that animals breathe out.','Animals help plants by spreading their seeds.'], bad:['Plants depend on animals for food.','Animals make food for plants.'], kw:['food','oxygen','carbon dioxide','seeds']},
  {id:'c1r8', ch:'c1', k:'explain', m:1, q:'Food chain', pts:['A food chain shows who eats whom in nature.','It starts with green plants (producers) and goes on to animals (consumers).','Example: grass → grasshopper → frog → snake → eagle.'], bad:['A food chain shows how food is cooked.','A food chain always starts with a lion.'], kw:['who eats whom','producers','consumers']},
  {id:'c1r9', ch:'c1', k:'explain', m:1, q:'Photosynthesis', pts:['Green plants make their own food in their leaves.','They use carbon dioxide, water, sunlight and chlorophyll, and give out oxygen.'], bad:['Plants take ready food from the soil.','Plants make food only at night.'], kw:['carbon dioxide','water','sunlight','chlorophyll']},
  /* c2 */
  {id:'c2r1', ch:'c2', k:'reason', m:1, q:'Desert plants like cactus have sunken stomata.', pts:['Deserts are very hot and dry with little water.','Sunken stomata reduce the loss of water from the plant.'], bad:['Sunken stomata help the plant float.','Sunken stomata trap insects.'], kw:['reduce','loss of water']},
  {id:'c2r2', ch:'c2', k:'reason', m:1, q:'A cactus has very deep roots.', pts:['There is very little water near the surface of a desert.','Very deep roots go deep into the soil to absorb water.'], bad:['Deep roots help the cactus climb.','Deep roots make food for the plant.'], kw:['deep','absorb water'], slip:'Last time this answer got muddled. Keep it simple: deep roots reach water deep under the ground.'},
  {id:'c2r3', ch:'c2', k:'reason', m:1, q:'Coconut trees have thick fleshy leaves.', pts:['Coconut trees grow in coastal areas with sandy soil.','Their thick fleshy leaves store water.'], bad:['Thick leaves help the tree trap insects.','Thick leaves fall off in winter.'], kw:['store water']},
  {id:'c2r4', ch:'c2', k:'reason', m:1, q:'Trees in hilly areas are conical in shape.', pts:['Hilly areas get a lot of snow in winter.','The cone shape lets snow slide off easily.'], bad:['The cone shape helps them float.','The cone shape stores water.'], kw:['snow','slide off']},
  {id:'c2r5', ch:'c2', k:'reason', m:1, q:'Mangroves have breathing roots.', pts:['Mangroves grow in marshy soil full of water, which has very little air.','Breathing roots grow above the ground to take in air.'], bad:['Breathing roots store food.','Breathing roots trap insects.'], kw:['marshy','take in air']},
  {id:'c2r6', ch:'c2', k:'answer', m:1, q:'How do submerged plants breathe?', pts:['Submerged plants have no stomata.','They take in air from the water through their whole body surface.'], bad:['They come up to the surface to breathe.','They breathe through breathing roots.'], kw:['no stomata','body surface']},
  {id:'c2r7', ch:'c2', k:'answer', m:2, q:'How do fungi obtain their food?', pts:['Fungi have no chlorophyll, so they cannot make their own food.','Some fungi take food from other living things. They are parasites.','Some fungi get food from dead and decaying things. They are saprophytes.'], bad:['Fungi make food using sunlight.','Fungi catch insects to eat.'], kw:['no chlorophyll','parasites','saprophytes']},
  {id:'c2r8', ch:'c2', k:'explain', m:1, q:'Saprotrophs', pts:['Saprotrophs (saprophytes) get their food from dead and decaying plants and animals.','Examples: mushroom and bread mould (fungi).'], bad:['Saprotrophs are animals that hunt other animals.','Saprotrophs make their own food using sunlight.'], kw:['dead and decaying','mushroom'], slip:'In the model paper you wrote "ANIMALS that feed on dead matter". Saprotrophs are fungi like mushroom and bread mould – not animals!'},
  {id:'c2r9', ch:'c2', k:'answer', m:1, q:'How do floating plants float on water?', pts:['Floating plants have stems with air pockets.','The air makes them light, so they float.'], bad:['They have very deep roots.','They have sunken stomata.'], kw:['air pockets','light']},
  /* c3 */
  {id:'c3r1', ch:'c3', k:'answer', m:2, q:'Write any three characteristic features of mammals.', pts:['Most mammals give birth to young ones.','Mammals feed milk to their babies.','Mammals have hair or fur on their body.'], bad:['Mammals have feathers on their body.','Mammals breathe through gills.'], kw:['give birth','milk','hair'], slip:'Last time your first point was "they give them shelter" – that is parental care, not a feature of mammals.'},
  {id:'c3r2', ch:'c3', k:'answer', m:2, q:'How are albumen and yolk useful in the development of a chick?', pts:['Albumen (the white) is mainly water and protein.','Yolk (the yellow) is mainly fat and protein.','Both give food to the growing chick (embryo).'], bad:['The yolk grows into the baby chick.','Albumen makes the shell hard.'], kw:['albumen','yolk','food','embryo']},
  {id:'c3r3', ch:'c3', k:'answer', m:2, q:'How do birds show parental care?', pts:['Birds build nests to lay their eggs.','They sit on the eggs to keep them warm till the chicks hatch.','They feed the chicks and protect them from enemies.'], bad:['Birds feed milk to their chicks.','Birds leave their eggs in the water.'], kw:['nests','keep them warm','protect']},
  {id:'c3r4', ch:'c3', k:'reason', m:1, q:'A fish lays so many eggs.', pts:['Many fish eggs are eaten by other water animals.','So the fish lays many eggs, so that at least some survive.'], bad:['Fish eggs are very big and strong.','Fish look after every egg.'], kw:['eaten','survive']},
  {id:'c3r5', ch:'c3', k:'answer', m:2, q:'How does a nymph change into an adult cockroach?', pts:['A nymph looks like a small adult but has no wings.','It sheds its old skin many times. This is called moulting.','After the last moulting it has wings and becomes an adult.'], bad:['The nymph makes a cocoon around itself.','The nymph turns into a caterpillar.'], kw:['no wings','moulting']},
  {id:'c3r6', ch:'c3', k:'explain', m:1, q:'Reproduction', pts:['Reproduction is the process by which animals produce young ones.','The young ones are like their parents.'], bad:['Reproduction means shedding old skin.','Reproduction means sleeping through winter.'], kw:['process','young ones']},
  {id:'c3r7', ch:'c3', k:'explain', m:1, q:'Life span', pts:['Life span is the period of time for which an animal lives.','Different animals have different life spans.'], bad:['Life span is the number of stages in a life cycle.','Life span is the natural home of an animal.'], kw:['period of time','lives'], slip:'Say it in one clean line: the period of time for which an animal lives is its life span.'},
  {id:'c3r8', ch:'c3', k:'answer', m:1, q:'What is spawn?', pts:['Spawn is a cluster of eggs laid by a frog.','The eggs are covered with jelly and are laid in water.'], bad:['Spawn is a baby fish.','Spawn is the hard cover of a pupa.'], kw:['cluster of eggs','frog'], slip:'Last time you wrote "cluster of large no. of eggs". Add WHO lays them: eggs laid by a FROG.'},
  {id:'c3r9', ch:'c3', k:'explain', m:1, q:'Albumen', pts:['Albumen is the white part of an egg.','It is mainly water and protein. It is food for the growing chick.'], bad:['Albumen is the yellow part of the egg.','Albumen grows into the baby.'], kw:['white part','protein']},
  {id:'c3r10', ch:'c3', k:'explain', m:1, q:'Metamorphosis', pts:['Metamorphosis is the big change in body shape of an animal during its life cycle.','Example: egg → tadpole → frog.'], bad:['Metamorphosis is sleeping through the summer.','Metamorphosis means laying eggs.'], kw:['change','body shape']},
  /* c4 */
  {id:'c4r1', ch:'c4', k:'reason', m:1, q:'Elephant and camel have thick skin.', pts:['Elephants and camels live in hot places.','Their thick skin protects them from the heat of the sun.'], bad:['Thick skin helps them swim fast.','Thick skin helps them fly.'], kw:['protects','heat of the sun']},
  {id:'c4r2', ch:'c4', k:'reason', m:1, q:'Tortoise and snails have a hard shell.', pts:['The hard shell protects them from enemies.','In danger, they pull their soft body inside the shell.'], bad:['The hard shell helps them run fast.','The shell keeps them warm in snow.'], kw:['protects','enemies']},
  {id:'c4r3', ch:'c4', k:'reason', m:1, q:'Terrestrial animals have well developed sense organs.', pts:['Sense organs help them sense changes in their surroundings.','They can find food and escape from enemies.'], bad:['Sense organs help them breathe under water.','Sense organs help them fly.'], kw:['sense changes','surroundings']},
  {id:'c4r4', ch:'c4', k:'reason', m:1, q:'Frogs and grasshoppers have long and strong hind limbs.', pts:['Long, strong hind limbs help them hop and jump long distances.','Jumping helps them catch food and escape from enemies.'], bad:['Long hind limbs help them fly.','Long hind limbs help them breathe.'], kw:['hop','jump']},
  {id:'c4r5', ch:'c4', k:'answer', m:2, q:'What adaptation allows aquatic animals to swim quickly?', pts:['They have a streamlined body.','Fins and tail help them swim and change direction.','Water birds like ducks have webbed feet.'], bad:['They have long legs for running.','They have thick fur to keep warm.'], kw:['streamlined','fins','tail','webbed feet']},
  {id:'c4r6', ch:'c4', k:'answer', m:2, q:'What do carnivorous animals eat? What kind of teeth do they have?', pts:['Carnivores eat only the flesh of other animals.','They have sharp, pointed teeth called canines to tear flesh.','Carnivorous birds have sharp claws (talons) and a hooked beak.'], bad:['Carnivores eat only grass and leaves.','They have flat teeth to chew grass.'], kw:['flesh','canines','talons']},
  {id:'c4r7', ch:'c4', k:'answer', m:2, q:'How are animals classified according to their food habits? (any two)', pts:['Herbivores eat only plants – e.g. cow, deer.','Carnivores eat only the flesh of other animals – e.g. lion, tiger.','Omnivores eat both plants and animals – e.g. crow, bear.'], bad:['Producers make food for animals – e.g. lion.','Parasites eat only grass – e.g. cow.'], kw:['herbivores','carnivores','omnivores']},
  {id:'c4r8', ch:'c4', k:'answer', m:2, q:'What is a habitat? Name any two habitats.', pts:['The natural home of a plant or animal is called its habitat.','Land (terrestrial) is one habitat.','Water (aquatic) is another habitat.'], bad:['A habitat is the food an animal eats.','A habitat is a long winter sleep.'], kw:['natural home','land','water']},
  {id:'c4r9', ch:'c4', k:'explain', m:1, q:'Aerial animals', pts:['Animals that spend most of their time flying are called aerial animals.','Examples: eagle, sparrow.'], bad:['Animals that live on trees are aerial animals.','Animals that live in water are aerial animals.'], kw:['flying']},
  {id:'c4r10', ch:'c4', k:'reason', m:1, q:'Penguins have a thick layer of fat (blubber).', pts:['Penguins live in very cold places.','Blubber keeps their body warm.'], bad:['Blubber helps them fly.','Blubber helps them run fast.'], kw:['cold','warm']},
  {id:'c4d1', ch:'c4', k:'diff', m:2, q:'Differentiate between Scavengers and Parasites.', A:'Scavengers', B:'Parasites', rowA:'Feed on the flesh of dead animals.', rowB:'Live on or inside another living animal and get food from it.', exA:'vulture, hyena', exB:'lice, roundworm', pts:['Scavengers feed on the flesh of dead animals.','Examples of scavengers: vulture, hyena.','Parasites live on or inside another living animal and get food from it.','Examples of parasites: lice, roundworm.'], bad:['Scavengers live inside other animals.','Parasites eat only plants.'], kw:['dead animals','living animal']},
  /* c5 */
  {id:'c5r1', ch:'c5', k:'reason', m:1, q:'Vitamin A is essential for our body.', pts:['Vitamin A keeps our eyes healthy.','It also keeps our skin healthy.'], bad:['Vitamin A makes our bones strong.','Vitamin A gives us the most energy.'], kw:['eyes','skin']},
  {id:'c5r2', ch:'c5', k:'reason', m:1, q:'Muscles need potassium.', pts:['Potassium helps our muscles work properly.','It also helps our nerves work. Bananas give us potassium.'], bad:['Potassium helps muscles stretch like rubber.','Potassium makes our hair grow.'], kw:['muscles','work properly'], slip:'Last time you wrote "for stretching". Better: potassium helps our muscles and nerves work properly.'},
  {id:'c5r3', ch:'c5', k:'reason', m:1, q:'Vegetables should be washed before cutting them.', pts:['If we wash vegetables after cutting, vitamins and minerals get washed away.','Washing before cutting keeps the nutrients in.'], bad:['Cut vegetables cannot be washed.','Washing before cutting makes them sweet.'], kw:['vitamins','minerals','washed away']},
  {id:'c5r4', ch:'c5', k:'reason', m:1, q:'Water is essential for proper functioning of our body.', pts:['Water helps in digestion and in absorbing nutrients from food.','Water removes waste from our body through urine and sweat.'], bad:['Water gives us the most energy.','Water makes our nails and hair.'], kw:['digestion','removes waste']},
  {id:'c5r5', ch:'c5', k:'answer', m:2, q:'Write the importance of taking rest.', pts:['Rest removes tiredness.','It helps the body recover and repair itself.','Sleep refreshes our body and mind.'], bad:['Rest makes our bones weak.','Only old people need rest.'], kw:['tiredness','repair']},
  {id:'c5r6', ch:'c5', k:'answer', m:2, q:'What are the different ways of cooking food?', pts:['Boiling – rice, milk','Steaming – idli, dhokla','Frying – puri, pakora','Baking – cake, biscuits','Roasting – peanuts, corn'], bad:['Washing – vegetables','Cutting – apples'], kw:['boiling','steaming','frying','baking','roasting']},
  {id:'c5r7', ch:'c5', k:'answer', m:2, q:'Write different ways of food preservation.', pts:['Drying – keeping food in the sun','Refrigeration – keeping food cold','Canning – sealing food in airtight cans','Pickling – adding salt and oil','Adding sugar – jams and jellies'], bad:['Leaving food open in the kitchen','Adding lots of water to food'], kw:['drying','refrigeration','canning','pickling']},
  {id:'c5r8', ch:'c5', k:'answer', m:2, q:'What is fat? What is its role in our body?', pts:['Fat is an energy-giving food. It gives more energy than carbohydrates.','Fat stored under the skin keeps our body warm.','We get fat from butter, ghee, oil and nuts.'], bad:['Fat makes our nails and hair.','Fat is found only in fruits.'], kw:['energy','warm']},
  {id:'c5r9', ch:'c5', k:'explain', m:1, q:'Balanced diet', pts:['A diet that has all the nutrients in the right amounts is a balanced diet.','It also has roughage and water.'], bad:['A diet with lots of sweets and fried food.','A diet with only one kind of food.'], kw:['all the nutrients','right amounts']},
  /* c6 */
  {id:'c6r1', ch:'c6', k:'answer', m:1, q:'List two healthy eating habits.', pts:['Eat slowly and chew the food properly.','Do not overeat.','Wash hands before eating and rinse the mouth after eating.'], bad:['Eat lots of sweets between meals.','Gulp food without chewing.'], kw:['chew','overeat']},
  {id:'c6r2', ch:'c6', k:'answer', m:1, q:'Write the effects of tooth decay (any two).', pts:['Tooth decay causes toothache.','It makes holes (cavities) in the teeth.'], bad:['Tooth decay makes teeth stronger.','Tooth decay makes us grow taller.'], kw:['toothache','cavities']},
  {id:'c6r3', ch:'c6', k:'answer', m:1, q:'Why is flossing important?', pts:['Flossing removes food particles stuck between the teeth.','It stops germs and plaque from forming there.'], bad:['Flossing makes teeth longer.','Flossing helps us swallow food.'], kw:['between the teeth','germs']},
  {id:'c6r4', ch:'c6', k:'answer', m:2, q:'How are cavities formed?', pts:['Germs in our mouth feed on the sugar in food left on our teeth.','They make an acid that slowly eats away the enamel.','This makes a hole in the tooth called a cavity.'], bad:['Cavities are formed by drinking water.','Cavities are formed when milk teeth fall.'], kw:['germs','sugar','acid','enamel']},
  {id:'c6r5', ch:'c6', k:'explain', m:1, q:'Incisors', pts:['Incisors are the flat, sharp front teeth used for biting and cutting food.','An adult has 8 incisors – 4 in the upper jaw and 4 in the lower jaw.'], bad:['Incisors are the back teeth used for grinding.','An adult has only 4 incisors.'], kw:['front teeth','biting','8'], slip:'Last time you wrote "four front teeth". It is 8 in total – 4 up, 4 down.'},
  {id:'c6r6', ch:'c6', k:'answer', m:1, q:'What is the role of saliva?', pts:['Saliva makes food soft and wet, so it is easy to swallow.','It starts breaking down food in the mouth.'], bad:['Saliva pumps blood.','Saliva makes teeth white.'], kw:['soft','breaking down']},
  {id:'c6r7', ch:'c6', k:'explain', m:1, q:'Bolus', pts:['Bolus is a lump of soft, chewed food.','We swallow it and it goes down the food pipe.'], bad:['Bolus is a layer of germs on teeth.','Bolus is the longest part of the digestive system.'], kw:['lump','swallow']},
  {id:'c6r8', ch:'c6', k:'explain', m:1, q:'Peristalsis', pts:['The muscles of the food pipe push the food down to the stomach.','They move in a wave-like way. This is called peristalsis.'], bad:['Peristalsis is chewing food with molars.','Peristalsis is a kind of tooth.'], kw:['food pipe','wave-like']}
];

  var TAIL = '<path d="M98 80 Q116 84 117 102 Q106 92 95 90 Z" fill="#4DBA6E"/>';

  function mascot(level){
    var inner;
    if(level<=0) inner = spawnCluster();
    else if(level===1) inner = tadpole(false);

    else inner = frogBody(CAP);
    return '<svg viewBox="0 0 120 110" width="100%" height="100%" aria-hidden="true">'+inner+'</svg>';

  /* ---- leaf diagram ---- */
  var LEAF_PINS = [[275,38],[178,152],[214,87],[128,132],[76,212]];
  function leaf(opts){

    var state = opts.state || {};           // idx -> 'ok'|'bad'
    var cur = (typeof opts.cur==='number') ? opts.cur : -1;
    var showNames = !!opts.names;
    var s = '<svg class="leafsvg" viewBox="0 0 320 250" width="100%" role="img" aria-label="Diagram of a leaf">';

var AC = null;
function beep(ok){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    var notes = ok ? [660, 880] : [240, 190];
    notes.forEach(function(f,i){
      var o = AC.createOscillator(), g = AC.createGain(); o.type = ok?'triangle':'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, AC.currentTime+i*0.11); g.gain.exponentialRampToValueAtTime(0.18, AC.currentTime+i*0.11+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+i*0.11+0.16);
      o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+i*0.11); o.stop(AC.currentTime+i*0.11+0.18);
    });
  }catch(e){}
}
var reduceMotion = false;
try{ reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
function confetti(n){
  if(reduceMotion) return;
  var cv = document.getElementById('fx'); if(!cv || !cv.getContext) return;
  var ctx; try{ ctx = cv.getContext('2d'); }catch(e){ return; } if(!ctx) return;
  var W = cv.width = window.innerWidth, H = cv.height = window.innerHeight, P=[], cols=['#2E9E5B','#FFB627','#2C8FD0','#D63F5E','#7A5AD6','#E0702A'];
  for(var i=0;i<n;i++) P.push({x:W/2+(rnd()-.5)*W*.4, y:H*.35, vx:(rnd()-.5)*9, vy:-rnd()*9-3, s:5+rnd()*6, c:pick(cols), r:rnd()*6});
  var t=0;
  (function step(){
    ctx.clearRect(0,0,W,H); t++;
    P.forEach(function(p){ p.vy+=0.28; p.x+=p.vx; p.y+=p.vy; p.r+=0.1; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(t<110) requestAnimationFrame(step); else ctx.clearRect(0,0,W,H);
  })();
}

function startQuiz(mode, list, meta){

function newUI(q){
  if(!q) return {};
  switch(q.type){
    case 'mcq': return {picked:null, done:false};
    case 'tf': return {picked:null, fixPicked:null, done:false};
    case 'fill': return {slots:q.ans.map(function(){return null;}), sel:0, done:false};
    case 'two': return {sel:[], done:false};
    case 'match': return {L:null, R:null, got:q.left.map(function(){return false;}), miss:q.left.map(function(){return false;}), flash:null, done:false};
    case 'sort': return {i:0, placed:[], miss:0, flash:null, done:false};
    case 'seq': return {filled:q.anchor?[q.steps[0]]:[], used:{}, miss:{}, flash:null, done:false};
    case 'label': return {k:0, got:[], done:false};
    case 'steps': return {k:0, picks:[], done:false};
    case 'build': return {sel:[], done:false};
    case 'note': return {phase:'write', ticks:q.pts.map(function(){return false;}), done:false};
  }
  return {};
}

/* ---------------- grading ---------------- */
function grade(q, u){
  switch(q.type){
    case 'mcq': return u.picked===q.ans ? 1 : 0;
    case 'tf': return u.picked===q.ans ? 1 : 0;
    case 'fill': return fillScore(q,u.slots).score;
    case 'two': var c=u.sel.filter(function(x){return q.ok.indexOf(x)>=0;}).length; return c/q.need;
    case 'match': return u.miss.filter(function(m){return !m;}).length/q.left.length;
    case 'sort': return u.placed.filter(function(p){return p.ok;}).length/q.items.length;
    case 'seq': var slots=q.steps.length-(q.anchor?1:0), miss=Object.keys(u.miss).length; return (slots-miss)/slots;
    case 'label': return u.got.filter(function(g){return g.ok;}).length/q.ask.length;
    case 'steps': return u.picks.filter(function(p,k){return p===q.parts[k].ans;}).length/q.parts.length;
    case 'build':
      var g=u.sel.filter(function(x){return q.good.indexOf(x)>=0;}).length, b=u.sel.length-g;
      if(g===q.good.length && b===0) return 1;
      return Math.max(0, (g-b)/q.good.length);
    case 'note': return u.ticks.filter(Boolean).length/q.pts.length;
  }
  return 0;
}
function fillScore(q, slots){
  var res = slots.map(function(){return false;});
  if(q.any){
    var pool = q.ans.map(function(a){return a;}), usedA = {};
    slots.forEach(function(v,i){
      for(var j=0;j<pool.length;j++){ if(!usedA[j] && v!==null && pool[j].indexOf(v)>=0){ usedA[j]=1; res[i]=true; break; } }
    });
  } else {
    slots.forEach(function(v,i){ res[i] = v!==null && q.ans[i].indexOf(v)>=0; });
  }
  var ok = res.filter(Boolean).length;
  return {res:res, score: ok/slots.length};
}

function finishQ(){
  var q = QZ.list[QZ.i], u = QZ.ui;
  if(u.done) return;
  u.done = true;
  var sc = grade(q, u);
  var ok = sc>=0.999;
  QZ.res[QZ.i] = {score:sc, ok:ok};
  var xp = q.type==='note' ? u.ticks.filter(Boolean).length*4 : Math.round(10*sc);
  if(ok){ QZ.combo++; if(QZ.combo>=3) xp += Math.min(QZ.combo-2,5)*2; } else QZ.combo = 0;
  QZ.best = Math.max(QZ.best, QZ.combo);
  QZ.xp += xp; addXP(xp);
  if(ok){ clearMistake(q.key); if(QZ.mode==='slip') S.cured[q.key]=true; }
  else markMistake(q.key);
  if(q.type!=='note') beep(ok);
  save();
}

    (nx ? '<div class="btnrow"><button class="btn" data-act="plan" data-id="'+nx.id+'">▶ Start '+esc(nx.title)+'</button></div>' : '<p>All sessions done! \u{1F389}</p>')+'</div></section>';
  /* pond trail */
  var days = [{d:3, t:'Saturday 3 Oct', s:'Plant Day'},{d:4, t:'Sunday 4 Oct', s:'Animals, Body and the Boss'},{d:5, t:'Monday 5 Oct', s:'Exam Day'}];
  h += '<h2>Weekend lily pads</h2><div class="pond">';
  days.forEach(function(D){
    h += '<div class="dayhead"><b>'+D.t+'</b><span>'+D.s+'</span></div>';
    PLAN.filter(function(p){return p.day===D.d;}).forEach(function(p, k){
      var done = planDone(p), isNext = nx && nx.id===p.id;
      var icon = p.kind==='ch' ? CHMAP[p.ch].icon : p.kind==='lab' ? '✍️' : p.kind==='boss' ? '\u{1F451}' : p.kind==='slip' ? '\u{1FA7A}' : '⚡';
      var st = '';
      if(p.kind==='ch' && S.ch[p.ch]) st = '<span class="stars">'+starStr(S.ch[p.ch].stars)+'</span>';
      if(p.kind==='boss') st = '<span class="mini">'+(S.boss.a?'A: '+S.boss.a.got+'/'+S.boss.a.max:'A: –')+' · '+(S.boss.b?'B: '+S.boss.b.got+'/'+S.boss.b.max:'B: –')+'</span>';
      h += '<button class="pad'+(done?' done':'')+(isNext?' next':'')+(k%2?' alt':'')+'" data-act="plan" data-id="'+p.id+'">'+
        '<span class="lily"><span class="lic">'+icon+'</span>'+(done?'<span class="tick">✓</span>':'')+'</span>'+(isNext?'<span class="hopper">'+ART.mascot(4)+'</span>':'')+
        '<span class="pt"><small>'+esc(p.when)+' · '+p.mins+' min</small><b>'+esc(p.id.replace('S','Session '))+': '+esc(p.title)+'</b>'+(p.sub?'<span class="sub">'+esc(p.sub)+'</span>':'')+st+'</span>'+
      '</button>';
    });
  });
  h += '</div>';
  /* chapters */
  h += '<h2>Practise any chapter</h2><div class="chgrid">';
  CH.forEach(function(c){
    var r = S.ch[c.id];
    h += '<div class="cht" style="--hue:'+c.hue+'"><div class="chh"><span class="ci">'+c.icon+'</span><span><small>Chapter '+c.n+'</small><b>'+esc(c.name)+'</b></span></div>'+
      '<div class="chs">'+(r?'<span class="stars">'+starStr(r.stars)+'</span> best '+Math.round(r.best*100)+'%':'Not started yet')+'</div>'+
      '<div class="chb"><button class="btn ghost sm" data-act="learn" data-ch="'+c.id+'">\u{1F4D6} Learn</button><button class="btn sm" data-act="quest" data-ch="'+c.id+'">\u{1F3AF} Quest</button><button class="btn ghost sm" data-act="lab" data-ch="'+c.id+'">✍️ Notebook</button></div></div>';
  });
  h += '</div>';
  /* extras */
  var mcount = Object.keys(S.mist).length;
  h += '<h2>Special rounds</h2><div class="extras">'+
    '<button class="ex" data-act="slip"><span>\u{1FA7A}</span><b>Slip Doctor</b><small>Mistakes from your booklet</small></button>'+
    '<button class="ex" data-act="spell"><span>\u{1F41D}</span><b>Spelling Bee</b><small>12 science words to spell</small></button>'+
    '<button class="ex" data-act="bossA"><span>\u{1F451}</span><b>Boss: Section A</b><small>Model paper, 15 marks</small></button>'+
    '<button class="ex" data-act="bossB"><span>\u{1F4DD}</span><b>Boss: Section B</b><small>Notebook answers</small></button>'+
    '<button class="ex" data-act="mixnote"><span>\u270D\uFE0F</span><b>Mixed notebook</b><small>6 written answers, one per chapter</small></button>'+
    '<button class="ex" data-act="flash"><span>⚡</span><b>Flash Round</b><small>'+(mcount?mcount+' to fix':'Quick warm-up')+'</small></button>'+
  '</div>';
  h += '<div class="foot"><button class="btn ghost sm" data-act="parent">For grown-ups</button><button class="btn ghost sm" data-act="sound">'+(S.sound?'\u{1F50A} Sound on':'\u{1F507} Sound off')+'</button><span id="syncnote"></span></div>';
  return h;
}

function learnDia(c){
  if(c.dia==='leaf') return '<div class="dia">'+ART.leaf({names:true})+'</div>';
  if(c.dia==='teeth') return '<div class="teethrow">'+['incisor','canine','premolar','molar'].map(function(k){ return '<figure>'+ART.tooth(k,56)+'<figcaption>'+k.charAt(0).toUpperCase()+k.slice(1)+'</figcaption></figure>'; }).join('')+'</div>';
  if(c.cyc){ var s = SEQ[c.cyc]; return '<div class="cycrow">'+s.steps.map(function(st,i){ return '<figure>'+(s.pics?ART.pic(s.pics[i],60):'')+'<figcaption>'+esc(st)+'</figcaption></figure>'; }).join('<span class="arr">→</span>')+'<span class="arr">↺</span></div>'; }
  return '';
}
function renderLearn(){
  var ch = CHMAP[V.ch], cards = LEARN[V.ch], c = cards[V.i];
  var h = '<div class="qhead"><button class="qx" data-act="home" aria-label="Back home">←</button><div class="ltitle" style="--hue:'+ch.hue+'">'+ch.icon+' Chapter '+ch.n+': '+esc(ch.name)+'</div></div>';
  h += '<article class="lc" style="--hue:'+ch.hue+'"><div class="lch"><span class="le">'+c.e+'</span><h3>'+esc(c.h)+'</h3><span class="lnum">'+(V.i+1)+' / '+cards.length+'</span></div>'+c.b+learnDia(c)+'</article>';
  h += '<div class="dots">'+cards.map(function(x,i){return '<i class="'+(i===V.i?'on':'')+'"></i>';}).join('')+'</div>';
  h += '<div class="btnrow spread">'+(V.i>0?'<button class="btn ghost" data-act="lprev">← Back</button>':'<span></span>')+
    (V.i<cards.length-1 ? '<button class="btn" data-act="lnext">Next →</button>' : '<button class="btn" data-act="quest" data-ch="'+ch.id+'">\u{1F3AF} Start the quest</button>')+'</div>';
  if(V.i<cards.length-1) h += '<p class="skip"><button class="link" data-act="quest" data-ch="'+ch.id+'">Skip to the quest</button></p>';
  return h;
}

/* ----- question bodies ----- */
function optBtn(q, u, o, i, act, picked, ans, done){
  var cls='opt'+(q.spell?' spell':'');
  if(done){ if(o===ans) cls+=' ok'; else if(o===picked) cls+=' bad'; else cls+=' dim'; }
  return '<button class="'+cls+'" data-act="'+act+'" data-i="'+i+'"'+(done?' disabled':'')+'>'+(q.fx?'<span class="ol">'+LBL[i]+')</span> ':'')+esc(o)+'</button>';
}
function longOpts(opts){ return opts.some(function(o){ return o.length>24; }); }
function picHTML(q){
  var h='';
  if(q.svg){ h += '<div class="pic">'+(ART.TOOTH_KINDS.indexOf(q.svg)>=0 ? ART.tooth(q.svg,90) : ART.stage(q.svg,120))+'</div>'; }
  else if(q.pic){ h += '<div class="pic"><span class="emo big">'+q.pic+'</span>'+(q.cap?'<div class="cap">'+esc(q.cap)+'</div>':'')+'</div>'; }
  return h;
}
function bodyMCQ(q,u){
  return '<p class="prompt">'+esc(q.prompt)+'</p>'+picHTML(q)+
    '<div class="opts'+(longOpts(q.opts)?' one':'')+'">'+q.opts.map(function(o,i){ return optBtn(q,u,o,i,'opt',u.picked,q.ans,u.done); }).join('')+'</div>';
}
function bodyTF(q,u){
  var h = '<p class="prompt stmt">“'+esc(q.prompt)+'”</p><div class="tfrow">';
  [[true,'✔ True'],[false,'✘ False']].forEach(function(v){
    var cls='opt tfb';
    if(u.picked!==null){ if(v[0]===q.ans) cls+=' ok'; else if(v[0]===u.picked) cls+=' bad'; else cls+=' dim'; }
    h += '<button class="'+cls+'" data-act="tf" data-v="'+(v[0]?1:0)+'"'+(u.picked!==null?' disabled':'')+'>'+v[1]+'</button>';
  });
  h += '</div>';
  if(u.picked!==null && q.fix){
    h += '<div class="fixbox"><p class="glabel">'+(u.picked===q.ans?'Yes, it is FALSE! Now fix it for a bonus:':'It is FALSE. Can you fix it?')+'</p><p class="prompt sm">'+esc(q.fix.prompt)+'</p><div class="opts one">'+
      q.fix.opts.map(function(o,i){ return optBtn({fx:false},u,o,i,'fix',u.fixPicked,q.fix.ans,u.done); }).join('')+'</div></div>';
  }
  return h;
}
function bodyFill(q,u){
  var res = u.done ? fillScore(q,u.slots).res : null;
  function slot(i){
    var v=u.slots[i], cls='slot'+(v!==null?' filled':'')+(!u.done && u.sel===i?' sel':'');
    if(res) cls += res[i] ? ' ok' : ' bad';
    return '<button class="'+cls+'" data-act="slot" data-i="'+i+'"'+(u.done?' disabled':'')+'>'+(v!==null?esc(v):' ? ')+'</button>';
  }
  var h;
  if(q.eq){
    var cells = q.terms.map(function(t,i){ var b=q.blank.indexOf(i); return b>=0 ? slot(b) : '<span class="term">'+esc(t)+'</span>'; });
    h = '<p class="prompt">Complete the equation.</p><div class="eqline">'+cells[0]+'<b>+</b>'+cells[1]+'<span class="arrow"><small>'+esc(q.over[0])+'</small>⟶<small>'+esc(q.over[1])+'</small></span>'+cells[2]+'<b>+</b>'+cells[3]+'</div>';
  } else {
    h = '<p class="prompt sentence">';
    q.parts.forEach(function(p,i){ h += esc(p); if(i<q.parts.length-1) h += slot(i); });
    h += '</p>';
  }
  h += '<div class="chips">'+q.chips.map(function(c,i){ var used=u.slots.indexOf(c)>=0; return '<button class="chp'+(used?' gone':'')+'" data-act="chip" data-i="'+i+'"'+(u.done||used?' disabled':'')+'>'+esc(c)+'</button>'; }).join('')+'</div>';
  if(!u.done) h += '<div class="btnrow"><button class="btn ink" data-act="check"'+(u.slots.indexOf(null)>=0?' disabled':'')+'>Check</button></div>';
  return h;
}
function bodyTwo(q,u){
  var h = '<p class="prompt">Give two examples: <b>'+esc(q.prompt)+'</b></p><p class="hint">Tap the 2 that fit.</p><div class="opts">';
  q.chips.forEach(function(c,i){
    var sel = u.sel.indexOf(c)>=0, cls='opt';
    if(u.done){ var good=q.ok.indexOf(c)>=0; cls += sel ? (good?' ok':' bad') : (good?' also':' dim'); }
    else if(sel) cls+=' pick';
    h += '<button class="'+cls+'" data-act="tog" data-i="'+i+'"'+(u.done?' disabled':'')+'>'+esc(c)+'</button>';
  });
  h += '</div>';
  if(!u.done) h += '<div class="btnrow"><button class="btn ink" data-act="check"'+(u.sel.length<q.need?' disabled':'')+'>Check</button></div>';
  return h;
}
function bodyMatch(q,u){
  var h = '<p class="prompt">Tap one on the left, then its partner on the right.</p><div class="mrow"><div class="mcol">';
  q.left.forEach(function(l,i){
    var cls='mi'+(u.got[i]?' ok':'')+(u.L===i?' sel':'')+(u.flash&&u.flash.L===i?' bad shake':'');
    h += '<button class="'+cls+'" data-act="ml" data-i="'+i+'"'+(u.got[i]||u.done?' disabled':'')+'>'+esc(l)+'</button>';
  });
  h += '</div><div class="mcol">';
  q.right.forEach(function(r,j){
    var li = q.pair.indexOf(j), cls='mi r'+(u.got[li]?' ok':'')+(u.R===j?' sel':'')+(u.flash&&u.flash.R===j?' bad shake':'');
    h += '<button class="'+cls+'" data-act="mr" data-i="'+j+'"'+(u.got[li]||u.done?' disabled':'')+'>'+esc(r)+'</button>';
  });
  return h + '</div></div>';
}
function bodySort(q,u){
  var h = '<p class="prompt">'+esc(q.prompt)+'</p>';
  if(!u.done){ var it=q.items[u.i]; h += '<div class="tray"><small>'+(u.i+1)+' of '+q.items.length+' · Where does this go?</small><b class="pop">'+esc(it.t)+'</b></div>'; }
  h += '<div class="buckets">';
  q.buckets.forEach(function(b,bi){
    var inB = u.placed.filter(function(p){return p.b===bi;});
    h += '<button class="bk'+(u.flash===bi?' bad shake':'')+'" data-act="bucket" data-i="'+bi+'"'+(u.done?' disabled':'')+'><b>'+esc(b)+'</b><span class="in">'+
      inB.map(function(p){ return '<span class="'+(p.ok?'':'miss')+'">'+esc(p.t)+'</span>'; }).join('')+'</span></button>';
  });
  return h + '</div>';
}
function bodySeq(q,u){
  var h = '<p class="prompt">'+esc(q.prompt)+'</p><p class="hint">'+(q.anchor?'The first stage is done for you. ':'')+'Tap the stages in the right order.</p><ol class="seq'+(q.cyc?' cyc':'')+'">';
  q.steps.forEach(function(st,i){
    var f = u.filled[i];
    h += '<li class="'+(f?'f':'')+(i===u.filled.length&&!u.done?' cur':'')+'"><span class="n">'+(i+1)+'</span>'+(f && q.pics ? '<span class="sp">'+ART.pic(q.pics[i],44)+'</span>' : '')+'<span class="st">'+(f?esc(f):'?')+'</span></li>';
  });
  h += '</ol>'+(q.cyc?'<p class="hint cycnote">↺ and back to the start!</p>':'');
  h += '<div class="chips">'+q.chips.map(function(c,i){ return '<button class="chp'+(u.used[c]?' gone':'')+(u.flash===c?' bad shake':'')+'" data-act="seq" data-i="'+i+'"'+(u.used[c]||u.done?' disabled':'')+'>'+esc(c)+'</button>'; }).join('')+'</div>';
  return h;
}
function bodyLabel(q,u){
  var state={}; u.got.forEach(function(g,k){ state[q.ask[k]] = g.ok?'ok':'bad'; });
  var cur = u.done ? -1 : q.ask[u.k];
  var h = '<p class="prompt">'+esc(q.prompt)+'</p><div class="dia">'+ART.leaf({ask:q.ask, state:state, cur:cur})+'</div>';
  if(!u.done) h += '<p class="glabel">What is part number <b class="pin">'+(u.k+1)+'</b>?</p>';
  h += '<div class="chips">'+q.chips.map(function(c,i){ var used = u.got.some(function(g){return g.pick===c && g.ok;}); return '<button class="chp'+(used?' gone':'')+'" data-act="lab1" data-i="'+i+'"'+(u.done||used?' disabled':'')+'>'+esc(c)+'</button>'; }).join('')+'</div>';
  if(u.got.length){ h += '<ol class="leafans">'+u.got.map(function(g,k){ return '<li class="'+(g.ok?'ok':'bad')+'">'+(g.ok?esc(g.pick):'<s>'+esc(g.pick)+'</s> → '+esc(LEAF_PARTS[q.ask[k]]))+'</li>'; }).join('')+'</ol>'; }
  return h;
}
function bodySteps(q,u){
  var h = '<div class="pic"><span class="emo big">'+q.pic+'</span></div>';
  q.parts.forEach(function(p,k){
    if(k<u.k){ var ok=u.picks[k]===p.ans; h += '<div class="stepdone '+(ok?'ok':'bad')+'"><small>'+esc(p.prompt)+'</small><b>'+(ok?'✓ ':'✗ '+esc(u.picks[k])+' → ')+esc(p.ans)+'</b></div>'; }
  });
  if(!u.done){ var p=q.parts[u.k]; h += '<p class="prompt">'+(u.k===0?'':LBL[u.k-1]+') ')+esc(p.prompt)+'</p><div class="opts'+(longOpts(p.opts)?' one':'')+'">'+p.opts.map(function(o,i){ return '<button class="opt" data-act="step" data-i="'+i+'">'+esc(o)+'</button>'; }).join('')+'</div>'; }
  return h;
}
function bodyBuild(q,u){
  var h = '<p class="prompt">'+esc(q.prompt)+'</p><p class="hint">Tap all the sentences that belong in a good answer. There are <b>'+q.good.length+'</b>.</p><div class="opts one">';
  q.chips.forEach(function(c,i){
    var sel=u.sel.indexOf(c)>=0, cls='opt sent';
    if(u.done){ var good=q.good.indexOf(c)>=0; cls += sel ? (good?' ok':' bad') : (good?' also':' dim'); } else if(sel) cls+=' pick';
    h += '<button class="'+cls+'" data-act="tog" data-i="'+i+'"'+(u.done?' disabled':'')+'>'+esc(c)+'</button>';
  });
  h += '</div>';
  if(!u.done) h += '<div class="btnrow"><button class="btn ink" data-act="check"'+(u.sel.length<1?' disabled':'')+'>Check</button></div>';
  return h;
}
function modelHTML(q){
  if(q.diff){
    var d=q.diff;
    return '<div class="tw"><table class="t diff"><tr><th>'+esc(d.A)+'</th><th>'+esc(d.B)+'</th></tr><tr><td>'+esc(d.rowA)+'</td><td>'+esc(d.rowB)+'</td></tr><tr><td>e.g. '+esc(d.exA)+'</td><td>e.g. '+esc(d.exB)+'</td></tr></table></div>';
  }
  return '<p class="model">'+q.pts.map(function(p){ return hl(p,q.kw); }).join(' ')+'</p>';
}
function bodyNote(q,u){
  var h = '<p class="prompt">'+esc(q.prompt)+'</p>';
  if(u.phase==='write'){
    h += '<div class="nb"><span class="pen">✍️</span><p>Write your answer in your <b>notebook</b>. It is worth <b>'+q.marks+' mark'+(q.marks>1?'s':'')+'</b>, so write '+(q.marks>1?'3 or 4 full sentences':'1 or 2 full sentences')+'.</p></div>';
    h += '<div class="btnrow"><button class="btn" data-act="nbshow">I’ve written it – check</button></div>';
    return h;
  }
  h += '<p class="glabel">Tick each idea you wrote:</p><div class="opts one">';
  q.pts.forEach(function(p,i){ var on=u.ticks[i]; h += '<button class="opt sent'+(on?' ok':'')+'" data-act="nbpt" data-i="'+i+'"'+(u.done?' disabled':'')+'>'+(on?'☑ ':'☐ ')+hl(p,q.kw)+'</button>'; });
  h += '</div>';
  if(q.diff) h += '<p class="glabel">Draw it as a table:</p>'+modelHTML(q);
  if(q.kw && q.kw.length) h += '<p class="kw">Key words to spell right: '+q.kw.map(function(k){return '<b>'+esc(k)+'</b>';}).join(', ')+'</p>';
  if(!u.done) h += '<div class="btnrow"><button class="btn ink" data-act="nbdone">Done</button></div>';
  return h;
}
function fixSentence(fix){
  var p = fix.prompt.replace(/^Correct it: ?/,'');
  if(p.indexOf('___')>=0) return p.replace('___', fix.ans);
  if(p.indexOf('…')>=0) return p.replace('…', fix.ans);
  return (p ? p+' ' : '')+fix.ans;
}
function answerLine(q,u){
  switch(q.type){
    case 'mcq': return 'Answer: <b>'+esc(q.ans)+'</b>';
    case 'tf': return 'Answer: <b>'+(q.ans?'True':'False')+'</b>'+(q.fix?'<br>Correct version: <b>'+esc(fixSentence(q.fix))+'</b>':'');
    case 'fill':
      if(q.eq){ return 'Carbon dioxide + Water ⟶ Food + Oxygen'; }
      var i=0; return q.parts.map(function(p,k){ return esc(p)+(k<q.parts.length-1?'<b>'+esc(q.ans[k][0])+'</b>':''); }).join('');
    case 'two': return 'Right answers: <b>'+q.ok.map(esc).join(', ')+'</b>';
    case 'match': return q.left.map(function(l,i){ return esc(l)+' → <b>'+esc(q.right[q.pair[i]])+'</b>'; }).join('<br>');
    case 'sort': return '';
    case 'seq': return '<b>'+q.steps.map(esc).join(' → ')+'</b>'+(q.cyc?' ↺':'');
    case 'label': return '';
    case 'steps': return '';
    case 'build': return '<span class="glabel">Write it like this:</span>'+modelHTML(q);
    case 'note': return '';
  }
  return '';
}
function fbHTML(q,u,r){
  var ok = r.ok, h = '<div class="fb'+(ok?'':' bad')+'">';
  if(q.type==='note'){
    var n=u.ticks.filter(Boolean).length;
    h += '<p class="ft">'+(n===q.pts.length?'Full marks! '+PRAISE[0]:n?'You got '+n+' of '+q.pts.length+' ideas.':'Let’s learn this one.')+'</p>';
    if(n<q.pts.length) h += '<p class="tip">Add the missing ideas in your notebook in a different colour.</p>';
  } else {
    var tfFix = q.type==='tf' && q.fix && u.fixPicked!==null;
    h += '<p class="ft">'+(ok?pick(PRAISE):pick(OOPS))+(tfFix && u.fixPicked===q.fix.ans ? ' <span class="bonus">+5 fix bonus</span>':'')+'</p>';
    var al = answerLine(q,u); if(al && (!ok || q.type==='build' || q.type==='tf')) h += '<div class="fa">'+al+'</div>';
  }
  if(q.tip) h += '<p class="tip">'+esc(q.tip)+'</p>';
  if(q.note) h += '<p class="tip">'+esc(q.note)+'</p>';
  if(q.slip) h += '<div class="slipnote">\u{1FA7A} '+esc(q.slip)+'</div>';
  h += '<div class="btnrow"><button class="btn" data-act="next">'+(QZ.i<QZ.list.length-1?'Next →':'See my score')+'</button></div></div>';
  return h;
}
function renderQuiz(){
  var q = QZ.list[QZ.i], u = QZ.ui, n = QZ.list.length;
  var h = '<div class="qhead"><button class="qx'+(armed.quit?' armed':'')+'" data-act="quit" aria-label="Quit">'+(armed.quit?'Tap again to quit':'✕')+'</button>'+
    '<div class="pbar"><i style="width:'+Math.round(QZ.i/n*100)+'%"></i></div><span class="combo">'+(QZ.combo>=2?'\u{1F525}'+QZ.combo:'')+'</span><span class="qn">'+(QZ.i+1)+'/'+n+'</span></div>';
  var marks = (QZ.mode==='bossA'||QZ.mode==='bossB') ? '<span class="mk">'+q.marks+' mark'+(q.marks===1?'':'s')+'</span>' : '';
  h += '<div class="sec"><span>'+esc(q.sec || q.label)+(q.part?' · '+q.part+')':'')+'</span>'+marks+'</div>';
  var body = '';
  switch(q.type){
    case 'mcq': body=bodyMCQ(q,u); break; case 'tf': body=bodyTF(q,u); break; case 'fill': body=bodyFill(q,u); break;
    case 'two': body=bodyTwo(q,u); break; case 'match': body=bodyMatch(q,u); break; case 'sort': body=bodySort(q,u); break;
    case 'seq': body=bodySeq(q,u); break; case 'label': body=bodyLabel(q,u); break; case 'steps': body=bodySteps(q,u); break;
    case 'build': body=bodyBuild(q,u); break; case 'note': body=bodyNote(q,u); break;
  }
  h += '<div class="qc" data-type="'+q.type+'">'+body+'</div>';
  if(u.done) h += fbHTML(q,u,QZ.res[QZ.i]);
  return h;
}
function renderResult(){
  var boss = QZ.mode==='bossA'||QZ.mode==='bossB';
  var h = '<div class="res"><div class="bigfrog sm">'+ART.mascot(lvl(S.xp))+'</div><p class="rt">'+esc(QZ.meta.title||'Done')+'</p>';
  if(boss) h += '<p class="score">'+QZ.marks+' / '+QZ.maxM+'</p><p class="sub">marks'+(QZ.mode==='bossB'?' (notebook answers are self-checked)':'')+'</p>';
  else h += '<p class="score">'+Math.round(QZ.pct*100)+'%</p>';
  h += '<p class="stars big">'+starStr(QZ.stars)+'</p><p class="sub">+'+QZ.xp+' XP'+(QZ.best>=3?' · best streak \u{1F525}'+QZ.best:'')+'</p>';
  var wrong = QZ.list.map(function(q,i){return {q:q, r:QZ.res[i]};}).filter(function(x){ return x.r && !x.r.ok; });
  if(wrong.length){
    h += '<div class="wrongs"><h3>Remember these</h3>'+wrong.map(function(x){
      var q=x.q, line = q.type==='note' || q.type==='build' ? '<div class="small">'+modelHTML(q)+'</div>' : (answerLine(q,{})||'');
      return '<div class="wr"><b>'+esc(q.prompt||q.label)+'</b><div>'+line+'</div></div>';
    }).join('')+'</div>';
  } else h += '<p class="perfect">Every single one right! \u{1F31F}</p>';
  if(QZ.mode==='bossA' && !S.boss.b) h += '<div class="btnrow center"><button class="btn" data-act="bossB">Go to Section B →</button></div>';
  h += '<div class="btnrow center"><button class="btn ghost" data-act="again">Play again</button><button class="btn" data-act="home">Back to the pond</button></div></div>';
  return h;
}
function renderParent(){
  var h = '<div class="qhead"><button class="qx" data-act="home" aria-label="Back home">←</button><div class="ltitle">For grown-ups</div></div>';
  h += '<div class="lc"><h3>Weekend plan</h3><div class="tw"><table class="t"><tr><th>Session</th><th>When</th><th>Status</th></tr>'+
    PLAN.map(function(p){ return '<tr><td>'+esc(p.id+' '+p.title)+'</td><td>'+esc(p.when)+'</td><td>'+(planDone(p)?'✅ done':'–')+'</td></tr>'; }).join('')+'</table></div></div>';
  h += '<div class="lc"><h3>Chapters</h3><div class="tw"><table class="t"><tr><th>Chapter</th><th>Best</th><th>Plays</th></tr>'+
    CH.map(function(c){ var r=S.ch[c.id]; return '<tr><td>'+esc(c.n+'. '+c.name)+'</td><td>'+(r?Math.round(r.best*100)+'%':'–')+'</td><td>'+(r?r.plays:0)+'</td></tr>'; }).join('')+'</table></div>'+
    '<p>Boss A: <b>'+(S.boss.a?S.boss.a.got+' / '+S.boss.a.max:'not yet')+'</b> · Boss B: <b>'+(S.boss.b?S.boss.b.got+' / '+S.boss.b.max:'not yet')+'</b> (Section B is self-checked – worth a look at her notebook).</p></div>';
  var mk = Object.keys(S.mist).filter(function(id){return TPL[id];}).sort(function(a,b){return S.mist[b].n-S.mist[a].n;});
  h += '<div class="lc"><h3>Still shaky ('+mk.length+')</h3>'+(mk.length? '<ul class="shaky">'+mk.slice(0,25).map(function(id){ var d=TPL[id].d; return '<li><b>'+esc(CHMAP[TPL[id].ch]?('Ch '+CHMAP[TPL[id].ch].n):'Mixed')+'</b> '+esc(d.q||d.id)+' <span class="mini">×'+S.mist[id].n+'</span></li>'; }).join('')+'</ul>' : '<p>Nothing yet.</p>')+'</div>';
  h += '<div class="lc"><h3>Settings</h3><p id="syncnote"></p><div class="btnrow"><button class="btn ghost'+(armed.reset?' danger':'')+'" data-act="reset">'+(armed.reset?'Tap again to clear all progress':'Clear progress')+'</button></div></div>';
  return h;
}
function render(){
  var top = document.getElementById('topin'); if(top) top.innerHTML = renderTop();
  var app = document.getElementById('app'); if(!app) return;
  var h = '';
  if(V.name==='home') h = renderHome();
  else if(V.name==='learn') h = renderLearn();
  else if(V.name==='quiz') h = renderQuiz();
  else if(V.name==='result') h = renderResult();
  else if(V.name==='parent') h = renderParent();
  app.innerHTML = h;
  paintSync();
}

document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el || el.disabled) return;
  var a = el.getAttribute('data-act');
  if(a!=='quit' && armed.quit){ armed.quit=false; }
  if(a!=='reset' && armed.reset){ armed.reset=false; }
  if(ACT[a]) ACT[a](el);
});

render();
setTimeout(initCloud, 0);

/* Study Hub cross-device sync (GitHub Pages build loads firebase + sync.js; absent elsewhere = no-op) */
if(typeof DikshaSync!=='undefined' && DikshaSync.init()){
  try{ DikshaSync.attachUI(); }catch(e){}
  DikshaSync.pull(STORE_KEY).then(function(remote){
    if(remote && typeof remote==='object' && (remote.t||0) > (S.t||0)){ S = normalize(remote); saveLocal(); if(V.name!=='quiz') render(); }
    DikshaSync.arm();
    try{ DikshaSync.push(STORE_KEY, S); }catch(e){}
  });
}

/* QA hooks */
window.__SCI = {TPL:TPL, make:make, chapterSet:chapterSet, labSet:labSet, bossA:bossA, bossB:bossB, slipSet:slipSet, flashSet:flashSet, spellSet:spellSet, mixNoteSet:mixNoteSet,
  grade:grade, fillScore:fillScore, start:startQuiz, state:function(){return S;}, quiz:function(){return QZ;}, view:function(){return V;}, act:ACT, render:render, idsOf:idsOf, planDone:planDone, sync:function(){return SYNC;}};
})();

</script>
