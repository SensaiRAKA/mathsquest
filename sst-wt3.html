  <style>
    /* Custom Typography & Base Styling */
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 50%, #ede9fe 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3, .font-display {
      font-family: 'Fredoka', sans-serif;
    }

    /* 3D Flashcard Flip Mechanics */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Both faces share one grid cell, so the card grows to fit the longer side */
    #flashcard-inner { display: grid; }
    #flashcard-inner > div { position: relative; grid-area: 1 / 1; }

    /* Micro-animations */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes pop {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .animate-pop {
      animation: pop 0.35s ease-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    /* Confetti Canvas Overlay */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* Print styling for Quick Cheat Sheet */
    @media print {
      body {
        background: white !important;
      }
      .no-print {
        display: none !important;
      }
      .print-full {
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
      }
    }
  </style>

  <script>
    /*****************************************************************
     * 1. SOUND EFFECTS ENGINE (Web Audio API - Zero External Files)
     *****************************************************************/
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!state.soundOn) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'correct') {
          // Bright rising 2-note chime
          playTone(ctx, 523.25, now, 0.12, 'sine', 0.18);
          playTone(ctx, 659.25, now + 0.1, 0.22, 'sine', 0.18);
        } else if (type === 'wrong') {
          // Gentle low boop
          playTone(ctx, 260, now, 0.15, 'triangle', 0.16);
          playTone(ctx, 210, now + 0.12, 0.2, 'triangle', 0.14);
        } else if (type === 'flip') {
          playTone(ctx, 420, now, 0.06, 'sine', 0.08);
        } else if (type === 'fanfare') {
          // Celebratory arpeggio
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            playTone(ctx, freq, now + idx * 0.09, 0.24, 'triangle', 0.18);
          });
        } else if (type === 'hit') {
          playTone(ctx, 320, now, 0.08, 'sawtooth', 0.12);
          playTone(ctx, 587.33, now + 0.07, 0.18, 'sine', 0.15);
        }
      } catch (e) {
        // Ignore audio errors gracefully
      }
    }

    function playTone(ctx, freq, startTime, duration, waveType, volume) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = waveType;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(volume, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    /*****************************************************************
     * 2. CONFETTI CELEBRATION ENGINE
     *****************************************************************/
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [];
    let confettiAnimId = null;

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function launchConfetti(count = 70) {
      const colors = ['#38bdf8', '#fbbf24', '#34d399', '#f472b6', '#a78bfa', '#fb7185'];
      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: Math.random() * confettiCanvas.width,
          y: -10 - Math.random() * 60,
          w: 7 + Math.random() * 6,
          h: 5 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 6,
          vy: 2.5 + Math.random() * 4.5,
          rot: Math.random() * 360,
          vrot: (Math.random() - 0.5) * 12,
          life: 120 + Math.random() * 60
        });
      }
      if (!confettiAnimId) animateConfetti();
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.rot += p.vrot;
        p.life--;

        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rot * Math.PI) / 180);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        confettiCtx.restore();
      });
      confettiParticles = confettiParticles.filter(p => p.life > 0 && p.y < confettiCanvas.height + 20);
      if (confettiParticles.length > 0) {
        confettiAnimId = requestAnimationFrame(animateConfetti);
      } else {
        confettiAnimId = null;
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

    /*****************************************************************
     * 4. STATE MANAGEMENT & LOCALSTORAGE PERSISTENCE
     *****************************************************************/
    const STORAGE_KEY = 'diksha_sst_wt3_v1';

    // A factory, so reset never reuses arrays that were already filled.
    function freshState() {
      return {
        xp: 0, stars: 0, combo: 0, soundOn: true,
        chapter: 'wt3', // 'wt3' | 'ch7' | 'ch8' | 'ch9'
        mode: 'quiz',   // 'quiz' | 'match' | 'flashcards' | 'boss' | 'cheatsheet'
        // Field names below are what parent-dashboard.html reads.
        mistakes: [], days: {}, lastDay: '', t: 0,
        masteredFlashcards: [], rewardedCards: [], completedDecks: [],
        defeatedBosses: [], bossClears: []
      };
    }

    function normalizeState(raw) {
      const base = freshState();
      if (!raw || typeof raw !== 'object') return base;
      const out = { ...base, ...raw };
      Object.keys(base).forEach(k => {
        if (Array.isArray(base[k]) && !Array.isArray(out[k])) out[k] = [];
      });
      if (!out.days || typeof out.days !== 'object') out.days = {};
      return out;
    }

    let state = loadState();

    // Runtime session states for modes
    let quizSession = {
      retryMissedOnly: false,
      typeFilter: 'all',
      queue: [],
      index: 0,
      score: 0,
      answered: false,
      typedInput: ''
    };

    let matchSession = {
      deckId: null,
      leftCards: [],
      rightCards: [],
      selectedLeft: null,
      matchedLeftIds: [],
      matchedRightIds: [],
      moves: 0,
      seconds: 0,
      timerHandle: null,
      wrongPair: null
    };

    let flashSession = {
      index: 0,
      flipped: false,
      hideMastered: false
    };

    let bossSession = {
      index: 0,
      revealed: false,
      checkedPoints: [],
      scratchpad: ''
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return normalizeState(JSON.parse(saved));
      } catch (e) {}
      return freshState();
    }

    // Screen choices only (tab, chapter, sound): never marks progress as newer.
    function savePrefs() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    // Real progress: stamp the day, then save and sync.
    function saveState() {
      const today = new Date().toLocaleDateString('en-CA');
      state.lastDay = today;
      state.days[today] = (state.days[today] || 0) + 1;
      state.t = Date.now();
      savePrefs();
      if (typeof DikshaSync !== 'undefined') {
        try { DikshaSync.push(STORAGE_KEY, state); } catch (e) {}
      }
    }

    function initSync() {
      if (typeof DikshaSync === 'undefined' || !DikshaSync.init()) return;
      try { DikshaSync.attachUI(); } catch (e) {}
      DikshaSync.pull(STORAGE_KEY).then(function (remote) {
        if (remote && typeof remote === 'object' && (remote.t || 0) > (state.t || 0)) {
          state = normalizeState(remote);
          savePrefs();
          initQuizQueue();
          updateHUD();
          renderCurrentMode();
        }
        DikshaSync.arm();
        if (state.t) { try { DikshaSync.push(STORAGE_KEY, state); } catch (e) {} }
      });
    }

    function getLevelInfo(xp) {
      if (xp >= 600) return { level: 4, title: '🏆 Level 4: SST Champion', min: 600, next: null };
      if (xp >= 350) return { level: 3, title: '⛏️ Level 3: Mineral Hunter', min: 350, next: 600 };
      if (xp >= 150) return { level: 2, title: '🏗️ Level 2: Dam Builder', min: 150, next: 350 };
      return { level: 1, title: '🌊 Level 1: Water Explorer', min: 0, next: 150 };
    }

    function addXP(amount, starBonus = 0, reason = '') {
      const prevLevel = getLevelInfo(state.xp).level;
      state.xp += amount;
      if (starBonus > 0) state.stars += starBonus;
      const newLevelInfo = getLevelInfo(state.xp);
      saveState();
      updateHUD();

      if (reason) showToast(`+${amount} XP ${starBonus ? `& +${starBonus}⭐` : ''} — ${reason}`, 'success');

      if (newLevelInfo.level > prevLevel) {
        playSound('fanfare');
        launchConfetti(120);
        showToast(`🎉 LEVEL UP! You are now ${newLevelInfo.title}!`, 'levelup');
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const styles = {
        success: 'bg-emerald-500 text-white border-emerald-300',
        levelup: 'bg-gradient-to-r from-amber-400 via-orange-500 to-pink-500 text-white border-yellow-200 text-base',
        info: 'bg-sky-600 text-white border-sky-300'
      };
      el.className = `px-4 py-2.5 rounded-2xl shadow-xl border-2 font-bold text-sm animate-pop ${styles[type] || styles.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s';
        setTimeout(() => el.remove(), 300);
      }, 2800);
    }

    function updateHUD() {
      const info = getLevelInfo(state.xp);
      document.getElementById('hud-level-badge').textContent = info.title;
      document.getElementById('hud-streak').textContent = state.combo;
      document.getElementById('hud-stars').textContent = state.stars;
      document.getElementById('hud-xp-text').textContent = `${state.xp} XP`;

      if (info.next) {
        const pct = Math.min(100, Math.round(((state.xp - info.min) / (info.next - info.min)) * 100));
        document.getElementById('hud-xp-bar').style.width = `${pct}%`;
        document.getElementById('hud-next-level').textContent = `${info.next - state.xp} XP to Level ${info.level + 1}`;
      } else {
        document.getElementById('hud-xp-bar').style.width = '100%';
        document.getElementById('hud-next-level').textContent = 'Max Champion Rank Reached! 🌟';
      }

      // Sound toggle UI
      document.getElementById('sound-icon').textContent = state.soundOn ? '🔊' : '🔇';
      document.getElementById('sound-label').textContent = state.soundOn ? 'Sound ON' : 'Sound OFF';

      // Active chapter tab styling
      document.querySelectorAll('.chapter-tab').forEach(btn => {
        const active = btn.dataset.chapter === state.chapter;
        if (active) {
          btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-700', 'scale-105');
          btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-200', 'hover:bg-sky-50');
        } else {
          btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-700', 'scale-105');
          btn.classList.add('bg-white', 'text-slate-700', 'border-slate-200', 'hover:bg-sky-50');
        }
      });

      // Active mode tab styling
      document.querySelectorAll('.mode-tab').forEach(btn => {
        const active = btn.dataset.mode === state.mode;
        if (active) {
          btn.classList.add('bg-gradient-to-b', 'from-sky-500', 'to-indigo-600', 'text-white', 'border-indigo-700', 'shadow-lg', '-translate-y-0.5');
          btn.classList.remove('bg-white/90', 'text-slate-700', 'border-slate-200', 'hover:bg-white');
        } else {
          btn.classList.remove('bg-gradient-to-b', 'from-sky-500', 'to-indigo-600', 'text-white', 'border-indigo-700', 'shadow-lg', '-translate-y-0.5');
          btn.classList.add('bg-white/90', 'text-slate-700', 'border-slate-200', 'hover:bg-white');
        }
      });
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      savePrefs();
      updateHUD();
      if (state.soundOn) playSound('correct');
    }

    function openResetModal() {
      const m = document.getElementById('reset-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeResetModal() {
      const m = document.getElementById('reset-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function confirmResetProgress() {
      const soundOn = state.soundOn;
      state = { ...freshState(), soundOn };
      saveState();
      quizSession.retryMissedOnly = false;
      quizSession.typeFilter = 'all';
      flashSession.flipped = false;
      bossSession.revealed = false;
      bossSession.checkedPoints = [];
      closeResetModal();
      clearMatchTimer();
      matchSession.deckId = null;
      initQuizQueue();
      flashSession.index = 0;
      bossSession.index = 0;
      updateHUD();
      renderCurrentMode();
      showToast('Progress reset! Ready for a fresh adventure!', 'info');
    }

    function filterByChapter(items) {
      if (state.chapter === 'wt3') return items.filter(i => i.chapter === 'ch7' || i.chapter === 'ch8' || i.chapter === 'wt3');
      if (state.chapter === 'ch7') return items.filter(i => i.chapter === 'ch7');
      if (state.chapter === 'ch8') return items.filter(i => i.chapter === 'ch8');
      if (state.chapter === 'ch9') return items.filter(i => i.chapter === 'ch9');
      return items;
    }

    function setChapter(chap) {
      state.chapter = chap;
      savePrefs();
      clearMatchTimer();
      matchSession.deckId = null;
      flashSession.index = 0;
      flashSession.flipped = false;
      bossSession.index = 0;
      bossSession.revealed = false;
      bossSession.checkedPoints = [];
      initQuizQueue();
      updateHUD();
      renderCurrentMode();
    }

    function setMode(mode) {
      if (state.mode === 'match' && mode !== 'match') clearMatchTimer();
      state.mode = mode;
      savePrefs();
      updateHUD();
      if (mode === 'quiz' && quizSession.queue.length === 0) initQuizQueue();
      renderCurrentMode();
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /*****************************************************************
     * 5. MODE 1: QUIZ ARENA
     *****************************************************************/
    function initQuizQueue() {
      let pool = filterByChapter(QUIZ_QUESTIONS);
      if (quizSession.retryMissedOnly) {
        pool = QUIZ_QUESTIONS.filter(q => state.mistakes.includes(q.id));
      }
      if (quizSession.typeFilter !== 'all') {
        pool = pool.filter(q => q.type === quizSession.typeFilter);
      }
      quizSession.queue = shuffle(pool);
      quizSession.index = 0;
      quizSession.score = 0;
      quizSession.answered = false;
      quizSession.order = null;
      quizSession.typedInput = '';
    }

    function setQuizFilter(type) {
      quizSession.typeFilter = type;
      quizSession.retryMissedOnly = false;
      initQuizQueue();
      renderQuizMode();
    }

    function toggleRetryMissed() {
      quizSession.retryMissedOnly = !quizSession.retryMissedOnly;
      quizSession.typeFilter = 'all';
      initQuizQueue();
      renderQuizMode();
    }

    function renderQuizMode() {
      const container = document.getElementById('app-content');
      const missedCount = state.mistakes.length;

      // Top Controls Bar
      let html = `
        <div class="bg-white/95 rounded-3xl shadow-lg border-2 border-sky-200 p-4 sm:p-6">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5 pb-4 border-b border-slate-100">
            <div class="flex flex-wrap gap-1.5">
              ${['all', 'mcq', 'fill', 'tf'].map(t => {
                const labels = { all: 'All Types', mcq: 'MCQs', fill: 'Fill Blanks', tf: 'True / False' };
                const active = !quizSession.retryMissedOnly && quizSession.typeFilter === t;
                return `<button onclick="setQuizFilter('${t}')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${active ? 'bg-sky-500 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${labels[t]}</button>`;
              }).join('')}
            </div>

            <div class="flex items-center gap-2">
              <button onclick="toggleRetryMissed()" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${quizSession.retryMissedOnly ? 'bg-rose-500 text-white shadow' : 'bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100'}">
                🔁 Retry Missed (${missedCount})
              </button>
              <button onclick="initQuizQueue(); renderQuizMode();" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 transition">
                🔀 Shuffle
              </button>
            </div>
          </div>
      `;

      // Empty state (e.g. 0 missed questions)
      if (quizSession.queue.length === 0) {
        html += `
          <div class="text-center py-12">
            <div class="text-6xl mb-3">🌟</div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">${quizSession.retryMissedOnly ? 'Zero Missed Questions!' : 'No questions in this filter'}</h2>
            <p class="text-slate-600 mb-5">${quizSession.retryMissedOnly ? 'Amazing job! You have no missed questions waiting to be retried.' : 'Try selecting "All Types" or switching chapters.'}</p>
            <button onclick="setQuizFilter('all')" class="px-6 py-3 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-bold shadow-md transition">
              Back to All Questions
            </button>
          </div>
        </div>`;
        container.innerHTML = html;
        return;
      }

      // Finished Quiz Round Summary
      if (quizSession.index >= quizSession.queue.length) {
        const total = quizSession.queue.length;
        const pct = Math.round((quizSession.score / total) * 100);
        html += `
          <div class="text-center py-8 animate-pop">
            <div class="text-6xl mb-3">${pct >= 80 ? '🏆' : pct >= 50 ? '🎉' : '💪'}</div>
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Round Complete!</h2>
            <p class="text-lg font-bold text-indigo-600 mb-2">You scored ${quizSession.score} out of ${total} (${pct}%)</p>
            <p class="text-slate-600 mb-6 text-sm">${pct >= 80 ? 'Superstar! You are ready to crush Monday\'s test!' : 'Great practice! Try "Retry Missed" to master the tricky ones!'}</p>
            <div class="flex flex-wrap justify-center gap-3">
              <button onclick="initQuizQueue(); renderQuizMode();" class="px-6 py-3 rounded-2xl bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-bold shadow-lg hover:opacity-95 transition">
                🔄 Play Again
              </button>
              ${state.mistakes.length > 0 ? `<button onclick="quizSession.retryMissedOnly = true; initQuizQueue(); renderQuizMode();" class="px-6 py-3 rounded-2xl bg-rose-500 text-white font-bold shadow-lg hover:bg-rose-600 transition">🔁 Practice ${state.mistakes.length} Missed</button>` : ''}
            </div>
          </div>
        </div>`;
        container.innerHTML = html;
        return;
      }

      // Active Question Card
      const q = quizSession.queue[quizSession.index];
      const progressPct = Math.round((quizSession.index / quizSession.queue.length) * 100);
      const chapLabels = { ch7: '💧 Ch 7: Water', ch8: '⛏️ Ch 8: Minerals', ch9: '🌾 Bonus Ch 9' };
      const typeLabels = { mcq: 'Multiple Choice', fill: 'Fill in the Blank', tf: 'True or False' };

      html += `
        <!-- Progress -->
        <div class="mb-5">
          <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-1.5">
            <span>Question ${quizSession.index + 1} of ${quizSession.queue.length}</span>
            <span class="text-emerald-600">Score: ${quizSession.score}</span>
          </div>
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-emerald-400 to-sky-500 transition-all duration-300" style="width: ${progressPct}%"></div>
          </div>
        </div>

        <!-- Question Header -->
        <div id="quiz-card-box" class="bg-gradient-to-br from-sky-50/70 to-indigo-50/70 rounded-3xl p-5 sm:p-7 border-2 border-indigo-100 mb-4">
          <div class="flex flex-wrap gap-2 mb-3">
            <span class="px-2.5 py-1 rounded-full text-xs font-extrabold bg-white text-indigo-700 border border-indigo-200">${chapLabels[q.chapter]}</span>
            <span class="px-2.5 py-1 rounded-full text-xs font-extrabold bg-amber-100 text-amber-800">${typeLabels[q.type]}</span>
          </div>

          <h2 class="text-xl sm:text-2xl font-bold text-slate-800 leading-snug mb-6">${q.q}</h2>

          <!-- Answer Area -->
          <div id="quiz-options-area">
            ${renderQuizInputArea(q)}
          </div>

          <!-- Feedback Box (hidden until answered) -->
          <div id="quiz-feedback" class="hidden mt-5 p-4 rounded-2xl border-2"></div>
        </div>

        <!-- Next Button -->
        <div class="flex justify-end">
          <button id="quiz-next-btn" onclick="nextQuizQuestion()" class="hidden px-7 py-3.5 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-extrabold shadow-lg hover:scale-105 transition text-base">
            Next Question ➜
          </button>
        </div>
      </div>`;

      container.innerHTML = html;
      if (quizSession.answered) paintQuizAnswer();
    }

    // Same option order every time one question is redrawn.
    function optionOrder(q, list) {
      if (!quizSession.order || quizSession.order.id !== q.id) {
        quizSession.order = { id: q.id, list: shuffle(list) };
      }
      return quizSession.order.list;
    }

    function isRightAnswer(q, text) {
      return [q.answer, ...(q.accept || [])].some(a => normalizeText(a) === normalizeText(text));
    }

    function renderQuizInputArea(q) {
      if (q.type === 'mcq') {
        const opts = optionOrder(q, q.options);
        return `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          ${opts.map((opt, idx) => `
            <button onclick="submitQuizAnswer(this, '${escapeQuotes(opt)}')" data-val="${escapeQuotes(opt)}" class="quiz-opt-btn text-left p-4 rounded-2xl bg-white hover:bg-sky-50 border-2 border-slate-200 hover:border-sky-400 font-bold text-slate-700 shadow-sm transition flex items-center gap-3">
              <span class="w-8 h-8 rounded-xl bg-sky-100 text-sky-700 font-extrabold flex items-center justify-center shrink-0">${String.fromCharCode(65 + idx)}</span>
              <span>${opt}</span>
            </button>
          `).join('')}
        </div>`;
      }

      if (q.type === 'tf') {
        return `<div class="grid grid-cols-2 gap-4">
          <button onclick="submitQuizAnswer(this, 'True')" data-val="True" class="quiz-opt-btn p-5 rounded-2xl bg-white hover:bg-emerald-50 border-2 border-emerald-200 hover:border-emerald-400 font-extrabold text-lg text-emerald-700 shadow-sm transition flex flex-col items-center gap-1">
            <span class="text-3xl">✅</span>
            <span>TRUE</span>
          </button>
          <button onclick="submitQuizAnswer(this, 'False')" data-val="False" class="quiz-opt-btn p-5 rounded-2xl bg-white hover:bg-rose-50 border-2 border-rose-200 hover:border-rose-400 font-extrabold text-lg text-rose-700 shadow-sm transition flex flex-col items-center gap-1">
            <span class="text-3xl">❌</span>
            <span>FALSE</span>
          </button>
        </div>`;
      }

      if (q.type === 'fill') {
        const bank = optionOrder(q, q.wordBank);
        return `
          <div class="mb-4">
            <p class="text-xs font-extrabold uppercase tracking-wide text-indigo-600 mb-2">Tap a word from the Word Bank:</p>
            <div class="flex flex-wrap gap-2.5">
              ${bank.map(word => `
                <button onclick="submitQuizAnswer(this, '${escapeQuotes(word)}')" data-val="${escapeQuotes(word)}" class="quiz-opt-btn px-4 py-3 rounded-2xl bg-white hover:bg-indigo-50 border-2 border-indigo-200 hover:border-indigo-500 font-extrabold text-indigo-800 shadow-sm transition text-sm sm:text-base">
                  ${word}
                </button>
              `).join('')}
            </div>
          </div>
          <div class="pt-3 border-t border-indigo-100">
            <p class="text-xs font-bold text-slate-500 mb-2">Or type your answer (optional spelling practice!):</p>
            <div class="flex gap-2">
              <input id="fill-type-input" type="text" placeholder="Type answer here..." class="flex-1 min-w-0 px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-indigo-400 outline-none font-bold text-slate-700 bg-white" onkeydown="if(event.key==='Enter') submitTypedFill()" />
              <button onclick="submitTypedFill()" class="px-5 py-2.5 rounded-xl bg-indigo-500 hover:bg-indigo-600 text-white font-bold shadow transition">Check</button>
            </div>
          </div>
        `;
      }
      return '';
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function submitTypedFill() {
      const inp = document.getElementById('fill-type-input');
      if (!inp || !inp.value.trim()) return;
      submitQuizAnswer(null, inp.value.trim());
    }

    function normalizeText(str) {
      return str.toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function submitQuizAnswer(btnEl, chosen) {
      if (quizSession.answered) return;
      quizSession.answered = true;

      const q = quizSession.queue[quizSession.index];
      const isCorrect = isRightAnswer(q, chosen);
      quizSession.chosen = chosen;
      quizSession.correct = isCorrect;
      quizSession.bonus = 0;

      if (isCorrect) {
        quizSession.score++;
        state.combo++;
        state.mistakes = state.mistakes.filter(id => id !== q.id);
        quizSession.bonus = state.combo >= 3 ? 5 : 0;
        playSound('correct');
        if (state.combo % 5 === 0) launchConfetti(45);
        addXP(10 + quizSession.bonus, 0, quizSession.bonus ? 'Correct! +5 Combo Bonus 🔥' : '');
      } else {
        state.combo = 0;
        if (!state.mistakes.includes(q.id)) state.mistakes.push(q.id);
        saveState();
        updateHUD();
        playSound('wrong');
        const cardBox = document.getElementById('quiz-card-box');
        cardBox.classList.add('animate-shake');
        setTimeout(() => cardBox.classList.remove('animate-shake'), 450);
      }
      paintQuizAnswer();
    }

    function paintQuizAnswer() {
      const q = quizSession.queue[quizSession.index];
      const feedbackEl = document.getElementById('quiz-feedback');
      if (!q || !feedbackEl) return;

      document.querySelectorAll('.quiz-opt-btn').forEach(b => {
        b.disabled = true;
        if (isRightAnswer(q, b.dataset.val)) {
          b.classList.add('!bg-emerald-100', '!border-emerald-500', '!text-emerald-900');
        } else if (!quizSession.correct && normalizeText(b.dataset.val) === normalizeText(quizSession.chosen)) {
          b.classList.add('!bg-rose-100', '!border-rose-500', '!text-rose-900');
        }
      });
      const inp = document.getElementById('fill-type-input');
      if (inp) inp.disabled = true;

      if (quizSession.correct) {
        feedbackEl.className = 'mt-5 p-4 rounded-2xl border-2 bg-emerald-50 border-emerald-300 text-emerald-900 animate-pop';
        feedbackEl.innerHTML = `
          <div class="font-extrabold text-base mb-1">🎉 Awesome! Correct Answer! ${quizSession.bonus ? '(+5 Combo Bonus 🔥)' : ''}</div>
          <p class="text-sm font-semibold text-emerald-800">${q.explanation}</p>
        `;
      } else {
        feedbackEl.className = 'mt-5 p-4 rounded-2xl border-2 bg-rose-50 border-rose-300 text-rose-900';
        feedbackEl.innerHTML = `
          <div class="font-extrabold text-base mb-1">💡 Nice try! The right answer is: <span class="underline">${q.answer}</span></div>
          <p class="text-sm font-semibold text-rose-800">${q.explanation}</p>
        `;
      }
      document.getElementById('quiz-next-btn').classList.remove('hidden');
    }

    function nextQuizQuestion() {
      quizSession.index++;
      quizSession.answered = false;
      if (quizSession.index >= quizSession.queue.length) {
        const pct = Math.round((quizSession.score / quizSession.queue.length) * 100);
        if (pct >= 70 && quizSession.queue.length >= 5) {
          playSound('fanfare');
          launchConfetti(90);
          addXP(20, 1, 'Quiz Round Completed!');
        }
      }
      renderQuizMode();
    }

    /*****************************************************************
     * 6. MODE 2: MATCH MASTER (Tap-to-Match Game)
     *****************************************************************/
    function clearMatchTimer() {
      if (matchSession.timerHandle) {
        clearInterval(matchSession.timerHandle);
        matchSession.timerHandle = null;
      }
    }

    function startMatchDeck(deckId) {
      const deck = MATCH_DECKS.find(d => d.id === deckId);
      if (!deck) return;
      clearMatchTimer();

      matchSession.deckId = deckId;
      matchSession.leftCards = shuffle(deck.pairs.map((p, i) => ({ id: `L${i}`, text: p.left, answer: p.right })));
      matchSession.rightCards = shuffle(deck.pairs.map((p, i) => ({ id: `R${i}`, text: p.right })));
      matchSession.selectedLeft = null;
      matchSession.matchedLeftIds = [];
      matchSession.matchedRightIds = [];
      matchSession.moves = 0;
      matchSession.seconds = 0;
      matchSession.wrongPair = null;

      renderMatchMode();
    }

    function runMatchTimer() {
      if (matchSession.timerHandle) return;
      matchSession.timerHandle = setInterval(() => {
        matchSession.seconds++;
        const el = document.getElementById('match-timer');
        if (el) el.textContent = formatTime(matchSession.seconds);
      }, 1000);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function selectMatchLeft(id) {
      if (matchSession.matchedLeftIds.includes(id)) return;
      playSound('flip');
      matchSession.selectedLeft = id;
      matchSession.wrongPair = null;
      renderMatchMode();
    }

    function selectMatchRight(id) {
      if (matchSession.matchedRightIds.includes(id)) return;
      if (!matchSession.selectedLeft) {
        showToast('First tap a card on the LEFT side! 👈', 'info');
        return;
      }

      matchSession.moves++;
      const leftCard = matchSession.leftCards.find(c => c.id === matchSession.selectedLeft);
      const rightCard = matchSession.rightCards.find(c => c.id === id);

      // Value-based comparison cleanly handles duplicate rivers like Krishna!
      if (leftCard.answer === rightCard.text) {
        matchSession.matchedLeftIds.push(leftCard.id);
        matchSession.matchedRightIds.push(rightCard.id);
        matchSession.selectedLeft = null;
        playSound('correct');

        // Check win!
        if (matchSession.matchedLeftIds.length === matchSession.leftCards.length) {
          clearMatchTimer();
          playSound('fanfare');
          launchConfetti(100);
          if (!state.completedDecks.includes(matchSession.deckId)) {
            state.completedDecks.push(matchSession.deckId);
          }
          addXP(25, 1, 'Match Deck Mastered!');
        }
      } else {
        playSound('wrong');
        matchSession.wrongPair = { left: leftCard.id, right: rightCard.id };
        matchSession.selectedLeft = null;
        setTimeout(() => {
          matchSession.wrongPair = null;
          if (state.mode === 'match') renderMatchMode();
        }, 600);
      }

      renderMatchMode();
    }

    function renderMatchMode() {
      const container = document.getElementById('app-content');

      // Deck Picker View
      if (!matchSession.deckId) {
        const decks = filterByChapter(MATCH_DECKS);
        let html = `
          <div class="bg-white/95 rounded-3xl shadow-lg border-2 border-indigo-200 p-5 sm:p-6">
            <div class="mb-5">
              <h2 class="text-2xl font-bold text-slate-800">🧩 Match Master Arena</h2>
              <p class="text-sm text-slate-600">Pick a deck! Tap a card on the left, then tap its matching partner on the right.</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              ${decks.length ? '' : '<p class="font-bold text-slate-600">No match decks for the bonus chapter. Try its Quiz or Flashcards.</p>'}
              ${decks.map(d => {
                const done = state.completedDecks.includes(d.id);
                return `
                  <button onclick="startMatchDeck('${d.id}')" class="text-left p-5 rounded-3xl bg-gradient-to-br from-white to-sky-50 hover:from-sky-50 hover:to-indigo-50 border-2 ${done ? 'border-emerald-300' : 'border-slate-200'} hover:border-indigo-400 shadow-sm hover:shadow-md transition group">
                    <div class="flex justify-between items-start mb-3">
                      <span class="text-4xl group-hover:scale-110 transition">${d.icon}</span>
                      ${done ? '<span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-emerald-100 text-emerald-700">⭐ Mastered</span>' : '<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700">+25 XP</span>'}
                    </div>
                    <h3 class="font-bold text-lg text-slate-800 mb-1">${d.title}</h3>
                    <p class="text-xs font-bold text-slate-500">${d.pairs.length} pairs to match</p>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
        container.innerHTML = html;
        return;
      }

      // Active Match Board
      const deck = MATCH_DECKS.find(d => d.id === matchSession.deckId);
      const isWon = matchSession.matchedLeftIds.length === matchSession.leftCards.length;

      if (!isWon) runMatchTimer();

      let html = `
        <div class="bg-white/95 rounded-3xl shadow-lg border-2 border-indigo-200 p-4 sm:p-6">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5 pb-3 border-b border-slate-100">
            <div class="flex items-center gap-2">
              <button onclick="clearMatchTimer(); matchSession.deckId = null; renderMatchMode();" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-xs text-slate-700 transition">
                ← All Decks
              </button>
              <h2 class="text-lg sm:text-xl font-bold text-slate-800">${deck.icon} ${deck.title}</h2>
            </div>
            <div class="flex items-center gap-3 text-xs sm:text-sm font-extrabold">
              <span class="px-3 py-1 rounded-xl bg-sky-50 text-sky-700 border border-sky-200">⏱️ <span id="match-timer">${formatTime(matchSession.seconds)}</span></span>
              <span class="px-3 py-1 rounded-xl bg-amber-50 text-amber-700 border border-amber-200">👆 Moves: ${matchSession.moves}</span>
            </div>
          </div>
      `;

      if (isWon) {
        html += `
          <div class="text-center py-8 animate-pop">
            <div class="text-6xl mb-3">🏆</div>
            <h3 class="text-3xl font-bold text-emerald-600 mb-2">Deck Cleared!</h3>
            <p class="text-slate-600 font-bold mb-6">Finished in ${formatTime(matchSession.seconds)} with ${matchSession.moves} moves!</p>
            <div class="flex flex-wrap justify-center gap-3">
              <button onclick="startMatchDeck('${deck.id}')" class="px-6 py-3 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-bold shadow-md transition">🔄 Play Again</button>
              <button onclick="matchSession.deckId = null; renderMatchMode();" class="px-6 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-md transition">🧩 Choose Another Deck</button>
            </div>
          </div>
        </div>`;
        container.innerHTML = html;
        return;
      }

      html += `
        <div class="grid grid-cols-2 gap-3 sm:gap-6">
          <!-- Left Column -->
          <div class="flex flex-col gap-3">
            <div class="text-center text-xs font-extrabold uppercase tracking-wider text-indigo-500">1. Tap Left</div>
            ${matchSession.leftCards.map(c => {
              const matched = matchSession.matchedLeftIds.includes(c.id);
              const selected = matchSession.selectedLeft === c.id;
              const wrong = matchSession.wrongPair && matchSession.wrongPair.left === c.id;
              let cls = 'bg-white border-slate-200 hover:border-indigo-400 text-slate-800';
              if (matched) cls = 'bg-emerald-100 border-emerald-400 text-emerald-800 opacity-60 cursor-default';
              else if (wrong) cls = 'bg-rose-100 border-rose-500 text-rose-800 animate-shake';
              else if (selected) cls = 'bg-indigo-600 border-indigo-700 text-white shadow-lg scale-[1.03]';
              return `
                <button onclick="selectMatchLeft('${c.id}')" class="p-3.5 sm:p-4 rounded-2xl border-2 font-extrabold text-xs sm:text-base transition text-center min-h-[60px] flex items-center justify-center ${cls}">
                  ${matched ? '✅ ' : ''}${c.text}
                </button>
              `;
            }).join('')}
          </div>

          <!-- Right Column -->
          <div class="flex flex-col gap-3">
            <div class="text-center text-xs font-extrabold uppercase tracking-wider text-emerald-600">2. Tap Match</div>
            ${matchSession.rightCards.map(c => {
              const matched = matchSession.matchedRightIds.includes(c.id);
              const wrong = matchSession.wrongPair && matchSession.wrongPair.right === c.id;
              let cls = 'bg-white border-slate-200 hover:border-emerald-400 text-slate-800';
              if (matched) cls = 'bg-emerald-100 border-emerald-400 text-emerald-800 opacity-60 cursor-default';
              else if (wrong) cls = 'bg-rose-100 border-rose-500 text-rose-800 animate-shake';
              return `
                <button onclick="selectMatchRight('${c.id}')" class="p-3.5 sm:p-4 rounded-2xl border-2 font-extrabold text-xs sm:text-base transition text-center min-h-[60px] flex items-center justify-center ${cls}">
                  ${matched ? '✅ ' : ''}${c.text}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      </div>`;

      container.innerHTML = html;
    }

    /*****************************************************************
     * 7. MODE 3: FLASHCARD FLIP (3D Active Recall & Differences)
     *****************************************************************/
    function getFilteredFlashcards() {
      let cards = filterByChapter(FLASHCARDS);
      if (flashSession.hideMastered) {
        cards = cards.filter(c => !state.masteredFlashcards.includes(c.id));
      }
      return cards;
    }

    function flipCurrentCard() {
      playSound('flip');
      flashSession.flipped = !flashSession.flipped;
      const inner = document.getElementById('flashcard-inner');
      if (inner) inner.classList.toggle('rotate-y-180', flashSession.flipped);
    }

    function markFlashcard(gotIt) {
      const cards = getFilteredFlashcards();
      const card = cards[flashSession.index];
      if (!card) return;

      if (gotIt) {
        if (!state.masteredFlashcards.includes(card.id)) state.masteredFlashcards.push(card.id);
        playSound('correct');
        if (!state.rewardedCards.includes(card.id)) {
          state.rewardedCards.push(card.id);
          addXP(5, 0, 'Flashcard Mastered!');
        } else {
          saveState();
        }
      } else {
        state.masteredFlashcards = state.masteredFlashcards.filter(id => id !== card.id);
        saveState();
        playSound('flip');
      }

      flashSession.flipped = false;
      const nextCards = getFilteredFlashcards();
      if (nextCards.length > 0) {
        const step = (gotIt && flashSession.hideMastered) ? 0 : 1;
        flashSession.index = (flashSession.index + step) % nextCards.length;
      } else {
        flashSession.index = 0;
      }
      renderFlashcardsMode();
    }

    function stepFlashcard(delta) {
      const cards = getFilteredFlashcards();
      if (cards.length === 0) return;
      flashSession.flipped = false;
      flashSession.index = (flashSession.index + delta + cards.length) % cards.length;
      renderFlashcardsMode();
    }

    function renderFlashcardsMode() {
      const container = document.getElementById('app-content');
      const allInChapter = filterByChapter(FLASHCARDS);
      const masteredInChapter = allInChapter.filter(c => state.masteredFlashcards.includes(c.id)).length;
      const cards = getFilteredFlashcards();

      if (flashSession.index >= cards.length) flashSession.index = 0;

      let html = `
        <div class="bg-white/95 rounded-3xl shadow-lg border-2 border-purple-200 p-5 sm:p-6">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5 pb-3 border-b border-slate-100">
            <div>
              <h2 class="text-2xl font-bold text-slate-800">🃏 Flashcard Flip</h2>
              <p class="text-xs sm:text-sm font-bold text-purple-600">Mastered: ${masteredInChapter} / ${allInChapter.length} cards</p>
            </div>
            <label class="inline-flex items-center gap-2 cursor-pointer bg-purple-50 px-3.5 py-2 rounded-2xl border border-purple-200 text-xs font-bold text-purple-800">
              <input type="checkbox" ${flashSession.hideMastered ? 'checked' : ''} onchange="flashSession.hideMastered = this.checked; flashSession.index = 0; flashSession.flipped = false; renderFlashcardsMode();" class="w-4 h-4 accent-purple-600" />
              Hide Mastered Cards
            </label>
          </div>
      `;

      if (cards.length === 0) {
        html += `
          <div class="text-center py-12 animate-pop">
            <div class="text-6xl mb-3">🎓</div>
            <h3 class="text-2xl font-bold text-slate-800 mb-2">All Flashcards Mastered!</h3>
            <p class="text-slate-600 mb-5">Uncheck "Hide Mastered Cards" to review them anytime.</p>
            <button onclick="flashSession.hideMastered = false; renderFlashcardsMode();" class="px-6 py-3 rounded-2xl bg-purple-600 text-white font-bold shadow-md">Show All Cards</button>
          </div>
        </div>`;
        container.innerHTML = html;
        return;
      }

      const card = cards[flashSession.index];
      const isMastered = state.masteredFlashcards.includes(card.id);

      const backContent = card.isTable
        ? `
          <div class="w-full overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs sm:text-sm">
              <thead>
                <tr>
                  <th class="p-2 bg-indigo-100 text-indigo-900 rounded-tl-xl border border-indigo-200">${card.tableHeaders[0]}</th>
                  <th class="p-2 bg-amber-100 text-amber-900 rounded-tr-xl border border-amber-200">${card.tableHeaders[1]}</th>
                </tr>
              </thead>
              <tbody>
                ${card.tableRows.map(r => `
                  <tr class="bg-white">
                    <td class="p-2 border border-slate-200 font-semibold text-slate-700">${r[0]}</td>
                    <td class="p-2 border border-slate-200 font-semibold text-slate-700">${r[1]}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `
        : `<p class="text-base sm:text-xl font-bold text-slate-800 whitespace-pre-line leading-relaxed text-center">${card.back}</p>`;

      html += `
        <div class="text-center text-xs font-bold text-slate-400 mb-2">Card ${flashSession.index + 1} of ${cards.length} • Tap card to flip!</div>

        <!-- 3D Flip Card -->
        <div class="perspective-1000 max-w-2xl mx-auto mb-6 cursor-pointer" onclick="flipCurrentCard()">
          <div id="flashcard-inner" class="relative w-full min-h-[270px] sm:min-h-[300px] transform-style-3d ${flashSession.flipped ? 'rotate-y-180' : ''}">
            <!-- Front -->
            <div class="backface-hidden rounded-3xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white p-6 sm:p-8 flex flex-col items-center justify-center shadow-xl border-4 border-white">
              <div class="absolute top-4 left-4 px-3 py-1 rounded-full bg-white/20 backdrop-blur text-xs font-extrabold">${card.tag}</div>
              ${isMastered ? '<div class="absolute top-4 right-4 px-3 py-1 rounded-full bg-emerald-400 text-emerald-950 text-xs font-extrabold">✅ Mastered</div>' : ''}
              <h3 class="text-2xl sm:text-3xl font-bold text-center leading-snug">${card.front}</h3>
              <p class="mt-6 text-xs font-bold text-white/80 bg-black/15 px-4 py-1.5 rounded-full">👆 Tap to reveal answer</p>
            </div>

            <!-- Back -->
            <div class="backface-hidden rotate-y-180 rounded-3xl bg-gradient-to-br from-amber-50 to-sky-50 p-5 sm:p-7 flex flex-col items-center justify-center shadow-xl border-4 border-indigo-300 overflow-y-auto">
              <div class="text-xs font-extrabold uppercase tracking-wider text-indigo-500 mb-3">${card.front}</div>
              ${backContent}
            </div>
          </div>
        </div>

        <!-- Controls -->
        <div class="flex flex-wrap items-center justify-center gap-3">
          <button onclick="stepFlashcard(-1)" class="px-4 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-700 transition">◀ Prev</button>
          <button onclick="markFlashcard(false)" class="px-5 py-3 rounded-2xl bg-amber-100 hover:bg-amber-200 border-2 border-amber-300 font-extrabold text-amber-900 transition">🔁 Review Again</button>
          <button onclick="markFlashcard(true)" class="px-6 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold shadow-md transition">✅ Got it!${state.rewardedCards.includes(card.id) ? '' : ' (+5 XP)'}</button>
          <button onclick="stepFlashcard(1)" class="px-4 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-700 transition">Next ▶</button>
        </div>
      </div>`;

      container.innerHTML = html;
    }

    function toggleBossPoint(idx) {
      if (bossSession.checkedPoints.includes(idx)) {
        bossSession.checkedPoints = bossSession.checkedPoints.filter(i => i !== idx);
      } else {
        bossSession.checkedPoints.push(idx);
      }
      renderBossMode();
    }

    function strikeBoss() {
      const list = filterByChapter(BOSS_QUESTIONS);
      const bq = list[bossSession.index];
      if (!bq) return;

      const rememberedAll = bossSession.checkedPoints.length >= Math.max(1, bq.points.length - 1);
      if (rememberedAll) {
        if (!state.defeatedBosses.includes(bq.id)) {
          state.defeatedBosses.push(bq.id);
          playSound('hit');
          addXP(15, 0, 'Boss Shield Shattered! ⚔️');
        } else {
          playSound('hit');
        }
      } else {
        playSound('flip');
        showToast('Good review! Try to remember all key points next time 💪', 'info');
      }

      // Check if all bosses in this chapter are defeated
      const allDefeated = list.every(item => state.defeatedBosses.includes(item.id));
      if (allDefeated && !state.bossClears.includes(state.chapter)) {
        state.bossClears.push(state.chapter);
        playSound('fanfare');
        launchConfetti(110);
        addXP(30, 2, 'Exam Boss Defeated! 🐉🏆');
      }

      bossSession.index = (bossSession.index + 1) % list.length;
      bossSession.revealed = false;
      bossSession.checkedPoints = [];
      bossSession.scratchpad = '';
      renderBossMode();
    }

    function renderBossMode() {
      const container = document.getElementById('app-content');
      const list = filterByChapter(BOSS_QUESTIONS);
      if (bossSession.index >= list.length) bossSession.index = 0;

      const defeatedCount = list.filter(b => state.defeatedBosses.includes(b.id)).length;
      const bossHpPct = Math.max(0, Math.round(((list.length - defeatedCount) / list.length) * 100));
      const bq = list[bossSession.index];
      const isDefeated = state.defeatedBosses.includes(bq.id);

      let html = `
        <div class="bg-white/95 rounded-3xl shadow-lg border-2 border-rose-200 p-5 sm:p-6">
          <!-- Boss HP Header -->
          <div class="bg-gradient-to-r from-slate-800 via-indigo-900 to-purple-900 text-white rounded-3xl p-4 sm:p-5 mb-5 shadow-md">
            <div class="flex items-center justify-between gap-3 mb-2">
              <div class="flex items-center gap-3">
                <span class="text-4xl">${bossHpPct === 0 ? '😵' : '🐉'}</span>
                <div>
                  <h2 class="text-lg sm:text-xl font-bold">${bossHpPct === 0 ? 'Monday Test Boss Defeated! 🎉' : 'Exam Boss: Monday Test Monster'}</h2>
                  <p class="text-xs text-indigo-200 font-semibold">Break shields by recalling key points & ticking your checklist!</p>
                </div>
              </div>
              <div class="text-right shrink-0">
                <div class="text-xs font-bold text-rose-300">BOSS HP</div>
                <div class="text-lg font-extrabold">${bossHpPct}%</div>
              </div>
            </div>
            <div class="w-full h-3.5 bg-slate-700 rounded-full overflow-hidden border border-slate-600">
              <div class="h-full bg-gradient-to-r from-rose-500 to-amber-400 transition-all duration-500" style="width: ${bossHpPct}%"></div>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-3">
              ${list.map((item, idx) => {
                const done = state.defeatedBosses.includes(item.id);
                const cur = idx === bossSession.index;
                return `<button onclick="bossSession.index=${idx}; bossSession.revealed=false; bossSession.checkedPoints=[]; bossSession.scratchpad=''; renderBossMode();" class="w-7 h-7 rounded-lg text-xs font-extrabold transition ${cur ? 'bg-amber-400 text-slate-900 scale-110 ring-2 ring-white' : done ? 'bg-emerald-500 text-white' : 'bg-white/15 text-white hover:bg-white/30'}">${done ? '✓' : idx + 1}</button>`;
              }).join('')}
            </div>
          </div>

          <!-- Active Shield Question -->
          <div class="bg-gradient-to-br from-rose-50/60 to-amber-50/60 rounded-3xl p-5 sm:p-6 border-2 border-amber-200">
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="px-3 py-1 rounded-full text-xs font-extrabold bg-amber-200 text-amber-900">🛡️ Shield ${bossSession.index + 1} of ${list.length}: ${bq.title}</span>
              ${isDefeated ? '<span class="px-2.5 py-1 rounded-full text-xs font-extrabold bg-emerald-100 text-emerald-700">⚔️ Broken</span>' : ''}
            </div>

            ${bq.svgType ? getPictureSVG(bq.svgType) : ''}

            <h3 class="text-xl sm:text-2xl font-bold text-slate-800 mb-4">${bq.q}</h3>

            <!-- Optional Scratchpad -->
            <div class="mb-4">
              <label class="block text-xs font-bold text-slate-500 mb-1">Say your answer aloud (or jot quick keywords below):</label>
              <textarea oninput="bossSession.scratchpad = this.value" rows="2" placeholder="Optional scratchpad..." class="w-full p-3 rounded-2xl border-2 border-slate-200 focus:border-indigo-400 outline-none text-sm font-semibold bg-white">${bossSession.scratchpad}</textarea>
            </div>

            ${!bossSession.revealed ? `
              <button onclick="bossSession.revealed = true; playSound('flip'); renderBossMode();" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-extrabold text-base shadow-lg hover:opacity-95 transition">
                👁️ Reveal Answer Checklist
              </button>
            ` : `
              <div class="bg-white rounded-2xl p-4 sm:p-5 border-2 border-emerald-200 mb-4 animate-pop">
                <p class="text-xs font-extrabold uppercase tracking-wide text-emerald-600 mb-3">Tick every key point you remembered:</p>
                <div class="space-y-2.5">
                  ${bq.points.map((pt, idx) => {
                    const checked = bossSession.checkedPoints.includes(idx);
                    return `
                      <label class="flex items-start gap-3 p-3 rounded-xl border-2 cursor-pointer transition ${checked ? 'bg-emerald-50 border-emerald-400' : 'bg-slate-50 border-slate-200 hover:bg-sky-50'}">
                        <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleBossPoint(${idx})" class="w-5 h-5 mt-0.5 accent-emerald-600 shrink-0" />
                        <span class="text-sm sm:text-base font-bold text-slate-800">${pt}</span>
                      </label>
                    `;
                  }).join('')}
                </div>
              </div>

              <div class="flex flex-wrap gap-3 justify-end items-center">
                <button onclick="strikeBoss()" class="px-7 py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-orange-500 text-white font-extrabold shadow-lg hover:scale-105 transition">
                  ⚔️ Strike Boss & Next Shield!${isDefeated ? '' : ' (+15 XP)'}
                </button>
              </div>
            `}
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    /*****************************************************************

     *****************************************************************/
    function renderCurrentMode() {
      if (state.mode === 'quiz') renderQuizMode();
      else if (state.mode === 'match') renderMatchMode();
      else if (state.mode === 'flashcards') renderFlashcardsMode();
      else if (state.mode === 'boss') renderBossMode();
      else if (state.mode === 'cheatsheet') renderCheatSheetMode();
    }

    // Initialize App
    window.onload = function () {
      initQuizQueue();
      updateHUD();
      renderCurrentMode();
      initSync();
