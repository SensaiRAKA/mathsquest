<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diksha's Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDF6EC;--ink:#2E2A3B;--teal:#0FA3A3;--teal-dark:#0B7C7C;--orange:#FF8C42;
--berry:#C94F7C;--lilac:#9B8CFF;--shadow:0 4px 0 rgba(46,42,59,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
 background-image:radial-gradient(circle at 15% 10%,rgba(15,163,163,.08) 0 90px,transparent 91px),
 radial-gradient(circle at 85% 25%,rgba(255,140,66,.10) 0 70px,transparent 71px)}
h1,h2{font-family:'Baloo 2',cursive}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
header{text-align:center;margin-bottom:20px}
header .emo{font-size:52px}
header h1{font-size:30px;color:var(--teal-dark)}
header p{font-weight:800;color:var(--berry);font-size:13px}
h2{font-size:18px;margin:20px 0 10px;color:var(--ink)}
a.subject{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;box-shadow:var(--shadow);
 padding:16px;margin-bottom:12px;text-decoration:none;color:var(--ink);transition:transform .1s;border-left:8px solid var(--teal)}
a.subject:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(46,42,59,.14)}
a.subject .ico{font-size:34px}
a.subject b{font-family:'Baloo 2';font-size:18px}
a.subject .d{font-size:12px;font-weight:700;color:#8A8496;display:block}
a.subject.maths{border-left-color:var(--orange)}
a.subject.special{border-left-color:var(--berry)}
a.subject.udai{border-left-color:#151238}
a.subject.eng{border-left-color:#6C4FD6}
a.subject.soon{border-left-color:#C9C2DB;opacity:.6;pointer-events:none}

/* ---- Class 4 Learning Hub: collapsible sub-sections ---- */
details.grp{background:#fff;border-radius:18px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;
 border-left:8px solid var(--teal)}
details.grp[data-g="wt1"]{border-left-color:var(--lilac)}
details.grp[data-g="wt2"]{border-left-color:var(--teal)}
details.grp[data-g="mid"]{border-left-color:var(--orange)}
details.grp[data-g="sp"]{border-left-color:var(--berry)}
details.grp>summary{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;
 cursor:pointer;list-style:none;font-weight:800}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary:active{background:#FAF7F1}
summary .gico{font-size:26px;flex-shrink:0}
summary .gname{font-family:'Baloo 2';font-size:17px;line-height:1.2}
summary .gnote{display:block;font-family:'Nunito';font-size:11.5px;font-weight:700;color:#8A8496}
summary .gcount{margin-left:auto;background:#F1EEF8;color:#6F6785;font-size:11px;font-weight:800;
 border-radius:99px;padding:4px 9px;white-space:nowrap;flex-shrink:0}
summary .chev{flex-shrink:0;font-size:13px;color:#A79FB8;transition:transform .15s}
details.grp[open]>summary .chev{transform:rotate(90deg)}
details.grp[open]>summary{border-bottom:1px solid #F0ECE3}
.grp-body{padding:12px 12px 4px}
.grp-body a.subject{border-radius:14px;box-shadow:0 2px 0 rgba(46,42,59,.10);border-left-width:5px}
details.grp[open]>summary .gcount{background:#FFF3E6;color:#E56E22}
.test{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.test .date{background:var(--lilac);color:#fff;border-radius:12px;padding:8px 10px;text-align:center;min-width:64px;flex-shrink:0}
.test .date .d{font-family:'Baloo 2';font-size:20px;font-weight:800;line-height:1}
.test .date .m{font-size:10px;font-weight:800;text-transform:uppercase}
.test .info b{font-size:15px}
.test .info .t{font-size:12px;font-weight:700;color:#8A8496;display:block}
.test.next{border:3px solid var(--orange)}
.test.next .date{background:var(--orange)}
.test .badge{margin-left:auto;background:#FFF3E6;color:#E56E22;font-size:10px;font-weight:800;border-radius:99px;padding:4px 8px;white-space:nowrap}
.test.past{opacity:.45}
footer{text-align:center;font-size:11px;font-weight:700;color:#A79FB8;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="emo">🎒</div>
  <h1>Diksha's Study Hub</h1>
  <p>Class 4 · Practice · Play · Learn</p>
</header>

<h2>🎓 Class 4 Learning Hub</h2>
<div id="hub"></div>

<h2>🗓️ Upcoming Tests</h2>
<div id="tests"></div>

<footer>Made with ❤️ by Papa &amp; Pixel the Robot</footer>
</div>

<script>
"use strict";
/* =====================================================================
   EDIT HERE — Rakesh: this is the only part you need to change.
   1) GROUPS: the Class 4 Learning Hub's sub-sections. Add a module as one
      entry in the right group's `items` list; set href to the app file name
      in this repo (or full URL). Set href to "" for a greyed-out
      "coming soon" card. To start a new sub-section (Weekly Test 3, say),
      copy a whole {id, icon, name, note, items} block.
   2) TESTS: add rows as {date:"YYYY-MM-DD", subject:"...", topic:"...",
      group:"wt2"}. Past tests fade out automatically; the next test gets
      highlighted, and its `group` is the sub-section that opens on load.
===================================================================== */
const GROUPS = [
  { id:"wt1", icon:"1️⃣", name:"Weekly Test 1", note:"Unit 1 modules", items:[
    { icon:"💻", name:"Computer Science", desc:"Unit 1: Computer System + Scratch", href:"computer-science.html", cls:"" },
    { icon:"🔢", name:"Mathematics", desc:"Addition, subtraction, multiplication, division, place value & word problems", href:"mathsquest.html", cls:"maths" },
    { icon:"📜", name:"Sanskrit", desc:"लिंग, वचन, दिन, पशु और क्रियाएँ — Class 4, Unit 1", href:"sanskritquest.html", cls:"" }
  ]},
  { id:"wt2", icon:"2️⃣", name:"Weekly Test 2", note:"Unit II modules", items:[
    { icon:"💾", name:"Computers · Unit II", desc:"Ch 2 Memory & Storage + Ch 7 Coding with Scratch — W.T.-II · 31 Aug", href:"computer-science-u2.html", cls:"" },
    { icon:"🧮", name:"Maths · Unit II", desc:"Class IV · Multiplication, Factors, Fractions", href:"maths.html", cls:"maths" },
    { icon:"🦜", name:"संस्कृतम् — इकाई 2", desc:"लिंग-वचन, धातुरूप, पक्षिणः नामानि", href:"sanskrit-u2.html", cls:"" },
    { icon:"🔬", name:"Science", desc:"Unit 2: Reproduction in Animals — life cycles, eggs, mammals & more", href:"sciencequest.html", cls:"" },
    { icon:"✍️", name:"English", desc:"Unit 2: Comprehension, Adjectives, Degrees, Negative Sentences, L-4 Zoo + Paragraph Builder", href:"englishquest.html", cls:"eng" },
    { icon:"🗺️", name:"Social Studies", desc:"Ch.4 The Great Indian Desert & Ch.5 The Peninsular Plateau — Bharat Explorer", href:"social-studies.html", cls:"" }
  ]},
  { id:"mid", icon:"🎯", name:"Mid-Term Preparation", note:"2-day plans, drills & full model-paper mocks", items:[
    { icon:"🚀", name:"Computers · Mid-term Mission", desc:"Ch 1, 2, 6, 7 — 2-day plan, recall cards, drills, long answers & full model-paper mock · Fri 18 Sep", href:"computer-science-midterm.html", cls:"" },
    { icon:"🌏", name:"SST · Mid-term Quest", desc:"Class IV — Coastal Plains, Islands, Mountains, Desert & Plateau. 8 quests over 2 days.", href:"sst-midterm.html", cls:"" },
    { icon:"✍️", name:"English · Mid-term Quest", desc:"3-day plan: paragraph writing, grammar gyms, Ali Baba, Zoo, Avoidable Talk + full model-paper mock · Thu 24 Sep", href:"english-midterm.html", cls:"eng" },
    { icon:"🦜", name:"संस्कृत — पुनरावृत्ति 1", desc:"सोमवार की परीक्षा: दिन, पशु-पक्षी, लिंग-वचन, धातुरूप, आदर्श प्रश्न-पत्र", href:"sanskrit-rev1.html", cls:"" },
    { icon:"🧮", name:"Maths · Mid-term Quest", desc:"4-day plan (Sun 30 · Mon 60 · Tue 120 · Wed 120 min): Slip Doctor, Big Numbers, Add/Sub, Multiply/Divide, Factors, Fractions + model-paper Boss · Thu 1 Oct", href:"maths-midterm.html", cls:"maths" },
    { icon:"🐸", name:"Science · Mid-term Lily Pads", desc:"Sat–Mon plan: Ch 1–6 quests, notebook Answer Lab, Slip Doctor, model-paper Boss + Monday Flash Round · Mon 5 Oct", href:"science-midterm.html", cls:"" }
  ]},
  { id:"sp", icon:"🏫", name:"Special Classes", note:"Extra coaching outside the school syllabus", items:[
    { icon:"🏫", name:"Maths", desc:"July special class: big numbers, factors & multiples, Roman numerals, BODMAS", href:"special-classes-maths.html", cls:"special" },
    { icon:"🌅", name:"UDAI Test Series", desc:"Special Classes — Reasoning, Maths, Science, ICSO", href:"special-classes-udai.html", cls:"udai" }
  ]}
];
const TESTS = [
  { date:"2026-07-13", subject:"Computer Science", topic:"Unit 1: Computer System & Scratch Coding", group:"wt1" },
  /* Science Weekly Test 2 (Unit-II). Papa: please confirm/adjust the exact date below. */
  { date:"2026-07-20", subject:"Science", topic:"W.T.-II · Chapter 3: Reproduction in Animals", group:"wt2" },
  { date:"2026-08-03", subject:"English", topic:"W.T.-II · Unit II: Comprehension, Paragraph, Adjectives, Zoo", group:"wt2" },
  { date:"2026-08-17", subject:"Social Studies", topic:"W.T. · Ch.4 The Great Indian Desert & Ch.5 The Peninsular Plateau", group:"wt2" },
  { date:"2026-08-31", subject:"Computer Science", topic:"W.T.-II · Ch 2 Memory & Storage, Ch 7 Coding with Scratch", group:"wt2" },
  { date:"2026-09-18", subject:"Computer Science", topic:"Mid-term · Ch 1, 2, 6, 7 — Computer System, Memory & Storage, Scratch", group:"mid" },
  { date:"2026-09-21", subject:"Social Studies", topic:"Mid-term · Coastal Plains, Islands, Mountains, The Great Indian Desert & The Peninsular Plateau", group:"mid" },
  { date:"2026-09-24", subject:"English", topic:"Mid-term · Comprehension, Paragraph, Grammar, Ali Baba, Zoo, Avoidable Talk", group:"mid" },
  { date:"2026-09-28", subject:"Sanskrit", topic:"Revision-1 · दिन, पशु-पक्षी, लिंग-वचन, धातुरूप, आदर्श प्रश्न-पत्र", group:"mid" },
  { date:"2026-10-01", subject:"Mathematics", topic:"Mid-term · Large Numbers, Add & Sub, Multiplication & Division, Factors & Multiples, Fractions", group:"mid" },
  { date:"2026-10-05", subject:"Science", topic:"Mid-term · Making of Food, Adaptations in Plants, Reproduction in Animals, Adaptations in Animals, Food and Health, Teeth and Digestion", group:"mid" }
  /* add more like:
  { date:"2026-07-20", subject:"Mathematics", topic:"Unit 1: Large Numbers", group:"wt2" },
  */
];
/* ============================ end of edit zone ====================== */

const MONTHS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DATE_FMT_OPTS={weekday:"long"};

const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* Sort the tests once; both the hub and the test list read the result. */
const now=new Date(); now.setHours(0,0,0,0);
const rows=TESTS.map(t=>{
  const d=new Date(t.date+"T00:00:00");
  return {t:t, d:d, days:Math.round((d-now)/86400000)};
}).sort((a,b)=>a.d-b.d);

/* The sub-section that opens on load is the one holding the next test still to
   come, so the hub always lands on what she is revising for. Once every test
   has passed, fall back to the most recent one - the day after an exam she is
   still most likely to want that same material, not whatever sits last in the
   list. Only an empty TESTS list falls back to the last group. */
const anchorTest = rows.find(r=>r.days>=0) || rows[rows.length-1];
const openGroup = (anchorTest && anchorTest.t.group) || (GROUPS.length ? GROUPS[GROUPS.length-1].id : "");

const cardHTML = s => {
  const cls="subject "+s.cls+(s.href?"":" soon");
  return '<a class="'+cls+'" href="'+esc(s.href||"#")+'"><span class="ico">'+s.icon+'</span>'+
         '<span><b>'+esc(s.name)+'</b><span class="d">'+esc(s.desc)+'</span></span></a>';
};

document.getElementById("hub").innerHTML = GROUPS.map(g=>{
  const n=g.items.length;
  return '<details class="grp" data-g="'+esc(g.id)+'"'+(g.id===openGroup?" open":"")+'>'+
    '<summary><span class="chev">&#9654;</span><span class="gico">'+g.icon+'</span>'+
    '<span class="gname">'+esc(g.name)+'<span class="gnote">'+esc(g.note)+'</span></span>'+
    '<span class="gcount">'+n+(n===1?" module":" modules")+'</span></summary>'+
    '<div class="grp-body">'+g.items.map(cardHTML).join("")+'</div></details>';
}).join("");

let nextFound=false;
document.getElementById("tests").innerHTML = rows.length ? rows.map(r=>{
  const past=r.days<0;
  let cls="test"+(past?" past":"");
  let badge="";
  if(!past && !nextFound){cls+=" next";nextFound=true;
    badge=r.days===0?"TODAY!":r.days===1?"Tomorrow!":"In "+r.days+" days";}
  const weekday=r.d.toLocaleDateString("en-IN",DATE_FMT_OPTS);
  return '<div class="'+cls+'"><div class="date"><div class="d">'+r.d.getDate()+'</div><div class="m">'+MONTHS[r.d.getMonth()]+'</div></div>'+
    '<div class="info"><b>'+esc(r.t.subject)+'</b><span class="t">'+esc(r.t.topic)+' \u00b7 '+weekday+'</span></div>'+
    (badge?'<span class="badge">'+badge+'</span>':'')+'</div>';
}).join("") : '<div class="test"><div class="info"><b>No tests scheduled</b><span class="t">Enjoy the break! \ud83c\udf88</span></div></div>';
</script>
</body>
</html>
