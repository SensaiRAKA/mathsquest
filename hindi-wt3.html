<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<title>शब्दों का शतक · Hindi W.T.-III</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;600;700&family=Kalam:wght@400;700&display=swap">
<style>
/* शब्दों का शतक - Hindi W.T.-III (Unit III): विशेषण, वचन, अनेक शब्दों के लिए एक शब्द, पाठ क्रिकेट, अनुच्छेद लेखन, अपठित गद्यांश.
   One column. The 3-day plan is a cricket pitch; sessions are overs. Daylight palette for a tablet. */
:root{
  --pond:#EEF4EC; --pond2:#DCE8D8; --ink:#1E2A3A; --muted:#566578; --card:#FFFFFF; --line:#D3DECF;
  --leaf:#1E8A4C; --leaf-deep:#136237; --leaf-soft:#DDF3E5;
  --sun:#FFB627; --sun-deep:#C98800; --sun-soft:#FFF2D2;
  --red:#C8323C; --grass:#2F8F4E; --grass2:#37A05A;
  --ok:#1A9A5E; --ok-bg:#DFF5E9; --bad:#D8414D; --bad-bg:#FDE6E8; --sel:#2D6CDF; --sel-bg:#E3ECFD;
  --f-display:"Baloo 2","Noto Sans Devanagari","Nirmala UI","Mangal",system-ui,sans-serif;
  --f-body:"Hind","Noto Sans Devanagari","Nirmala UI","Mangal",system-ui,-apple-system,sans-serif;
  --f-hand:"Kalam","Hind","Noto Sans Devanagari","Nirmala UI",cursive;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--pond);color:var(--ink)}
body{font-family:var(--f-body);font-size:18px;line-height:1.55;margin:0;min-height:100%;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 6% 0%,#FFF4D8 0,transparent 30%),radial-gradient(circle at 100% 30%,#E2F2E4 0,transparent 32%),var(--pond)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
button[disabled]{cursor:default}
h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:28px 0 10px;text-wrap:balance;line-height:1.25}
h3{font-family:var(--f-display);font-weight:700;line-height:1.3;margin:0 0 8px;text-wrap:balance}
b{font-weight:700}
mark{background:var(--sun-soft);color:inherit;border-radius:4px;padding:0 2px}
u.ul{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:.42em;text-decoration-color:var(--red);background:var(--sun-soft);border-radius:6px;padding:0 4px}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(238,244,236,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:780px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ava{width:42px;height:42px;flex:none}
.lvl{display:flex;flex-direction:column;flex:1;min-width:110px}
.lvl b{font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.xpbar{height:9px;background:var(--pond2);border-radius:9px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#FFD36B);border-radius:9px;transition:width .5s}
.chip{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.exam{background:var(--sun-soft);border-color:#F4CF7E;color:#6E4A00}
.streak{display:inline-flex;gap:4px}
.streak i{width:10px;height:10px;border-radius:50%;background:var(--pond2);border:1px solid var(--line)}
.streak i.on{background:var(--leaf);border-color:var(--leaf-deep)}

main{max-width:780px;margin:0 auto;padding:14px 16px 70px}

/* hero */
.hero{display:flex;gap:10px;align-items:flex-end}
.bigfrog{width:96px;height:104px;flex:none;animation:bob 3.2s ease-in-out infinite}
.bigfrog.sm{width:84px;height:90px;margin:0 auto}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{flex:1;min-width:0;background:var(--card);border:2px solid var(--ink);border-radius:22px 22px 22px 6px;padding:12px 14px;box-shadow:4px 4px 0 var(--ink);font-family:var(--f-hand);font-size:21px;line-height:1.45}
.bubble b{font-family:var(--f-body);font-size:18px}
.bubble .btnrow{margin-top:10px;font-family:var(--f-body)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 18px;border-radius:14px;font-family:var(--f-display);font-weight:700;font-size:19px;background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-deep);transition:transform .08s;text-align:center;line-height:1.25}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf-deep)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:1px solid var(--line)}
.btn.ink{background:var(--ink);box-shadow:0 4px 0 #0B141F}
.btn.sm{min-height:44px;font-size:16px;padding:8px 12px}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad);box-shadow:0 4px 0 #9E2B35}
.btn[disabled]{opacity:.4}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btnrow.center{justify-content:center}
.btnrow.spread{justify-content:space-between}
.link{color:var(--leaf-deep);text-decoration:underline;font-weight:700;padding:8px}
.skip{text-align:center;margin:4px 0 0}

/* my mistakes */
.mist{margin-top:18px;background:#FFF8EC;border:2px solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--ink);padding:14px}
.misth{display:flex;gap:12px;align-items:center}
.mic{font-size:40px;line-height:1}
.mtx h2{margin:0}
.mtx p{margin:2px 0 0;font-size:16px;color:var(--muted)}
.mgrp{margin-top:10px}
.mgrp small{font-size:14px;font-weight:700;color:var(--muted)}
.mgrp ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.mgrp li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:16px;line-height:1.4;display:flex;gap:8px;align-items:baseline}
.mgrp li.more{background:none;border:0;padding:0 4px;color:var(--muted);font-weight:700}
.mchip{flex:none;font-size:12px;font-weight:700;background:var(--pond2);border-radius:999px;padding:1px 7px}
.btn.mbtn{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sun-deep)}
.fixline{font-weight:700;font-size:17px;margin:4px 0}

/* pitch trail */
.pond{display:flex;flex-direction:column;gap:10px;border-radius:26px;padding:14px 14px 14px 32px;position:relative;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.08) 0 46px,transparent 46px 92px),linear-gradient(90deg,var(--grass),var(--grass2))}
.pond::before{content:"";position:absolute;left:14px;top:16px;bottom:16px;width:4px;border-radius:4px;background:#fff;opacity:.85}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 4px 0;font-family:var(--f-display);color:#fff}
.dayhead b{font-size:20px}
.dayhead span{font-size:15px;color:#D9F0DF;font-weight:600}
.pad{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:6px 10px 6px 6px;border-radius:999px 22px 22px 999px;background:rgba(255,255,255,.9);border:2px solid transparent;transition:transform .1s}
.pad.alt{margin-left:clamp(0px,5vw,40px);width:calc(100% - clamp(0px,5vw,40px))}
.pad:active{transform:scale(.98)}
.pad.next{background:#fff;border-color:var(--sun);box-shadow:0 4px 0 var(--sun-deep)}
.pad.done{background:rgba(255,255,255,.72)}
.lily{position:relative;width:60px;height:60px;flex:none;border-radius:50%;background:#fff;border:6px solid var(--red);display:grid;place-items:center}
.pad.done .lily{border-color:var(--leaf)}
.lic{font-size:26px;line-height:1}
.tick{position:absolute;right:-6px;bottom:-6px;background:var(--ok);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;display:grid;place-items:center;font-weight:700}
.hopper{position:absolute;left:34px;top:-18px;width:34px;height:36px;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.pt{display:flex;flex-direction:column;min-width:0;flex:1}
.pt small{font-size:14px;color:var(--muted);font-weight:700}
.pt b{font-family:var(--f-display);font-size:19px;line-height:1.25}
.pt .sub{font-size:15px;color:var(--muted);line-height:1.35}
.stars{color:var(--sun-deep);letter-spacing:2px;font-size:17px}
.mini{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

/* parts */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cht{background:var(--card);border-radius:var(--r);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px;border-top:8px solid var(--hue)}
.chh{display:flex;gap:10px;align-items:center}
.ci{font-size:34px;line-height:1}
.chh small{display:block;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.chh b{font-family:var(--f-display);font-size:19px;line-height:1.25}
.chs{font-size:15px;color:var(--muted);line-height:1.4}
.chb{display:flex;gap:6px;flex-wrap:wrap}
.chb .btn{flex:1;padding:8px 4px;font-size:15px;white-space:nowrap}
.extras{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-height:110px;box-shadow:0 4px 0 var(--line)}
.ex span{font-size:30px;line-height:1.1}
.ex b{font-family:var(--f-display);font-size:18px;line-height:1.25}
.ex small{font-size:14px;color:var(--muted);line-height:1.35}
.foot{margin-top:30px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}

/* learn */
.qhead{display:flex;align-items:center;gap:10px}
.qx{min-width:46px;min-height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:18px;text-align:center}
.qx.armed{background:var(--bad);color:#fff;border-color:var(--bad);padding:0 10px;font-size:15px}
.ltitle{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.3}
.lc{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line);margin-top:12px;border-left:8px solid var(--hue,var(--leaf))}
.lch{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lch h3{font-size:24px;margin:0;flex:1}
.le{font-size:36px;line-height:1}
.lnum{font-size:14px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.lc p{margin:8px 0}
.lc ul,.lc ol{margin:6px 0;padding-left:24px}
.lc li{margin:4px 0}
.note{background:var(--sun-soft);border-radius:12px;padding:10px 12px;margin-top:10px}
.note.red{background:var(--bad-bg)}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:17px;margin:8px 0}
table.t th,table.t td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--pond);font-size:15px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 0}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--ink)}

/* quiz */
.pbar{flex:1;height:12px;background:var(--pond2);border-radius:12px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.combo{font-weight:800;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.qn{font-size:15px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.sec{margin:16px 0 6px;font-size:15px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.mk{background:var(--sun-soft);color:#6E4A00;border-radius:999px;padding:1px 9px;white-space:nowrap;align-self:flex-start}
.qc{background:var(--card);border-radius:22px;padding:16px;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.prompt{font-size:21px;font-weight:700;margin:0 0 10px;line-height:1.55}
.prompt.sm{font-size:18px}
.prompt.stmt{font-family:var(--f-hand);font-size:24px;font-weight:400}
.bigword{font-family:var(--f-display);font-size:40px;font-weight:800;text-align:center;line-height:1.3;margin:2px 0 12px}
.emo{font-size:64px;line-height:1.2;text-align:center;margin:0 0 12px;letter-spacing:4px}
.passage{background:#FFFBEF;border:1px dashed #E2C77A;border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:18px;line-height:1.75}
.sentence{line-height:2.3}
.hint{font-size:15px;color:var(--muted);margin:-4px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:58px;border-radius:16px;background:var(--pond);border:2px solid var(--line);font-size:19px;font-weight:700;padding:8px 12px;text-align:left;transition:transform .08s;line-height:1.4}
.opt:active{transform:scale(.97)}
.opt.spell{font-size:24px;text-align:center}
.opt.sent{font-weight:400;font-size:18px}
.ol{color:var(--muted);font-weight:700}
.opt.pick{background:var(--sel-bg);border-color:var(--sel)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:#0D5A37}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:#8A1F29}
.opt.also{border-color:var(--ok);border-style:dashed}
.opt.dim{opacity:.5}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfb{text-align:center;font-size:22px}
.fixbox{margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}
.glabel{font-size:15px;font-weight:700;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chp{min-height:50px;padding:6px 14px;border-radius:14px;background:var(--pond);border:2px solid var(--line);font-size:19px;font-weight:700;line-height:1.4}
.chp.gone{visibility:hidden}
.chp.bad{background:var(--bad-bg);border-color:var(--bad)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:46px;padding:2px 12px;margin:0 4px;border-radius:12px;border:2px dashed #9FB59A;background:var(--pond);font-weight:700;vertical-align:middle;line-height:1.4}
.slot.filled{border-style:solid;border-color:var(--sel);background:var(--sel-bg)}
.slot.sel{border-color:var(--sun-deep);background:var(--sun-soft)}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.wd{min-height:52px;padding:4px 14px;border-radius:14px;background:var(--pond);border:2px solid var(--line);font-size:22px;font-weight:700;line-height:1.4}
.wd.pick{background:var(--sel-bg);border-color:var(--sel)}
.wd.ok{background:var(--ok-bg);border-color:var(--ok);color:#0D5A37}
.wd.bad{background:var(--bad-bg);border-color:var(--bad);color:#8A1F29}
.wd.also{border-color:var(--ok);border-style:dashed}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{min-height:58px;border-radius:14px;background:var(--pond);border:2px solid var(--line);font-size:17px;font-weight:700;padding:6px 10px;text-align:center;line-height:1.35}
.mi.r{background:#fff}
.mi.sel{background:var(--sel-bg);border-color:var(--sel)}
.mi.ok{background:var(--ok-bg);border-color:var(--ok);color:#0D5A37}
.mi.bad{background:var(--bad-bg);border-color:var(--bad)}
.tray{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--sun-soft);border-radius:16px;padding:12px;margin-bottom:12px;text-align:center}
.tray small{font-size:14px;color:var(--muted);font-weight:700}
.tray b{font-size:22px;font-family:var(--f-display);line-height:1.3}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bk{border-radius:16px;border:2px solid var(--ink);background:#fff;padding:10px;min-height:92px;display:flex;flex-direction:column;gap:6px;text-align:left}
.bk b{font-family:var(--f-display);font-size:18px;line-height:1.3}
.bk .in{display:flex;flex-wrap:wrap;gap:5px}
.bk .in span{background:var(--ok-bg);border-radius:9px;padding:1px 8px;font-size:15px;font-weight:700}
.bk .in span.miss{background:var(--bad-bg);outline:1px dashed var(--bad)}
.bk.bad{border-color:var(--bad);background:var(--bad-bg)}
.seq{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.seq li{display:flex;align-items:center;gap:8px;border:2px dashed #9FB59A;border-radius:14px;padding:8px 10px;min-height:52px;background:var(--pond)}
.seq li.f{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.seq li.cur{border-color:var(--sun-deep);background:var(--sun-soft)}
.seq .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.seq .st{font-weight:700}
.stepdone{border-radius:12px;padding:8px 10px;margin-bottom:8px;background:var(--ok-bg)}
.stepdone.bad{background:var(--bad-bg)}
.stepdone small{display:block;font-size:14px;color:var(--muted)}
.nb{display:flex;gap:12px;align-items:center;background:repeating-linear-gradient(#fff 0 34px,#D6E4F0 34px 35px);border:1px solid var(--line);border-left:4px solid #E8A0A8;border-radius:12px;padding:12px 14px;font-family:var(--f-hand);font-size:21px;line-height:1.6}
.pen{font-size:40px}
.model{background:var(--leaf-soft);border-radius:12px;padding:10px 12px;margin:6px 0 0;line-height:1.75}
details.modelbox{margin-top:12px;border:2px solid var(--leaf);border-radius:14px;padding:6px 10px;background:#fff}
details.modelbox summary{font-family:var(--f-display);font-weight:700;font-size:18px;min-height:44px;display:flex;align-items:center;cursor:pointer}
.kw{font-size:16px;margin-top:10px}
table.diff td{width:50%}

/* feedback */
.fb{margin-top:14px;border-radius:18px;padding:14px;border:2px solid var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb .ft{font-family:var(--f-display);font-size:23px;font-weight:800;margin:0 0 4px;line-height:1.3}
.fb .fa{font-size:18px;margin:6px 0}
.fb .tip{font-size:17px;margin:6px 0}
.bonus{font-size:15px;background:var(--sun);border-radius:999px;padding:2px 8px;vertical-align:middle}
.slipnote{background:#fff;border:2px dashed var(--bad);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:16px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pp .3s}
@keyframes pp{50%{transform:scale(1.08)}}

/* results */
.res{text-align:center}
.rt{font-family:var(--f-display);font-size:22px;font-weight:700;margin:6px 0 0}
.score{font-family:var(--f-display);font-size:58px;font-weight:800;line-height:1.05;margin:4px 0;font-variant-numeric:tabular-nums}
.stars.big{font-size:44px;letter-spacing:6px;margin:0}
.sub{color:var(--muted);margin:2px 0}
.perfect{font-size:20px;font-weight:700}
.wrongs{margin-top:16px;text-align:left}
.wrongs h3{font-size:22px}
.wr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:16px}
.wr b{font-size:17px}
.small .model{font-size:16px}

function clash(id, used){ return factsOf(id).some(function(f){ if(f.charAt(0)==='~') return !!used['!'+f.slice(1)]; if(f.charAt(0)==='!') return !!(used[f] || used['~'+f.slice(1)]); return !!used[f]; }); }

function beep(ok){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    var notes = ok ? [660, 880] : [240, 190];
    notes.forEach(function(f,i){
      var o = AC.createOscillator(), g = AC.createGain(); o.type = ok?'triangle':'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, AC.currentTime+i*0.11); g.gain.exponentialRampToValueAtTime(0.18, AC.currentTime+i*0.11+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+i*0.11+0.16);
      o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+i*0.11); o.stop(AC.currentTime+i*0.11+0.18);
    });
  }catch(e){}
}

try{ reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
function confetti(n){
  if(reduceMotion) return;
  var cv = document.getElementById('fx'); if(!cv || !cv.getContext) return;
  var ctx; try{ ctx = cv.getContext('2d'); }catch(e){ return; } if(!ctx) return;
  var W = cv.width = window.innerWidth, H = cv.height = window.innerHeight, P=[], cols=['#C8323C','#FFB627','#1E8A4C','#2C8FD0','#7A5AD6','#E0702A'];
  for(var i=0;i<n;i++) P.push({x:W/2+(rnd()-.5)*W*.4, y:H*.35, vx:(rnd()-.5)*9, vy:-rnd()*9-3, s:5+rnd()*6, c:pick(cols), r:rnd()*6});
  var t=0;
  (function step(){
    ctx.clearRect(0,0,W,H); t++;
    P.forEach(function(p){ p.vy+=0.28; p.x+=p.vx; p.y+=p.vy; p.r+=0.1; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(t<110) requestAnimationFrame(step); else ctx.clearRect(0,0,W,H);
  })();
}

/* ---------------- grading ---------------- */
function grade(q, u){
  switch(q.type){
    case 'mcq': return u.picked===q.ans ? 1 : 0;
    case 'tf': return u.picked===q.ans ? 1 : 0;
    case 'fill': return fillScore(q,u.slots).score;
    case 'two': var c=u.sel.filter(function(x){return q.ok.indexOf(x)>=0;}).length; return c/q.need;
    case 'tw':
      var tg=u.sel.filter(function(i){return q.ok.indexOf(q.words[i])>=0;}).length, tb=u.sel.length-tg;
      if(tg===q.need && tb===0) return 1;
      return Math.max(0, (tg-tb)/q.need);
    case 'match': return u.miss.filter(function(m){return !m;}).length/q.left.length;
    case 'sort': return u.placed.filter(function(p){return p.ok;}).length/q.items.length;
    case 'seq': var slots=q.steps.length, miss=Object.keys(u.miss).length; return (slots-miss)/slots;
    case 'steps': return u.picks.filter(function(p,k){return p===q.parts[k].ans;}).length/q.parts.length;
    case 'build':
      var g=u.sel.filter(function(x){return q.good.indexOf(x)>=0;}).length, b=u.sel.length-g;
      if(g===q.good.length && b===0) return 1;
      return Math.max(0, (g-b)/q.good.length);
    case 'note': return u.ticks.filter(Boolean).length/q.pts.length;
  }
  return 0;
}
function fillScore(q, slots){
  var res = slots.map(function(){return false;});
  if(q.any){
    var usedA = {};
    slots.forEach(function(v,i){
      for(var j=0;j<q.ans.length;j++){ if(!usedA[j] && v!==null && q.ans[j].indexOf(v)>=0){ usedA[j]=1; res[i]=true; break; } }
    });
  } else {
    slots.forEach(function(v,i){ res[i] = v!==null && q.ans[i].indexOf(v)>=0; });
  }
  var ok = res.filter(Boolean).length;
  return {res:res, score: ok/slots.length};
}

function finishQ(){
  var q = QZ.list[QZ.i], u = QZ.ui;
  if(u.done) return;
  u.done = true;
  var sc = grade(q, u);
  var ok = sc>=0.999;
  QZ.res[QZ.i] = {score:sc, ok:ok};
  S.seen = S.seen||{}; S.seen[q.key] = nowMs(); S.seenF = S.seenF||{}; if(TPL[q.key]) ownAnswers(TPL[q.key]).forEach(function(f){ S.seenF[f] = nowMs(); });
  var xp = q.type==='note' ? u.ticks.filter(Boolean).length*4 : Math.round(10*sc);
  if(ok){ QZ.combo++; if(QZ.combo>=3) xp += Math.min(QZ.combo-2,5)*2; } else QZ.combo = 0;
  QZ.best = Math.max(QZ.best, QZ.combo);
  QZ.xp += xp; addXP(xp);
  if(ok){ if(QZ.mode==='fix'){ delete S.mist[q.key]; if(SLIP_IDS.indexOf(q.key)>=0) S.cured[q.key]=true; QZ.fixed=(QZ.fixed||0)+1; } else clearMistake(q.key); if(QZ.mode==='slip') S.cured[q.key]=true; }
  else if(canFix(q.key)) markMistake(q.key);
  if(q.type!=='note') beep(ok);
  save();
}

  armed.reset=false; S = fresh(); save(); toast('प्रगति मिटा दी गई।'); V={name:'home'}; render();
};
ACT.learn = function(el){ V={name:'learn', ch:el.getAttribute('data-ch'), i:0}; render(); scrollTop(); };
ACT.lnext = function(){ var n=LEARN[V.ch].length; if(V.i<n-1){ V.i++; render(); scrollTop(); } };
ACT.lprev = function(){ if(V.i>0){ V.i--; render(); scrollTop(); } };
ACT.quest = function(el){
  var ch = el.getAttribute('data-ch');
  S.learned[ch] = true; save();
  startQuiz('ch', chapterSet(ch), {ch:ch, title:CHMAP[ch].name});
};
ACT.plan = function(el){
  var p = PLAN.filter(function(x){return x.id===el.getAttribute('data-id');})[0]; if(!p) return;
  if(p.kind==='ch'){ V={name:'learn', ch:p.ch, i:0}; render(); scrollTop(); return; }
  if(p.kind==='lab') return startQuiz('lab', labSet(null), {title:p.title, sid:p.id});
  if(p.kind==='boss') return S.boss.a && !S.boss.b ? ACT.bossB() : ACT.bossA();
  if(p.kind==='slip') return startQuiz('slip', slipSet(), {title:'स्लिप डॉक्टर', sid:p.id});
  if(p.kind==='fix') return ACT.fixmine();
  if(p.kind==='flash') return startQuiz('flash', flashSet(), {title:'फ़्लैश राउंड', sid:p.id});
};
ACT.lab = function(el){ var ch=el.getAttribute('data-ch'); startQuiz('lab', labSet([ch]), {ch:ch, title:CHMAP[ch].name+' — कॉपी'}); };
ACT.bossA = function(){ startQuiz('bossA', bossA(), {title:'बॉस — भाग 1'}); };
ACT.bossB = function(){ startQuiz('bossB', bossB(), {title:'बॉस — भाग 2'}); };
ACT.fixmine = function(){
  var L=fixSet();
  if(!L.length){ S.done.S10 = {pct:1, t:nowMs()}; save(); render(); toast('अभी ठीक करने को कुछ नहीं है!'); return; }
  startQuiz('fix', L, {title:'गलतियाँ ठीक करो', sid:'S10'});
};
ACT.fixthese = function(){ var ids=[]; QZ.list.forEach(function(q,i){ var r=QZ.res[i]; if(r && !r.ok && canFix(q.key) && ids.indexOf(q.key)<0) ids.push(q.key); }); if(!ids.length) return; startQuiz('fix', fixSet(ids), {title:'गलतियाँ ठीक करो'}); };
ACT.slip = function(){ startQuiz('slip', slipSet(), {title:'स्लिप डॉक्टर', sid:'S6'}); };
ACT.flash = function(){ startQuiz('flash', flashSet(), {title:'फ़्लैश राउंड', sid:'S11'}); };
ACT.mixnote = function(){ startQuiz('lab', labSet(null), {title:'लेखन लैब', sid:'S8'}); };
ACT.spell = function(){ startQuiz('spell', spellSet(), {title:'शुद्ध वर्तनी'}); };
ACT.vachan = function(){ startQuiz('vachan', vachanSet(), {title:'वचन रेस'}); };
ACT.passages = function(){ startQuiz('ch', chapterSet('p6'), {ch:'p6', title:CHMAP.p6.name}); };
ACT.quit = function(){
  if(!armed.quit){ armed.quit=true; render(); setTimeout(function(){ armed.quit=false; var b=document.querySelector('[data-act="quit"]'); if(b){ b.classList.remove('armed'); b.textContent='✕'; } }, 3000); return; }
  armed.quit=false; ACT.home();
};
ACT.next = function(){
  if(!QZ) return;
  if(QZ.i < QZ.list.length-1){ QZ.i++; QZ.ui = newUI(QZ.list[QZ.i]); render(); scrollTop(); }
  else endQuiz();
};
ACT.again = function(){
  var m = QZ && QZ.mode, meta = QZ && QZ.meta;
  if(m==='ch') return startQuiz('ch', chapterSet(meta.ch), meta);
  if(m==='bossA') return ACT.bossA();
  if(m==='bossB') return ACT.bossB();
  if(m==='slip') return ACT.slip();
  if(m==='fix') return ACT.fixmine();
  if(m==='flash') return ACT.flash();
  if(m==='spell') return ACT.spell();
  if(m==='vachan') return ACT.vachan();
  if(m==='lab') return startQuiz('lab', labSet(meta.ch ? [meta.ch] : null), meta);
  ACT.home();
};
/* question interactions */
ACT.opt = function(el){
  var q=QZ.list[QZ.i], u=QZ.ui; if(u.done) return;
  u.picked = q.opts[+el.getAttribute('data-i')]; finishQ(); render();
};
ACT.tf = function(el){
  var q=QZ.list[QZ.i], u=QZ.ui; if(u.picked!==null) return;
  u.picked = el.getAttribute('data-v')==='1';
  if(!q.fix){ finishQ(); render(); return; }
  beep(u.picked===q.ans);
  render();
};
ACT.fix = function(el){
  var q=QZ.list[QZ.i], u=QZ.ui; if(u.done || u.picked===null) return;
  u.fixPicked = q.fix.opts[+el.getAttribute('data-i')];
  var sv = S.sound; S.sound = false; finishQ(); S.sound = sv;
  if(u.fixPicked===q.fix.ans){ QZ.xp += 5; addXP(5); save(); }
  render();
};
ACT.slot = function(el){
  var u=QZ.ui; if(u.done) return; var i=+el.getAttribute('data-i');
  if(u.slots[i]!==null){ u.slots[i]=null; }
  u.sel = i; render();
};
ACT.chip = function(el){
  var q=QZ.list[QZ.i], u=QZ.ui; if(u.done) return;
  var c = q.chips[+el.getAttribute('data-i')];
  if(u.slots.indexOf(c)>=0) return;
  var tgt = (u.sel!==null && u.slots[u.sel]===null) ? u.sel : u.slots.indexOf(null);
  if(tgt<0) return;
  u.slots[tgt]=c;
  var nx = u.slots.indexOf(null); u.sel = nx>=0 ? nx : null;
  render();
};
ACT.check = function(){
  var q=QZ.list[QZ.i], u=QZ.ui; if(u.done) return;
  if(q.type==='fill' && u.slots.indexOf(null)>=0) return;
  if(q.type==='two' && u.sel.length<q.need) return;
  if((q.type==='build' || q.type==='tw') && u.sel.length<1) return;
  finishQ(); render();
};
ACT.tog = function(el){
  var q=QZ.list[QZ.i], u=QZ.ui; if(u.done) return;
  var c = q.chips[+el.getAttribute('data-i')], k = u.sel.indexOf(c);
  if(k>=0) u.sel.splice(k,1);
  else { if(q.type==='two' && u.sel.length>=q.need) u.sel.shift(); u.sel.push(c); }
  render();
};
ACT.word = function(el){
  var u=QZ.ui; if(u.done) return;
  var i = +el.getAttribute('data-i'), k = u.sel.indexOf(i);
  if(k>=0) u.sel.splice(k,1); else u.sel.push(i);
  render();
};
ACT.ml = function(el){ var u=QZ.ui; if(u.done) return; var i=+el.getAttribute('data-i'); if(u.got[i]) return; u.L=i; u.flash=null; tryPair(); };
ACT.mr = function(el){ var u=QZ.ui; if(u.done) return; var j=+el.getAttribute('data-i'), q=QZ.list[QZ.i]; if(q.pair.indexOf(j)>=0 && u.got[q.pair.indexOf(j)]) return; u.R=j; u.flash=null; tryPair(); };
function tryPair(){
  var q=QZ.list[QZ.i], u=QZ.ui;
  if(u.L===null || u.R===null){ render(); return; }
  if(q.pair[u.L]===u.R){ u.got[u.L]=true; beep(true); }
  else { u.miss[u.L]=true; u.flash={L:u.L, R:u.R}; beep(false); }
  u.L=null; u.R=null;
  if(u.got.every(Boolean)){ var sv=S.sound; S.sound=false; finishQ(); S.sound=sv; }
  render();
}
ACT.bucket = function(el){
  var q=QZ.list[QZ.i], u=QZ.ui; if(u.done) return;
  var b=+el.getAttribute('data-i'), it=q.items[u.i], ok = it.b===b;
  u.placed.push({t:it.t, b:it.b, ok:ok}); u.flash = ok ? null : b; if(!ok) u.miss++;
  beep(ok); u.i++;
  if(u.i>=q.items.length){ var sv=S.sound; S.sound=false; finishQ(); S.sound=sv; }
  render();
};
ACT.seq = function(el){
  var q=QZ.list[QZ.i], u=QZ.ui; if(u.done) return;
  var c = q.chips[+el.getAttribute('data-i')]; if(u.used[c]) return;
  var slot = u.filled.length, want = q.steps[slot];
  if(c===want){ u.filled.push(c); u.used[c]=1; u.flash=null; beep(true); }
  else { u.miss[slot]=1; u.flash=c; beep(false); }
  if(u.filled.length===q.steps.length){ var sv=S.sound; S.sound=false; finishQ(); S.sound=sv; }
  render();
};
ACT.step = function(el){
  var q=QZ.list[QZ.i], u=QZ.ui; if(u.done) return;
  var p = q.parts[u.k], c = p.opts[+el.getAttribute('data-i')];
  u.picks.push(c); beep(c===p.ans); u.k++;
  if(u.k>=q.parts.length){ var sv=S.sound; S.sound=false; finishQ(); S.sound=sv; }
  render();
};
ACT.nbshow = function(){ var u=QZ.ui; if(u.phase==='write'){ u.phase='check'; render(); } };
ACT.nbpt = function(el){ var u=QZ.ui; if(u.done) return; var i=+el.getAttribute('data-i'); u.ticks[i]=!u.ticks[i]; render(); };
ACT.nbdone = function(){ var u=QZ.ui; if(u.done || u.phase!=='check') return; finishQ(); render(); };

function endQuiz(){
  var tot=0, got=0, marks=0, maxM=0;
  QZ.list.forEach(function(q,i){ var r=QZ.res[i]||{score:0}; tot++; got+=r.score; maxM+=q.marks; marks += Math.round(r.score*q.marks*2)/2; });
  var pct = tot ? got/tot : 0;
  var stars = pct>=0.9 ? 3 : pct>=0.7 ? 2 : 1;
  QZ.pct = pct; QZ.stars = stars; QZ.marks = marks; QZ.maxM = maxM;
  var m = QZ.mode;
  if(m==='ch'){ var r = S.ch[QZ.meta.ch] || {best:0, stars:0, plays:0}; r.best=Math.max(r.best,pct); r.stars=Math.max(r.stars,stars); r.plays++; S.ch[QZ.meta.ch]=r; }
  if(m==='lab'){ QZ.list.forEach(function(q,i){ if(q.type==='note'){ S.lab[q.key]={got:QZ.res[i]?Math.round(QZ.res[i].score*q.pts.length):0, of:q.pts.length, t:nowMs()}; } }); }
  if(m==='bossA') S.boss.a = {got:marks, max:maxM, t:nowMs()};
  if(m==='bossB') S.boss.b = {got:marks, max:maxM, t:nowMs()};
  if(QZ.meta.sid && (m==='lab'||m==='slip'||m==='fix'||m==='flash')) S.done[QZ.meta.sid] = {pct:pct, t:nowMs()};
  save();
  V = {name:'result'}; render(); scrollTop();
  if(stars>=2) confetti(stars===3?140:70);
}

var CHMAP = {}; CH.forEach(function(c){ CHMAP[c.id]=c; });
function starStr(n, of){ var s=''; for(var i=0;i<(of||3);i++) s += i<n ? '★' : '☆'; return s; }
function hl(text, kw){
  var t = esc(text);
  (kw||[]).forEach(function(k){
    var re = new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')');
    t = t.replace(re,'<mark>$1</mark>');
  });
  return t;
}
function partChip(ch){ var c=CHMAP[ch]; return c ? 'भाग '+c.n : 'मिश्रित'; }

function renderTop(){
  var L = lvl(S.xp), into = S.xp - L*LEVEL_XP, pct = L>=TITLES.length-1 ? 100 : Math.round(into/LEVEL_XP*100);
  var dots = DAYS.map(function(k,i){ return '<i class="'+(S.days[k]?'on':'')+'" title="'+DAYN[i]+'"></i>'; }).join('');
  return '<div class="topin">'+
    '<div class="ava">'+ART.mascot(L)+'</div>'+
    '<div class="lvl"><b>'+esc(TITLES[L])+'</b><div class="xpbar"><i style="width:'+pct+'%"></i></div></div>'+
    '<span class="chip xp">'+S.xp+' रन</span>'+
    '<span class="chip exam">'+examChip()+'</span>'+
    '<span class="streak" aria-label="जिन दिनों अभ्यास किया">'+dots+'</span>'+
  '</div>';
}

function heroMsg(){
  var d = today(), nx = nextPlan(), nxt = nx ? ' अगला: <b>'+esc(nx.title)+'</b>।' : '';
  if(d<DAYS[0]) return '<b>नमस्ते '+KID+'!</b> मैं गुगली हूँ 🏏 सोमवार को हिंदी का टेस्ट है। तैयारी कल से शुरू होगी, पर चाहो तो आज ही पहला ओवर खेल लो!';
  if(d===DAYS[0]) return '<b>शनिवार, '+KID+'!</b> आज विशेषण, वचन, अनेक शब्द, अपठित गद्यांश और अनुच्छेद।'+nxt;
  if(d===DAYS[1]) return '<b>रविवार!</b> आज पाठ क्रिकेट, लेखन लैब और बॉस टेस्ट पेपर।'+nxt;
  if(d===DAYS[2]) return '<b>आज टेस्ट है!</b> बस फ़्लैश राउंड, कुछ नया नहीं। तुमने बहुत अच्छी तैयारी की है। जाओ, छक्का लगाओ! 🏏';
  return '<b>टेस्ट हो गया, '+KID+'!</b> जब मन करे, अभ्यास के लिए वापस आना।';
}

function mistakeSection(){
  var wk = practiceIds(), bk = bookletIds(), n = wk.length + bk.length;
  var h = '<section class="mist" id="mistakes"><div class="misth"><span class="mic">📒</span><div class="mtx"><h2>मेरी गलतियाँ</h2><p>'+
    (n ? '<b>'+n+'</b> ठीक करनी हैं। यहाँ एक बार सही करो, तो सूची से हट जाएगी।' : 'अभी ठीक करने को कुछ नहीं। शाबाश! 🌟')+'</p></div></div>';
  function grp(title, ids){
    if(!ids.length) return '';
    return '<div class="mgrp"><small>'+title+' ('+ids.length+')</small><ul>'+ids.slice(0,4).map(function(id){ return '<li><span class="mchip">'+partChip(TPL[id].ch)+'</span>'+esc(shortQ(id))+'</li>'; }).join('')+
      (ids.length>4?'<li class="more">+ '+(ids.length-4)+' और</li>':'')+'</ul></div>';
  }
  if(n){
    h += grp('अभ्यास से', wk) + grp('मेरी कॉपी और बुकलेट से', bk);
    h += '<div class="btnrow"><button class="btn mbtn" data-act="fixmine">🔧 गलतियाँ ठीक करो ('+Math.min(n,15)+')</button></div>';
  }
  return h + '</section>';
}

}

/* ----- question bodies ----- */
function optBtn(q, u, o, i, act, picked, ans, done){
  var cls='opt'+(q.spell?' spell':'')+(q.sent?' sent':'');
  if(done){ if(o===ans) cls+=' ok'; else if(o===picked) cls+=' bad'; else cls+=' dim'; }
  return '<button class="'+cls+'" data-act="'+act+'" data-i="'+i+'"'+(done?' disabled':'')+'>'+(q.fx?'<span class="ol">'+LBL[i]+')</span> ':'')+esc(o)+'</button>';
}
function longOpts(opts){ return opts.some(function(o){ return o.length>22; }); }
function bodyMCQ(q,u){
  var h = '';
  if(q.uprompt) h += '<p class="prompt sentence">'+ulHTML(q.uprompt)+'</p><p class="hint">रेखांकित शब्द कौन-सा विशेषण है?</p>';
  else if(q.emoji) h += '<p class="prompt sm">'+esc(q.prompt)+'</p><div class="emo" role="img" aria-label="चित्र">'+q.emoji+'</div>';
  else if(q.word && !q.spell && q.label!=='वचन पहचानिए') h += '<div class="bigword">'+esc(q.word)+'</div><p class="prompt sm">'+esc(q.prompt)+'</p>';
  else if(q.word) h += '<p class="prompt sm">'+esc(q.prompt)+'</p><div class="bigword">'+esc(q.word)+'</div>';
  else { if(q.pre) h += '<p class="hint">'+esc(q.pre)+'</p>'; h += '<p class="prompt'+(q.oo?'':'')+'">'+esc(q.prompt)+'</p>'; if(q.oo) h += '<p class="hint">चार में से जो शब्द बाकी से अलग है, उस पर टैप करो।</p>'; }
  var one = q.sent || q.two || longOpts(q.opts);
  return h+'<div class="opts'+(one?' one':'')+'">'+q.opts.map(function(o,i){ return optBtn(q,u,o,i,'opt',u.picked,q.ans,u.done); }).join('')+'</div>';
}
function bodyTF(q,u){
  var h = '<p class="prompt stmt">“'+esc(q.prompt)+'”</p><div class="tfrow">';
  [[true,'✔ सही'],[false,'✘ गलत']].forEach(function(v){
    var cls='opt tfb';
    if(u.picked!==null){ if(v[0]===q.ans) cls+=' ok'; else if(v[0]===u.picked) cls+=' bad'; else cls+=' dim'; }
    h += '<button class="'+cls+'" data-act="tf" data-v="'+(v[0]?1:0)+'"'+(u.picked!==null?' disabled':'')+'>'+v[1]+'</button>';
  });
  h += '</div>';
  if(u.picked!==null && q.fix){
    h += '<div class="fixbox"><p class="glabel">'+(u.picked===q.ans?'हाँ, यह गलत है! अब इसे सही करो और बोनस पाओ:':'यह वाक्य गलत है। क्या तुम इसे सही कर सकती हो?')+'</p><p class="prompt sm">'+esc(q.fix.prompt)+'</p><div class="opts one">'+
      q.fix.opts.map(function(o,i){ return optBtn({fx:false},u,o,i,'fix',u.fixPicked,q.fix.ans,u.done); }).join('')+'</div></div>';
  }
  return h;
}
function bodyFill(q,u){
  var res = u.done ? fillScore(q,u.slots).res : null;
  function slot(i){
    var v=u.slots[i], cls='slot'+(v!==null?' filled':'')+(!u.done && u.sel===i?' sel':'');
    if(res) cls += res[i] ? ' ok' : ' bad';
    return '<button class="'+cls+'" data-act="slot" data-i="'+i+'"'+(u.done?' disabled':'')+'>'+(v!==null?esc(v):' ? ')+'</button>';
  }
  var h = '<p class="prompt sentence">';
  q.parts.forEach(function(p,i){ h += esc(p); if(i<q.parts.length-1) h += slot(i); });
  h += '</p>';
  h += '<div class="chips">'+q.chips.map(function(c,i){ var used=u.slots.indexOf(c)>=0; return '<button class="chp'+(used?' gone':'')+'" data-act="chip" data-i="'+i+'"'+(u.done||used?' disabled':'')+'>'+esc(c)+'</button>'; }).join('')+'</div>';
  if(!u.done) h += '<div class="btnrow"><button class="btn ink" data-act="check"'+(u.slots.indexOf(null)>=0?' disabled':'')+'>जाँचो</button></div>';
  return h;
}
function bodyTwo(q,u){
  var h = '<p class="prompt">दो उदाहरण चुनिए: <b>'+esc(q.prompt)+'</b></p><p class="hint">जो 2 सही हों, उन पर टैप करो।</p><div class="opts'+(longOpts(q.chips)?' one':'')+'">';
  q.chips.forEach(function(c,i){
    var sel = u.sel.indexOf(c)>=0, cls='opt';
    if(u.done){ var good=q.ok.indexOf(c)>=0; cls += sel ? (good?' ok':' bad') : (good?' also':' dim'); }
    else if(sel) cls+=' pick';
    h += '<button class="'+cls+'" data-act="tog" data-i="'+i+'"'+(u.done?' disabled':'')+'>'+esc(c)+'</button>';
  });
  h += '</div>';
  if(!u.done) h += '<div class="btnrow"><button class="btn ink" data-act="check"'+(u.sel.length<q.need?' disabled':'')+'>जाँचो</button></div>';
  return h;
}
function bodyTW(q,u){
  var h = '<p class="prompt sm">'+esc(q.prompt)+'</p><p class="hint">इस वाक्य में <b>'+q.need+'</b> विशेषण '+(q.need>1?'हैं':'है')+'।</p><div class="words">';
  q.words.forEach(function(w,i){
    var sel = u.sel.indexOf(i)>=0, cls='wd';
    if(u.done){ var good=q.ok.indexOf(w)>=0; cls += sel ? (good?' ok':' bad') : (good?' also':''); }
    else if(sel) cls+=' pick';
    h += '<button class="'+cls+'" data-act="word" data-i="'+i+'"'+(u.done?' disabled':'')+'>'+esc(w)+'</button>';
  });
  h += '<span class="wd" aria-hidden="true" style="border:0;background:none">।</span></div>';
  if(!u.done) h += '<div class="btnrow"><button class="btn ink" data-act="check"'+(u.sel.length<1?' disabled':'')+'>जाँचो</button></div>';
  return h;
}
function bodyMatch(q,u){
  var h = '<p class="prompt sm">बाईं ओर एक पर टैप करो, फिर दाईं ओर उसका जोड़ा।</p><div class="mrow"><div class="mcol">';
  q.left.forEach(function(l,i){
    var cls='mi'+(u.got[i]?' ok':'')+(u.L===i?' sel':'')+(u.flash&&u.flash.L===i?' bad shake':'');
    h += '<button class="'+cls+'" data-act="ml" data-i="'+i+'"'+(u.got[i]||u.done?' disabled':'')+'>'+esc(l)+'</button>';
  });
  h += '</div><div class="mcol">';
  q.right.forEach(function(r,j){
    var li = q.pair.indexOf(j), cls='mi r'+(u.got[li]?' ok':'')+(u.R===j?' sel':'')+(u.flash&&u.flash.R===j?' bad shake':'');
    h += '<button class="'+cls+'" data-act="mr" data-i="'+j+'"'+(u.got[li]||u.done?' disabled':'')+'>'+esc(r)+'</button>';
  });
  return h + '</div></div>';
}
function bodySort(q,u){
  var h = '<p class="prompt">'+esc(q.prompt)+'</p>';
  if(!u.done){ var it=q.items[u.i]; h += '<div class="tray"><small>'+q.items.length+' में से '+(u.i+1)+' · यह कहाँ जाएगा?</small><b class="pop">'+esc(it.t)+'</b></div>'; }
  h += '<div class="buckets">';
  q.buckets.forEach(function(b,bi){
    var inB = u.placed.filter(function(p){return p.b===bi;});
    h += '<button class="bk'+(u.flash===bi?' bad shake':'')+'" data-act="bucket" data-i="'+bi+'"'+(u.done?' disabled':'')+'><b>'+esc(b)+'</b><span class="in">'+
      inB.map(function(p){ return '<span class="'+(p.ok?'':'miss')+'">'+esc(p.t)+'</span>'; }).join('')+'</span></button>';
  });
  return h + '</div>';
}
function bodySeq(q,u){
  var h = '<p class="prompt">'+esc(q.prompt)+'</p><p class="hint">सही क्रम में एक-एक करके टैप करो।</p><ol class="seq">';
  q.steps.forEach(function(st,i){
    var f = u.filled[i];
    h += '<li class="'+(f?'f':'')+(i===u.filled.length&&!u.done?' cur':'')+'"><span class="n">'+(i+1)+'</span><span class="st">'+(f?esc(f):'?')+'</span></li>';
  });
  h += '</ol>';
  h += '<div class="chips">'+q.chips.map(function(c,i){ return '<button class="chp'+(u.used[c]?' gone':'')+(u.flash===c?' bad shake':'')+'" data-act="seq" data-i="'+i+'"'+(u.used[c]||u.done?' disabled':'')+'>'+esc(c)+'</button>'; }).join('')+'</div>';
  return h;
}
function bodySteps(q,u){
  var h = '<div class="passage">'+(q.title?'<b>'+esc(q.title)+'</b><br>':'')+esc(q.passage)+'</div>';
  q.parts.forEach(function(p,k){
    if(k<u.k){ var ok=u.picks[k]===p.ans; h += '<div class="stepdone '+(ok?'ok':'bad')+'"><small>'+(k+1)+'. '+esc(p.prompt)+'</small><b>'+(ok?'✓ ':'✗ '+esc(u.picks[k])+' → ')+esc(p.ans)+'</b></div>'; }
  });
  if(!u.done){ var p=q.parts[u.k]; h += '<p class="prompt sm">'+(u.k+1)+'. '+esc(p.prompt)+'</p><div class="opts'+(longOpts(p.opts)||p.opts.length===2?' one':'')+'">'+p.opts.map(function(o,i){ return '<button class="opt" data-act="step" data-i="'+i+'">'+esc(o)+'</button>'; }).join('')+'</div>'; }
  return h;
}
function bodyBuild(q,u){
  var h = '<p class="prompt">'+esc(q.prompt)+'</p><p class="hint">अच्छे उत्तर में जो वाक्य आएँगे, उन सब पर टैप करो। ऐसे <b>'+q.good.length+'</b> वाक्य हैं।</p><div class="opts one">';
  q.chips.forEach(function(c,i){
    var sel=u.sel.indexOf(c)>=0, cls='opt sent';
    if(u.done){ var good=q.good.indexOf(c)>=0; cls += sel ? (good?' ok':' bad') : (good?' also':' dim'); } else if(sel) cls+=' pick';
    h += '<button class="'+cls+'" data-act="tog" data-i="'+i+'"'+(u.done?' disabled':'')+'>'+esc(c)+'</button>';
  });
  h += '</div>';
  if(!u.done) h += '<div class="btnrow"><button class="btn ink" data-act="check"'+(u.sel.length<1?' disabled':'')+'>जाँचो</button></div>';
  return h;
}
function modelHTML(q){ return '<p class="model">'+q.pts.map(function(p){ return hl(p,q.kw); }).join(' ')+'</p>'; }
function writeHint(q){
  if(q.kind==='para') return 'यह <b>'+q.marks+' अंक</b> का प्रश्न है। प्रारूप (भूमिका → विषयवस्तु → निष्कर्ष) के अनुसार <b>8–10 छोटे वाक्य</b> लिखो।';
  if(q.kind==='copy' || q.kind==='plan') return 'इसे साफ़-साफ़ अपनी <b>कॉपी</b> में लिखो।';
  if(q.kind==='sent') return 'हर शब्द से एक पूरा वाक्य बनाओ और अंत में पूर्ण विराम (।) लगाओ।';
  if(q.kind==='draw') return 'कॉपी में चित्र बनाओ और उसके नीचे विशेषण के साथ संज्ञा लिखो।';
  if(q.kind==='hots') return 'यह <b>'+q.marks+' अंक</b> का प्रश्न है। अपने <b>3–4 विचार</b> पूरे वाक्यों में लिखो।';
  return 'यह <b>'+q.marks+' अंक</b> का प्रश्न है, इसलिए '+(q.marks>1?'<b>2–4 पूरे वाक्य</b>':'<b>1–2 पूरे वाक्य</b>')+' लिखो।';
}
function bodyNote(q,u){
  var h = '<p class="prompt">'+esc(q.prompt)+'</p>';
  if(u.phase==='write'){
    h += '<div class="nb"><span class="pen">✍️</span><p>अपनी <b>कॉपी</b> में लिखो। '+writeHint(q)+'</p></div>';
    h += '<div class="btnrow"><button class="btn" data-act="nbshow">मैंने लिख लिया — जाँचो</button></div>';
    return h;
  }
  h += '<p class="glabel">'+(q.kind==='para'?'तुम्हारे अनुच्छेद में ये बातें आईं? हर एक पर टिक करो:':'जो-जो तुमने लिखा, उस पर टिक करो:')+'</p><div class="opts one">';
  q.pts.forEach(function(p,i){ var on=u.ticks[i]; h += '<button class="opt sent'+(on?' ok':'')+'" data-act="nbpt" data-i="'+i+'"'+(u.done?' disabled':'')+'>'+(on?'☑ ':'☐ ')+hl(p,q.kw)+'</button>'; });
  h += '</div>';
  if(q.model) h += '<details class="modelbox"><summary>📄 नमूना अनुच्छेद देखो</summary><p class="model">'+esc(q.model)+'</p></details>';
  if(q.kw && q.kw.length) h += '<p class="kw">इन शब्दों की वर्तनी ध्यान से: '+q.kw.map(function(k){return '<b>'+esc(k)+'</b>';}).join(', ')+'</p>';
  if(!u.done) h += '<div class="btnrow"><button class="btn ink" data-act="nbdone">हो गया</button></div>';
  return h;
}
function fixSentence(fix){
  var p = fix.prompt.replace(/^सही करो: ?/,'');
  if(p.indexOf('___')>=0) return p.replace('___', fix.ans);
  return (p ? p+' ' : '')+fix.ans;
}
function answerLine(q){
  switch(q.type){
    case 'mcq': var ix = q.opts.indexOf(q.ans); return 'उत्तर: <b>'+(q.fx && ix>=0 ? '('+LBL[ix]+') ' : '')+esc(q.ans)+'</b>';
    case 'tf': return 'उत्तर: <b>'+(q.ans?'सही':'गलत')+'</b>'+(q.fix?'<br>सही वाक्य: <b>'+esc(fixSentence(q.fix))+'</b>':'');
    case 'fill': return q.parts.map(function(p,k){ return esc(p)+(k<q.parts.length-1?'<b>'+esc(q.ans[k][0])+'</b>':''); }).join('');
    case 'two': return 'सही उदाहरण: <b>'+q.ok.map(esc).join(', ')+'</b>';
    case 'tw': return 'विशेषण: <b>'+q.ok.map(esc).join(', ')+'</b>';
    case 'match': return q.left.map(function(l,i){ return esc(l)+' → <b>'+esc(q.right[q.pair[i]])+'</b>'; }).join('<br>');
    case 'seq': return '<b>'+q.steps.map(esc).join(' → ')+'</b>';
    case 'steps': return q.parts.map(function(p,k){ return (k+1)+'. '+esc(p.prompt)+' <b>'+esc(p.ans)+'</b>'; }).join('<br>');
    case 'build': return '<span class="glabel">ऐसे लिखो:</span>'+modelHTML(q);
  }
  return '';
}
function fbHTML(q,u,r){
  var ok = r.ok, h = '<div class="fb'+(ok?'':' bad')+'">';
  if(q.type==='note'){
    var n=u.ticks.filter(Boolean).length;
    h += '<p class="ft">'+(n===q.pts.length?'पूरे अंक! शाबाश!':n?'तुमने '+q.pts.length+' में से '+n+' बातें लिखीं।':'चलो, इसे सीखते हैं।')+'</p>';
    if(n<q.pts.length) h += '<p class="tip">जो बातें छूट गईं, उन्हें कॉपी में दूसरे रंग से जोड़ दो।</p>';
  } else {
    var tfFix = q.type==='tf' && q.fix && u.fixPicked!==null;
    h += '<p class="ft">'+(ok?pick(PRAISE):pick(OOPS))+(tfFix && u.fixPicked===q.fix.ans ? ' <span class="bonus">+5 बोनस</span>':'')+'</p>';
    var al = (q.type==='steps') ? '' : answerLine(q); if(al && (!ok || q.type==='build' || q.type==='tf')) h += '<div class="fa">'+al+'</div>';
  }
  if(QZ.mode==='fix') h += '<p class="fixline">'+(ok?'✅ ठीक हो गई! सूची से हट गई।':'📒 अभी सूची में है। यह फिर आएगी।')+'</p>';
  if(q.tip) h += '<p class="tip">'+esc(q.tip)+'</p>';
  if(q.note) h += '<p class="tip">'+esc(q.note)+'</p>';
  if(q.slip) h += '<div class="slipnote">🩺 '+esc(q.slip)+'</div>';
  h += '<div class="btnrow"><button class="btn" data-act="next">'+(QZ.i<QZ.list.length-1?'आगे →':'मेरा स्कोर देखो')+'</button></div></div>';
  return h;
}
function renderQuiz(){
  var q = QZ.list[QZ.i], u = QZ.ui, n = QZ.list.length;
  var h = '<div class="qhead"><button class="qx'+(armed.quit?' armed':'')+'" data-act="quit" aria-label="बंद करो">'+(armed.quit?'फिर से टैप करो':'✕')+'</button>'+
    '<div class="pbar"><i style="width:'+Math.round(QZ.i/n*100)+'%"></i></div><span class="combo">'+(QZ.combo>=2?'🔥'+QZ.combo:'')+'</span><span class="qn">'+(QZ.i+1)+'/'+n+'</span></div>';
  var marks = (QZ.mode==='bossA'||QZ.mode==='bossB') ? '<span class="mk">'+q.marks+' अंक</span>' : '';
  h += '<div class="sec"><span>'+esc(q.sec || q.label)+(q.part?' · ('+q.part+')':'')+'</span>'+marks+'</div>';
  var body = '';
  switch(q.type){
    case 'mcq': body=bodyMCQ(q,u); break; case 'tf': body=bodyTF(q,u); break; case 'fill': body=bodyFill(q,u); break;
    case 'two': body=bodyTwo(q,u); break; case 'tw': body=bodyTW(q,u); break; case 'match': body=bodyMatch(q,u); break; case 'sort': body=bodySort(q,u); break;
    case 'seq': body=bodySeq(q,u); break; case 'steps': body=bodySteps(q,u); break;
    case 'build': body=bodyBuild(q,u); break; case 'note': body=bodyNote(q,u); break;
  }
  h += '<div class="qc" data-type="'+q.type+'">'+body+'</div>';
  if(u.done) h += fbHTML(q,u,QZ.res[QZ.i]);
  return h;
}
function wrongTitle(q){
  if(q.type==='steps') return q.label;
  if(q.uprompt) return plainUL(q.uprompt);
  if(q.emoji) return 'चित्र '+q.emoji;
  if(q.oo) return 'बेमेल: '+q.opts.join(', ');
  if(q.word && q.label==='वचन पहचानिए') return 'वचन पहचानो: '+q.word;
  return q.prompt||q.label;
}
function renderResult(){
  var boss = QZ.mode==='bossA'||QZ.mode==='bossB';
  var h = '<div class="res"><div class="bigfrog sm">'+ART.mascot(lvl(S.xp))+'</div><p class="rt">'+esc(QZ.meta.title||'पूरा हुआ')+'</p>';
  if(boss) h += '<p class="score">'+QZ.marks+' / '+QZ.maxM+'</p><p class="sub">अंक'+(QZ.mode==='bossB'?' (कॉपी के उत्तर तुमने खुद जाँचे)':'')+'</p>';
  else h += '<p class="score">'+Math.round(QZ.pct*100)+'%</p>';
  h += '<p class="stars big">'+starStr(QZ.stars)+'</p><p class="sub">+'+QZ.xp+' रन'+(QZ.best>=3?' · लगातार सही 🔥'+QZ.best:'')+'</p>';
  var wrong = QZ.list.map(function(q,i){return {q:q, r:QZ.res[i]};}).filter(function(x){ return x.r && !x.r.ok; });
  var fixable = wrong.filter(function(x){ return canFix(x.q.key); });
  if(QZ.mode!=='fix' && fixable.length) h += '<div class="btnrow center"><button class="btn mbtn" data-act="fixthese">🔧 इन्हें अभी ठीक करो ('+fixable.length+')</button></div>';
  if(wrong.length){
    h += '<div class="wrongs"><h3>इन्हें याद रखो</h3>'+wrong.map(function(x){
      var q=x.q, line = q.type==='note' || q.type==='build' ? '<div class="small">'+modelHTML(q)+'</div>' : answerLine(q);
      return '<div class="wr"><b>'+esc(wrongTitle(q))+'</b><div>'+line+'</div></div>';
    }).join('')+'</div>';
  } else h += '<p class="perfect">हर एक सही! 🌟</p>';
  if(QZ.mode==='fix'){ var left = practiceIds().length + bookletIds().length; h += '<p class="perfect">'+QZ.list.length+' में से '+(QZ.fixed||0)+' ठीक हुईं। '+(left?left+' अभी सूची में हैं।':'सूची खाली हो गई! 🎉')+'</p>'; }
  if(QZ.mode==='bossA' && !S.boss.b) h += '<div class="btnrow center"><button class="btn" data-act="bossB">भाग 2 पर चलो →</button></div>';
  h += '<div class="btnrow center"><button class="btn ghost" data-act="again">फिर से खेलो</button><button class="btn" data-act="home">मैदान पर वापस</button></div></div>';
  return h;
}
function renderParent(){
  var h = '<div class="qhead"><button class="qx" data-act="home" aria-label="Back home">←</button><div class="ltitle en">For grown-ups</div></div>';
  h += '<div class="lc en"><h3>Plan</h3><div class="tw"><table class="t"><tr><th>Session</th><th>When</th><th>Status</th></tr>'+
    PLAN.map(function(p){ return '<tr><td>'+esc(p.id+' '+p.title)+'</td><td>'+esc(p.when)+'</td><td>'+(planDone(p)?'✅ done':'–')+'</td></tr>'; }).join('')+'</table></div></div>';
  h += '<div class="lc en"><h3>Parts</h3><div class="tw"><table class="t"><tr><th>Part</th><th>Best</th><th>Plays</th></tr>'+
    CH.map(function(c){ var r=S.ch[c.id]; return '<tr><td>'+esc(c.n+'. '+c.name)+'</td><td>'+(r?Math.round(r.best*100)+'%':'–')+'</td><td>'+(r?r.plays:0)+'</td></tr>'; }).join('')+'</table></div>'+
    '<p>Boss A: <b>'+(S.boss.a?S.boss.a.got+' / '+S.boss.a.max:'not yet')+'</b> · Boss B: <b>'+(S.boss.b?S.boss.b.got+' / '+S.boss.b.max:'not yet')+'</b> (Section B is self-checked, so take a look at her notebook).</p></div>';
  var mk = practiceIds();
  h += '<div class="lc en"><h3>Still shaky ('+mk.length+')</h3>'+(mk.length? '<ul class="shaky">'+mk.slice(0,25).map(function(id){ return '<li><b>'+esc(partChip(TPL[id].ch))+'</b> '+esc(shortQ(id))+' <span class="mini">×'+S.mist[id].n+'</span></li>'; }).join('')+'</ul>' : '<p>Nothing yet.</p>')+'</div>';
  h += '<div class="lc en"><h3>About the answers</h3><ul>'+
    '<li>Built from her Unit III booklet (pp 99–105) and notebook (7–27 Oct). Booklet p 98 (खंड क, प्र.1) and the क्रिकेट lesson pages were not in the scan, so the four unseen passages are original practice passages, and the lesson drills use only the booklet and notebook questions.</li>'+
    '<li>Booklet प्र.12 marks <b>प्रतिद्वंदी</b> as the correct spelling. Dictionaries give <b>प्रतिद्वंद्वी</b>. The app drills the booklet answer for the test and never shows प्रतिद्वंद्वी to her. Worth teaching after the test.</li>'+
    '<li>True/false “चार अंपायर” is गलत according to the lesson. In real international matches there is also a TV (third) umpire and a fourth umpire, so the app says “मैदान पर दो अंपायर”, which is true either way.</li>'+
    '<li>The answers on the three forms of cricket (Test 5 days, ODI 50 overs, T20 20 overs) are standard facts. I have not checked them against the lesson page.</li>'+
    '<li>The “सच्ची खेल भावना” item is a guess at the booklet question marked “चर्चा हो चुकी है”, whose wording was hidden by the page fold.</li>'+
    '<li>In “गॉड ऑफ क्रिकेट” she wrote a chandrabindu where ॉ goes. The app teaches ॉ but never shows her version, because with ँ it spells a rude word.</li>'+
    '<li>कमीज़े (missing bindu) in her notebook is a likely slip, because the scan is faint there.</li>'+
  '</ul></div>';
  h += '<div class="lc en"><h3>Settings</h3><p id="syncnote"></p><div class="btnrow"><button class="btn ghost'+(armed.reset?' danger':'')+'" data-act="reset">'+(armed.reset?'Tap again to clear all progress':'Clear progress')+'</button></div></div>';
  return h;
}
function render(){
  var top = document.getElementById('topin'); if(top) top.innerHTML = renderTop();
  var app = document.getElementById('app'); if(!app) return;
  var h = '';
  if(V.name==='home') h = renderHome();
  else if(V.name==='learn') h = renderLearn();
  else if(V.name==='quiz') h = renderQuiz();
  else if(V.name==='result') h = renderResult();
  else if(V.name==='parent') h = renderParent();
  app.innerHTML = h;
  paintSync();
}

document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el || el.disabled) return;
  var a = el.getAttribute('data-act');
  if(a!=='quit' && armed.quit){ armed.quit=false; }
  if(a!=='reset' && armed.reset){ armed.reset=false; }
  if(ACT[a]) ACT[a](el);
});

render();
setTimeout(initCloud, 0);

/* Study Hub cross-device sync (GitHub Pages build loads firebase + sync.js; absent elsewhere = no-op) */
if(typeof DikshaSync!=='undefined' && DikshaSync.init()){
  try{ DikshaSync.attachUI(); }catch(e){}
  DikshaSync.pull(STORE_KEY).then(function(remote){
    if(remote && typeof remote==='object' && (remote.t||0) > (S.t||0)){ S = normalize(remote); saveLocal(); if(V.name!=='quiz') render(); }
    DikshaSync.arm();
    try{ DikshaSync.push(STORE_KEY, S); }catch(e){}
  });
}

/* QA hooks */
window.__HIN = {TPL:TPL, make:make, chapterSet:chapterSet, labSet:labSet, bossA:bossA, bossB:bossB, slipSet:slipSet, flashSet:flashSet, spellSet:spellSet, vachanSet:vachanSet, factsOf:factsOf, norm:norm, practiceIds:practiceIds, bookletIds:bookletIds, fixSet:fixSet, cat:cat,
  grade:grade, fillScore:fillScore, start:startQuiz, state:function(){return S;}, quiz:function(){return QZ;}, view:function(){return V;}, act:ACT, render:render, idsOf:idsOf, planDone:planDone, nextPlan:nextPlan, sync:function(){return SYNC;}, examChip:examChip, heroMsg:heroMsg};
})();

</script>
