<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>संस्कृत-यात्रा</title>
<style>
:root{
  --bg:#ECEFFB; --bg2:#E2E6FA; --ink:#241F4E; --muted:#625E8A; --card:#FFFFFF; --line:#D6D9F2;
  --sun:#F29E1F; --sun-deep:#C9760A; --sun-soft:#FFF1D9;
  --ok:#1C9A67; --ok-bg:#E0F5EC; --bad:#D63F4C; --bad-bg:#FDE7E9;
  --sel:#2B6FD6; --sel-bg:#E3EDFD;
  --r:18px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans Devanagari","Mukta","Hind","Mangal","Nirmala UI",system-ui,sans-serif;font-size:17px;line-height:1.45;margin:0;
  background:radial-gradient(circle at 12% 0%,#FFF4E0 0,transparent 38%),radial-gradient(circle at 100% 30%,#E6F4EE 0,transparent 30%),var(--bg);
  min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(236,239,251,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.lvl{display:flex;flex-direction:column;flex:1;min-width:0}
.lvl b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#FFC24B);border-radius:9px;transition:width .5s}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.exam{background:var(--sun-soft);border-color:#F4CF93;color:#7A4A00}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px}
h2{font-size:20px;margin:26px 0 10px;text-wrap:balance}
.hero{display:flex;gap:12px;align-items:flex-end}
.bird{font-size:64px;line-height:1;filter:drop-shadow(0 4px 0 rgba(36,31,78,.12));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.bubble{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:20px 20px 20px 4px;padding:12px 14px;flex:1;box-shadow:4px 4px 0 var(--ink)}
.bubble b{font-size:20px}
.plan{margin-top:14px;background:var(--card);border:1px dashed #C9CCEB;border-radius:var(--r);padding:12px 14px;font-size:15px}
.plan ol{margin:6px 0 0;padding-left:20px}
.quest{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:var(--r);padding:12px 14px}
.quest .qb{flex:1}
.quest .xpbar{background:rgba(255,255,255,.2)}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.wt{text-align:left;border-radius:var(--r);padding:14px;border:2px solid transparent;display:flex;flex-direction:column;gap:4px;min-height:132px;position:relative;transition:transform .12s}
.wt:active{transform:scale(.97)}
.wt .ic{font-size:34px;line-height:1}
.wt .nm{font-weight:800;font-size:18px}
.wt .sb{font-size:13px;color:var(--muted)}
.wt .st{margin-top:auto;font-size:16px;letter-spacing:2px}
.wt .no{position:absolute;top:10px;right:12px;font-weight:800;font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.big-card{background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.big-card h3{margin:0;font-size:19px}
.big-card p{margin:0;font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:14px;font-weight:800;font-size:17px;background:var(--sun);color:#3A2300;box-shadow:0 4px 0 var(--sun-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-deep)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:1px solid var(--line)}
.btn.ink{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0f0c2a}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.foot{margin-top:34px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
/* learn */
.lc{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line);margin-top:12px}
.lc h3{margin:0 0 10px;font-size:20px}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:18px}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left}
table.t th{background:var(--bg2);font-size:15px}
.sa{font-weight:700}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.vg{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.vg .e{font-size:34px;line-height:1.2;min-height:40px}
.vg .s{font-weight:800;font-size:19px}
.vg .h{font-size:14px;color:var(--muted)}
.note{background:var(--sun-soft);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:16px}
.note.red{background:var(--bad-bg)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--ink)}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px}
.qx{min-width:44px;min-height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800}
.qx.armed{background:var(--bad);color:#fff;border-color:var(--bad);padding:0 10px;font-size:14px}
.pbar{flex:1;height:12px;background:var(--bg2);border-radius:12px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.combo{font-weight:800;min-width:48px;text-align:right}
.sec{margin:14px 0 6px;font-size:14px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.sec span:last-child{white-space:nowrap}
.qc{background:var(--card);border-radius:22px;padding:16px;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);margin-top:8px}
.prompt{font-size:18px;font-weight:700;margin:0 0 8px}
.pic{font-size:56px;line-height:1.15;text-align:center;margin:6px 0;letter-spacing:4px}
.bigw{font-size:34px;font-weight:800;text-align:center;margin:4px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:60px;border-radius:16px;background:var(--bg);border:2px solid var(--line);font-size:21px;font-weight:700;padding:8px 10px;text-align:center;transition:transform .08s}
.opt.abc{text-align:left;font-size:18px}
.opt:active{transform:scale(.97)}
.opt.ok,.chp.ok{background:var(--ok-bg);border-color:var(--ok);color:#0E5E3E}
.opt.bad,.chp.bad{background:var(--bad-bg);border-color:var(--bad);color:#8A1F29}
.opt.dim{opacity:.55}
.opt.pick{background:var(--sel-bg);border-color:var(--sel)}
.opt[disabled]{pointer-events:none}
.glabel{font-size:14px;font-weight:700;color:var(--muted);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chp{min-height:50px;padding:8px 14px;border-radius:14px;background:var(--bg);border:2px solid var(--line);font-size:20px;font-weight:700}
.chp.sel{background:var(--sel-bg);border-color:var(--sel)}
.chp.gone{visibility:hidden}
.chp[disabled]{pointer-events:none}
table.g{border-collapse:separate;border-spacing:6px;width:100%;font-size:18px}
table.g th{font-size:13px;color:var(--muted);font-weight:700;text-align:center}
table.g td{text-align:center}
table.g td.rh{font-size:14px;font-weight:700;color:var(--muted);text-align:left}
.cell{width:100%;min-height:50px;border-radius:12px;border:2px dashed #B9BDE3;background:var(--bg);font-size:19px;font-weight:700}
.cell.fixed{border-style:solid;border-color:transparent;background:transparent}
.cell.sel{border-color:var(--sel);background:var(--sel-bg)}
.cell.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mi{min-height:62px;border-radius:14px;background:var(--bg);border:2px solid var(--line);font-size:20px;font-weight:700;padding:6px 8px;display:flex;align-items:center;gap:8px;justify-content:center}
.mi .pe{font-size:34px}
.mi .lt{font-size:13px;color:var(--muted);font-weight:800}
.mi.sel{background:var(--sel-bg);border-color:var(--sel)}
.mi.ok{background:var(--ok-bg);border-color:var(--ok)}
.mi.bad{background:var(--bad-bg);border-color:var(--bad)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.bk{border-radius:16px;border:2px solid var(--ink);background:var(--card);padding:10px;min-height:104px;text-align:left;display:flex;flex-direction:column;gap:6px}
.bk b{font-size:16px}
.bk .in{display:flex;flex-wrap:wrap;gap:6px}
.bk .in span{background:var(--ok-bg);border-radius:10px;padding:2px 8px;font-weight:700;font-size:17px}
.bk.bad{border-color:var(--bad);background:var(--bad-bg)}
.hint{font-size:14px;color:var(--muted);margin-top:10px;min-height:20px}
.fb{margin-top:14px;border-radius:18px;padding:14px;border:2px solid var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb .ft{font-size:20px;font-weight:800;margin:0 0 4px}
.fb .fa{font-size:18px;margin:4px 0}
.fb .tip{font-size:16px;margin:6px 0 10px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pp .35s}
@keyframes pp{50%{transform:scale(1.07)}}
/* result */
.res{text-align:center}
.res .score{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.res .stars{font-size:44px;letter-spacing:6px;margin:6px 0}
.bd{margin-top:14px;text-align:left}
.bd .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.wrongs{margin-top:16px;text-align:left}
.wr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:15px}
.wr b{font-size:17px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:30;max-width:90%;text-align:center}
@media (max-width:420px){.opt{font-size:19px}.bigw{font-size:30px}.pic{font-size:48px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main id="app"></main>

<script>
(function(){

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=ri(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function uniqOpts(correct, forced, pool, n){
  var out=[correct];

  shuffle(pool).forEach(function(x){ if(out.length<n && out.indexOf(x)<0) out.push(x); });

}

function nounBy(w){ for(var i=0;i<NOUNS.length;i++){ if(NOUNS[i].w===w) return NOUNS[i]; } return null; }
function forms(n){
  if(n.g==='m'){ var b=n.w.slice(0,-1); return [n.w, b+'ौ', b+'ाः']; }
  if(n.g==='f'){ var c=n.w.slice(0,-1); return [n.w, c+'े', c+'ाः']; }
  var d=n.w.slice(0,-2); return [n.w, d+'े', n.pl];
}

function mcq(o){
  return {type:'mcq', key:o.key, prompt:o.prompt||'', big:o.big||'', pic:o.pic||'', opts:shuffle(o.opts), ans:o.ans,
    tip:o.tip||'', marks:o.marks||1, abc:!!o.abc, sec:o.sec||'', part:o.part||'', one:!!o.one};
}
function dayTip(d){

  return t;
}

function animalTip(a){

  if(a.sa==='गो') t += ' गो को गौः भी लिखते हैं।';
  if(a.sa==='महिषी') t += ' महिषी = भैंस (ई पर खत्म, स्त्रीलिंग)।';
  return t;
}

function lingaTip(n){

           f:'आ / ए / आः पर खत्म — जैसे बालिका, बालिके, बालिकाः',
           n:'अम् / ए / आनि पर खत्म — जैसे फलम्, फले, फलानि'};
  var fs = forms(n);
  return n.w + ' (' + n.hi + ') = ' + G[n.g] + '। ' + G[n.g] + ': ' + r[n.g] + '। रूप: ' + fs.join(', ');
}

/* dhatu */
function spellWrong(f){
  if(/ति$/.test(f)) return f.slice(0,-1)+'ी';
  if(/थः$/.test(f)) return f.slice(0,-2)+'शः';
  if(/थ$/.test(f)) return f.slice(0,-1)+'श';
  if(/ामि$/.test(f)) return f.slice(0,-1)+'ी';
  if(/सि$/.test(f)) return f.slice(0,-1)+'ी';
  if(/ामः$/.test(f)) return f.slice(0,-3)+'मः';
  if(/ावः$/.test(f)) return f.slice(0,-3)+'वः';
  return f+'ः';
}
function dhatuTip(v){
  var f=conj(v);
  return v.root+' (लट् लकार): '+f.slice(0,3).join(' ')+' | '+f.slice(3,6).join(' ')+' | '+f.slice(6).join(' ')+'। अंत में छोटी इ (ि), और मध्यम पुरुष में "थ" (श नहीं)।';
}
function qGrid(v,nb,o){ o=o||{};
  var f=conj(v); nb=nb||5;
  var blanks=sample([0,1,2,3,4,5,6,7,8],nb).sort(function(a,b){return a-b;});
  var wrong=[]; shuffle(blanks).forEach(function(i){ var w=spellWrong(f[i]); if(f.indexOf(w)<0 && wrong.indexOf(w)<0 && wrong.length<3) wrong.push(w); });
  var pool=shuffle(blanks.map(function(i){return f[i];}).concat(wrong));
  return {type:'grid', key:'gr-'+v.s+'-'+blanks.join(''), prompt:'धातुरूप लट् लकार में पूरा करो', root:v.root, forms:f, blanks:blanks, pool:pool,
    tip:dhatuTip(v), marks:o.marks||1, sec:o.sec||'', part:o.part||''};
}

function qSortVachana(o){ o=o||{};

function qMulti(g,o){ o=o||{};

  var bad=sample(NOUNS.filter(function(n){return n.g!==g;}),5);

function qVerbMatch(n,o){ o=o||{};
  var vs=[]; var used={};
  shuffle(VERBS).forEach(function(v){ if(vs.length<n && !(v.grp && used[v.grp]) && !used['hi'+v.hi]){ vs.push(v); if(v.grp) used[v.grp]=1; used['hi'+v.hi]=1; } });
  var right=shuffle(vs.map(function(v){return v.hi;}));
  return {type:'match', key:'vm-'+vs.map(function(v){return v.w;}).join(''), prompt:'संस्कृत क्रियाओं का हिंदी अर्थ से मिलान करो',
    left:vs.map(function(v){return {t:v.w, pic:''};}), right:right, pairs:vs.map(function(v){return right.indexOf(v.hi);}),
    tip:vs.map(function(v){return v.w+' = '+v.hi;}).join(' • '), marks:o.marks||1, sec:o.sec||'', part:o.part||''};
}
function qPicMatch(n,o){ o=o||{};

}

    sample(NOUNS.filter(function(n){return n.e && !n.one;}),3).forEach(function(n){q.push(qPicNoun(n,ri(3)));});

  return q;

function defState(){ return {v:1, xp:0, streak:0, lastDay:'', today:{d:'',xp:0}, stars:{}, best:{}, mistakes:[], sound:true, sessions:0}; }
function load(){
  try{ var r=localStorage.getItem(STORE_KEY); if(r){ var o=JSON.parse(r); var d=defState(); for(var k in d){ if(!(k in o)) o[k]=d[k]; } if(!Array.isArray(o.mistakes)) o.mistakes=[]; return o; } }catch(e){}
  return defState();
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
var S = load();

function now(){ return (typeof window.__SK_NOW==='number') ? new Date(window.__SK_NOW) : new Date(); }
function dayStr(dt){ var m=dt.getMonth()+1, d=dt.getDate(); return dt.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d; }
function todayXP(){ return S.today.d===dayStr(now()) ? S.today.xp : 0; }
function daysToExam(){
  var t=now(); var a=new Date(t.getFullYear(),t.getMonth(),t.getDate()); var b=new Date(EXAM_Y,EXAM_M-1,EXAM_D);
  return Math.round((b-a)/86400000);
}
function addXP(n){
  var t=dayStr(now());
  if(S.today.d!==t) S.today={d:t,xp:0};
  S.today.xp+=n; S.xp+=n;
}
function touchStreak(){
  var t=now(); var ts=dayStr(t); if(S.lastDay===ts) return;
  var y=new Date(t.getFullYear(),t.getMonth(),t.getDate()-1);
  S.streak = (S.lastDay===dayStr(y)) ? S.streak+1 : 1; S.lastDay=ts;
}

/* ---------------- sound + fx ---------------- */
var AC=null;
function beep(ok){
  if(!S.sound) return;
  try{
    if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return; AC=new C(); }
    var notes= ok===2 ? [523,659,784,1047] : ok ? [660,880] : [220,180];
    notes.forEach(function(f,i){ var o=AC.createOscillator(), g=AC.createGain(); o.type=ok?'triangle':'sawtooth'; o.frequency.value=f;
      var t0=AC.currentTime+i*0.09; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(ok?0.18:0.08,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);
      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+0.2); });
  }catch(e){}
}
function confetti(){
  try{
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv=document.getElementById('fx'); var cx=cv.getContext && cv.getContext('2d'); if(!cx) return;
    var W=cv.width=window.innerWidth, H=cv.height=window.innerHeight;
    var cols=['#F29E1F','#1C9A67','#D63F4C','#2B6FD6','#7457D9','#FFC24B'];
    var ps=[]; for(var i=0;i<120;i++) ps.push({x:W/2,y:H/3,vx:(Math.random()-0.5)*12,vy:Math.random()*-12-3,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6});
    var f=0; (function step(){ cx.clearRect(0,0,W,H); ps.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.a+=0.2; cx.fillStyle=p.c; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); });
      f++; if(f<110) requestAnimationFrame(step); else cx.clearRect(0,0,W,H); })();
  }catch(e){}
}

}

/* ---------------- session ---------------- */
function startSession(kind, qs, title, wid){
  if(!qs || !qs.length){ renderHome(); toast('भूल-सुधार डिब्बा खाली है — शाबाश!'); return; }
  Q={kind:kind, qs:qs, i:0, rec:[], combo:0, best:0, xp:0, title:title, wid:wid||'', quitArmed:false};
  newQState(); renderQ();
}
function newQState(){
  var q=Q.qs[Q.i];
  Q.st={done:false, miss:{}, sel:-1, filled:{}, placed:{}, picked:{}, wrong:{}, dsel:[-1,-1], chosen:-1, mcount:0, hint:''};
  if(q.type==='grid'){ Q.st.sel=q.blanks[0]; }
}
function qMax(q){ return q.marks||1; }
function round2(x){ return Math.round(x*100)/100; }

function answerText(q){
  if(q.type==='mcq') return q.ans;
  if(q.type==='double') return q.groups.map(function(g){return g.ans;}).join(', ');
  if(q.type==='grid') return [0,1,2].map(function(p){return q.forms.slice(p*3,p*3+3).join(' ');}).join(' | ');
  if(q.type==='match') return q.left.map(function(l,i){ return (l.pic||l.t)+' → '+q.right[q.pairs[i]]; }).join(' • ');
  if(q.type==='sort') return q.buckets.map(function(b,bi){ return b+': '+q.items.filter(function(it){return it.b===bi;}).map(function(it){return it.w;}).join(', '); }).join(' • ');
  if(q.type==='multi') return q.pool.filter(function(p){return p.ok;}).map(function(p){return p.w;}).join(', ');
  return '';
}

function renderQ(){
  view={name:'quiz'};
  var q=Q.qs[Q.i]; var st=Q.st; var n=Q.qs.length;
  var h='<div class="qhead"><button class="qx'+(Q.quitArmed?' armed':'')+'" data-act="quit" aria-label="छोड़ो">'+(Q.quitArmed?'फिर दबाओ = छोड़ो':'✕')+'</button>'+
    '<div class="pbar"><i style="width:'+Math.round(Q.i/n*100)+'%"></i></div><span class="combo">'+(Q.combo>=2?'🔥'+Q.combo:(Q.i+1)+'/'+n)+'</span></div>';
  if(q.sec) h+='<div class="sec"><span>'+q.sec+(q.part?' ('+q.part+')':'')+'</span><span>['+qMax(q)+' अंक]</span></div>';
  else h+='<div class="sec"><span>'+Q.title+'</span><span>'+(Q.i+1)+' / '+n+'</span></div>';
  h+='<div class="qc" id="qc"><p class="prompt">'+q.prompt+'</p>';
  if(q.pic) h+='<div class="pic">'+q.pic+'</div>';
  if(q.cap) h+='<div style="text-align:center;color:var(--muted);font-size:14px;margin-top:-4px">('+q.cap+')</div>';
  if(q.big) h+='<div class="bigw">'+q.big+'</div>';
  if(q.row) h+='<div class="tw"><table class="g"><tr><th>एकवचनम्</th><th>द्विवचनम्</th><th>बहुवचनम्</th></tr><tr>'+q.row.map(function(c){ return '<td><div class="cell'+(c?' fixed':'')+'">'+(c||'______')+'</div></td>'; }).join('')+'</tr></table></div><div style="height:10px"></div>';
  h+=renderBody(q,st);
  h+='<div class="hint" id="hint">'+(st.hint||'')+'</div></div>';
  h+='<div id="fbwrap">'+(st.done?feedbackHTML(q):'')+'</div>';
  app.innerHTML=h; renderTop();
}
function renderBody(q,st){
  var h='';
  if(q.type==='mcq'){
    h+='<div class="opts'+(q.one||q.abc?' one':'')+'">';
    q.opts.forEach(function(o,i){
      var cls='opt'+(q.abc?' abc':'');
      if(st.done){ if(o===q.ans) cls+=' ok'; else if(i===st.chosen) cls+=' bad'; else cls+=' dim'; }
      h+='<button class="'+cls+'" data-act="opt" data-i="'+i+'"'+(st.done?' disabled':'')+'>'+(q.abc?ABC[i]+') ':'')+o+'</button>';
    });
    h+='</div>';
  }
  if(q.type==='double'){
    q.groups.forEach(function(g,gi){
      h+='<div class="glabel">'+g.label+'</div><div class="opts one">';
      g.opts.forEach(function(o,i){
        var cls='opt abc';
        if(st.done){ if(o===g.ans) cls+=' ok'; else if(st.dsel[gi]===i) cls+=' bad'; else cls+=' dim'; }
        else if(st.dsel[gi]===i) cls+=' pick';
        h+='<button class="'+cls+'" data-act="dbl" data-g="'+gi+'" data-i="'+i+'"'+(st.done?' disabled':'')+'>'+o+'</button>';
      });
      h+='</div>';
    });
    if(!st.done) h+='<div style="margin-top:12px"><button class="btn" data-act="dblcheck"'+(st.dsel[0]<0||st.dsel[1]<0?' disabled':'')+'>जाँचो ✔</button></div>';
  }
  if(q.type==='grid'){
    h+='<div style="font-weight:800;font-size:22px;margin-bottom:6px">धातु: '+q.root+'</div>';
    h+='<div class="tw"><table class="g"><tr><th></th><th>एक</th><th>द्वि</th><th>बहु</th></tr>';
    [0,1,2].forEach(function(p){
      h+='<tr><td class="rh">'+PS[p]+'</td>';
      [0,1,2].forEach(function(c){
        var idx=p*3+c; var isB=q.blanks.indexOf(idx)>=0;
        if(!isB) h+='<td><div class="cell fixed">'+q.forms[idx]+'</div></td>';
        else if(st.filled[idx]) h+='<td><div class="cell ok">'+q.forms[idx]+'</div></td>';
        else h+='<td><button class="cell'+(st.sel===idx?' sel':'')+'" data-act="cell" data-c="'+idx+'">?</button></td>';
      });
      h+='</tr>';
    });
    h+='</table></div><div class="glabel">खाली खाना चुनो, फिर सही रूप दबाओ</div><div class="chips">';
    q.pool.forEach(function(w,i){ var used = q.forms.indexOf(w)>=0 && st.filled[q.forms.indexOf(w)];
      h+='<button class="chp'+(used?' gone':'')+'" data-act="gchip" data-i="'+i+'"'+(st.done||used?' disabled':'')+'>'+w+'</button>'; });
    h+='</div>';
  }
  if(q.type==='match'){
    h+='<div class="mrow"><div class="mcol">';
    q.left.forEach(function(l,i){
      var cls='mi'+(st.placed[i]!=null?' ok':'')+(st.sel===i?' sel':'');
      h+='<button class="'+cls+'" data-act="ml" data-i="'+i+'"'+(st.placed[i]!=null||st.done?' disabled':'')+'><span class="lt">'+LBL[i]+')</span>'+(l.pic?'<span class="pe">'+l.pic+'</span>':'<span>'+l.t+'</span>')+'</button>';
    });
    h+='</div><div class="mcol">';
    q.right.forEach(function(r,i){
      var li=-1; for(var k in st.placed){ if(st.placed[k]===i) li=+k; }
      h+='<button class="mi'+(li>=0?' ok':'')+'" data-act="mr" data-i="'+i+'"'+(li>=0||st.done?' disabled':'')+'>'+(li>=0?'<span class="lt">'+LBL[li]+'</span>':'')+'<span>'+r+'</span></button>';
    });
    h+='</div></div>';
    if(!st.done) h+='<div class="glabel">पहले बाईं ओर से चुनो, फिर दाईं ओर उसका जोड़ा।</div>';
  }
  if(q.type==='sort'){
    h+='<div class="chips">';
    q.items.forEach(function(it,i){
      var gone = st.placed[i]!=null;
      h+='<button class="chp'+(st.sel===i?' sel':'')+(gone?' gone':'')+'" data-act="schip" data-i="'+i+'"'+(gone||st.done?' disabled':'')+'>'+it.w+'</button>';
    });
    h+='</div><div class="buckets">';
    q.buckets.forEach(function(b,bi){
      var inn=q.items.map(function(it,i){return st.placed[i]===bi ? '<span>'+it.w+'</span>' : '';}).join('');
      h+='<button class="bk" data-act="sbuck" data-b="'+bi+'"'+(st.done?' disabled':'')+'><b>'+b+'</b><div class="in">'+inn+'</div></button>';
    });
    h+='</div>';
    if(!st.done) h+='<div class="glabel">शब्द दबाओ, फिर सही डिब्बा दबाओ।</div>';
  }
  if(q.type==='multi'){
    var got=0; for(var k in st.picked) got++;
    h+='<div class="glabel">चुने: '+got+' / '+q.need+'</div><div class="chips">';
    q.pool.forEach(function(p,i){
      var cls='chp'+(st.picked[i]?' ok':'')+(st.wrong[i]?' bad':'');
      h+='<button class="'+cls+'" data-act="mchip" data-i="'+i+'"'+(st.picked[i]||st.wrong[i]||st.done?' disabled':'')+'>'+p.w+'</button>';
    });
    h+='</div>';
  }
  return h;
}
function feedbackHTML(q){
  var r=Q.rec[Q.rec.length-1]; var full=r.got>=r.max-0.001;
  var h='<div class="fb'+(full?'':' bad')+'">';
  h+='<p class="ft">'+(full?pick(PRAISE):(r.got>0?'आधा सही! '+pick(OOPS):pick(OOPS)))+'</p>';
  if(!full) h+='<p class="fa">सही उत्तर: <b>'+answerText(q)+'</b></p>';
  if(Q.kind!=='world') h+='<p class="fa">अंक: <b>'+round2(r.got)+' / '+r.max+'</b></p>';
  h+='<p class="tip">💡 '+q.tip+'</p>';
  h+='<button class="btn" data-act="next" id="nextbtn">'+(Q.i<Q.qs.length-1?'आगे →':'परिणाम देखो 🏁')+'</button></div>';
  return h;
}
function finishQ(got){
  var q=Q.qs[Q.i]; var max=qMax(q);
  got=Math.max(0,Math.min(max,round2(got)));
  Q.rec.push({q:q, got:got, max:max});
  Q.st.done=true;
  var full=got>=max-0.001;
  if(full){ Q.combo++; Q.best=Math.max(Q.best,Q.combo); var x=10+Math.min(5,Math.max(0,Q.combo-2)*2); Q.xp+=x; beep(true); }
  else { Q.combo=0; if(got>0) Q.xp+=4; beep(false); }
  renderQ();
  var fb=document.getElementById('nextbtn'); if(fb && fb.scrollIntoView){ try{ fb.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} }
}
function flash(sel,cls){ var el=app.querySelector(sel); if(el){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); } }
function setHint(t){ Q.st.hint=t; var el=document.getElementById('hint'); if(el) el.textContent=t; }

function unitOf(q,n){ return qMax(q)/n; }
function handleTap(act, el){
  var q=Q.qs[Q.i]; var st=Q.st; if(st.done) return;
  var i = el.getAttribute('data-i')!=null ? +el.getAttribute('data-i') : -1;
  if(act==='opt' && q.type==='mcq'){
    st.chosen=i; finishQ(q.opts[i]===q.ans ? qMax(q) : 0); return;
  }
  if(act==='dbl'){ var g=+el.getAttribute('data-g'); st.dsel[g]=i; renderQ(); return; }
  if(act==='dblcheck'){
    if(st.dsel[0]<0||st.dsel[1]<0) return;
    var c=0; q.groups.forEach(function(gr,gi){ if(gr.opts[st.dsel[gi]]===gr.ans) c++; });
    finishQ(qMax(q)*c/2); return;
  }
  if(act==='cell'){ st.sel=+el.getAttribute('data-c'); st.hint=''; renderQ(); return; }
  if(act==='gchip'){
    if(st.sel<0 || st.filled[st.sel]){ setHint('पहले कोई खाली खाना चुनो।'); return; }
    var w=q.pool[i];
    if(w===q.forms[st.sel]){
      st.filled[st.sel]=true; beep(true);
      var left=q.blanks.filter(function(b){return !st.filled[b];});
      if(!left.length){ var good=q.blanks.filter(function(b){return !st.miss[b];}).length; finishQ(good*unitOf(q,q.blanks.length)); return; }
      st.sel=left[0]; st.hint=''; renderQ();
    } else {
      st.miss[st.sel]=true; beep(false);
      st.hint='"'+w+'" यहाँ नहीं आएगा। '+PS[Math.floor(st.sel/3)]+' + '+['एक','द्वि','बहु'][st.sel%3]+'वचन सोचो।';
      renderQ(); flash('[data-act="gchip"][data-i="'+i+'"]','shake');
    }
    return;
  }
  if(act==='ml'){ st.sel=i; st.hint=''; renderQ(); return; }
  if(act==='mr'){
    if(st.sel<0){ setHint('पहले बाईं ओर वाला चुनो।'); return; }
    if(q.pairs[st.sel]===i){
      st.placed[st.sel]=i; beep(true); st.sel=-1; st.hint='';
      var cnt=0; for(var k in st.placed) cnt++;
      if(cnt===q.left.length){ var ok=q.left.filter(function(_,li){return !st.miss[li];}).length; finishQ(ok*unitOf(q,q.left.length)); return; }
      renderQ();
    } else { st.miss[st.sel]=true; beep(false); st.hint='यह जोड़ा सही नहीं — फिर कोशिश करो।'; renderQ(); flash('[data-act="mr"][data-i="'+i+'"]','shake'); }
    return;
  }
  if(act==='schip'){ st.sel=i; st.hint=''; renderQ(); return; }
  if(act==='sbuck'){
    var b=+el.getAttribute('data-b');
    if(st.sel<0){ setHint('पहले कोई शब्द चुनो।'); return; }
    if(q.items[st.sel].b===b){
      st.placed[st.sel]=b; beep(true); st.sel=-1; st.hint='';
      var n2=0; for(var k2 in st.placed) n2++;
      if(n2===q.items.length){ var ok2=q.items.filter(function(_,ii){return !st.miss[ii];}).length; finishQ(ok2*unitOf(q,q.items.length)); return; }
      renderQ();
    } else { st.miss[st.sel]=true; beep(false); st.hint='"'+q.items[st.sel].w+'" इस डिब्बे का नहीं है।'; renderQ(); flash('[data-act="sbuck"][data-b="'+b+'"]','shake'); }
    return;
  }
  if(act==='mchip'){
    if(q.pool[i].ok){ st.picked[i]=true; beep(true); }
    else { st.wrong[i]=true; st.mcount++; beep(false); st.hint='"'+q.pool[i].w+'" इस लिंग का नहीं है।'; }
    var pc=0; for(var k3 in st.picked) pc++;
    if(pc>=q.need){ finishQ(Math.max(0,q.need-st.mcount)*unitOf(q,q.need)); return; }
    renderQ(); if(!q.pool[i].ok) flash('[data-act="mchip"][data-i="'+i+'"]','shake');
    return;
  }
}

function endSession(){
  var tot=0, got=0; Q.rec.forEach(function(r){ tot+=r.max; got+=r.got; });
  var pct = tot ? Math.round(got/tot*100) : 0;
  var stars = pct>=90?3:pct>=70?2:pct>=40?1:0;
  var bonus = Q.kind==='world' ? 20 : (Q.kind==='trap'||Q.kind==='mist') ? 20 : 50;
  if(pct===100) bonus+=20;
  addXP(Q.xp+bonus); touchStreak(); S.sessions++;
  if(Q.kind==='world'){ S.stars[Q.wid]=Math.max(S.stars[Q.wid]||0,stars); }
  if(Q.kind==='model'||Q.kind==='ws'||Q.kind==='trap'){ S.best[Q.kind]=Math.max(S.best[Q.kind]||0,pct); }
  // mistakes box
  Q.rec.forEach(function(r){
    var key=r.q.key; var full=r.got>=r.max-0.001;
    var idx=-1; for(var i=0;i<S.mistakes.length;i++){ if(S.mistakes[i].key===key){ idx=i; break; } }
    if(!full && idx<0){ var c=JSON.parse(JSON.stringify(r.q)); c.marks=1; c.sec=''; c.part=''; S.mistakes.push(c); }
    if(full && idx>=0 && Q.kind==='mist') S.mistakes.splice(idx,1);
  });
  if(S.mistakes.length>40) S.mistakes=S.mistakes.slice(S.mistakes.length-40);
  save();
  if(stars>=2) { confetti(); beep(2); }
  renderResult({got:round2(got), tot:round2(tot), pct:pct, stars:stars, xp:Q.xp+bonus});
}
function renderResult(R){
  view={name:'result'};
  var lines=['फिर से कोशिश करो — हर बार बेहतर होगा!','अच्छी शुरुआत! एक बार और?','बहुत बढ़िया! लगभग पक्का!','कमाल! तुम परीक्षा के लिए तैयार हो! 🏆'];
  var h='<div class="res"><div class="bird" aria-hidden="true">🦜</div><h2>'+Q.title+'</h2>';
  h+='<div class="score">'+R.got+' / '+R.tot+'</div><div style="font-size:18px">('+R.pct+'%)</div>';
  h+='<div class="stars" style="color:var(--sun)">'+starStr(R.stars)+'</div><p style="font-size:18px">'+lines[R.stars]+'</p><p>+'+R.xp+' ⭐ मिले • सबसे लंबा 🔥 '+Q.best+'</p></div>';
  if(Q.kind==='model'||Q.kind==='ws'){
    var secs={}, order=[];
    Q.rec.forEach(function(r){ var s=r.q.sec||'-'; if(!secs[s]){ secs[s]={g:0,m:0}; order.push(s); } secs[s].g+=r.got; secs[s].m+=r.max; });
    h+='<div class="lc bd"><h3>प्रश्न-वार अंक</h3>'+order.map(function(s){ var x=secs[s]; return '<div class="row"><span>'+s+'</span><b>'+round2(x.g)+'/'+round2(x.m)+'</b></div>'; }).join('')+'</div>';
  }
  var wr=Q.rec.filter(function(r){return r.got<r.max-0.001;});
  if(wr.length){
    h+='<div class="wrongs"><h3>इन्हें दोबारा देखो (भूल-सुधार डिब्बे में डाल दिए)</h3>'+wr.map(function(r){ return '<div class="wr">'+(r.q.sec?'<small>'+r.q.sec+'</small><br>':'')+(r.q.pic?r.q.pic+' ':'')+'<b>'+(r.q.big||r.q.prompt)+'</b><br>✔ '+answerText(r.q)+'</div>'; }).join('')+'</div>';
  }
  h+='<div class="btnrow" style="margin-top:18px;justify-content:center"><button class="btn" data-act="again">फिर से खेलो</button><button class="btn ghost" data-act="home">घर जाओ</button></div>';
  app.innerHTML=h; renderTop(); window.scrollTo(0,0);
}
var lastStart=null;
function launch(kind, arg){
  lastStart={kind:kind,arg:arg};
  if(kind==='world'){ var w=worldById(arg); startSession('world', genWorld(arg), w.icon+' '+w.name, arg); return; }
  if(kind==='trap'){ startSession('trap', shuffle(trapSet()), '🪤 जाल से बचो'); return; }
  if(kind==='mist'){ startSession('mist', shuffle(JSON.parse(JSON.stringify(S.mistakes))).slice(0,15), '🧰 भूल-सुधार'); return; }
  if(kind==='mock'){
    if(arg==='ws'){ startSession('ws', buildWorksheet(), '📝 कार्यभार शैली'); return; }
    var nm = arg==='ka'?'📜 आदर्श पेपर — खण्ड क': arg==='kha'?'📜 आदर्श पेपर — खण्ड ख':'📜 आदर्श प्रश्न-पत्र';
    startSession(arg==='model'?'model':'part', buildModel(arg), nm); return;
  }
}

/* ---------------- events ---------------- */
var quitT=null;
app.addEventListener('click', function(e){
  var el=e.target.closest ? e.target.closest('[data-act]') : null; if(!el || el.disabled) return;
  var act=el.getAttribute('data-act');
  if(act!=='reset' && resetArmed){ resetArmed=false; }
  switch(act){
    case 'home': renderHome(); return;
    case 'world': renderWorld(el.getAttribute('data-id'),0); return;
    case 'lprev': renderWorld(view.id,view.card-1); return;
    case 'lnext': renderWorld(view.id,view.card+1); return;
    case 'play': launch('world', el.getAttribute('data-id')); return;
    case 'trap': launch('trap'); return;
    case 'mist': if(S.mistakes.length) launch('mist'); return;
    case 'mock': launch('mock', el.getAttribute('data-k')); return;
    case 'again': if(lastStart) launch(lastStart.kind,lastStart.arg); return;
    case 'sound': S.sound=!S.sound; save(); renderHome(); return;
    case 'reset':
      if(!resetArmed){ resetArmed=true; renderHome(); setTimeout(function(){ if(resetArmed && view.name==='home'){ resetArmed=false; renderHome(); } },4000); return; }
      resetArmed=false; S=defState(); save(); renderHome(); toast('सब नया शुरू!'); return;
    case 'quit':
      if(!Q) { renderHome(); return; }
      if(!Q.quitArmed){ Q.quitArmed=true; renderQ(); clearTimeout(quitT); quitT=setTimeout(function(){ if(Q && Q.quitArmed){ Q.quitArmed=false; if(view.name==='quiz') renderQ(); } },3000); return; }
      Q.quitArmed=false; renderHome(); return;
    case 'next':
      if(!Q) return;
      if(Q.i<Q.qs.length-1){ Q.i++; Q.quitArmed=false; newQState(); renderQ(); window.scrollTo(0,0); }
      else endSession();
      return;
    default:
      if(Q && view.name==='quiz') handleTap(act, el);
  }
});

/* expose for QA */
window.SK = {DAYS:DAYS, ANIMALS:ANIMALS, NOUNS:NOUNS, VERBS:VERBS, TABLE_VERBS:TABLE_VERBS, SCENES:SCENES, conj:conj, forms:forms,
  genWorld:genWorld, trapSet:trapSet, buildModel:buildModel, buildWorksheet:buildWorksheet, WORLDS:WORLDS, learnCards:learnCards,
  answerText:answerText, state:function(){return S;}, session:function(){return Q;}, view:function(){return view;}, launch:launch, renderHome:renderHome, STORE_KEY:STORE_KEY};

renderHome();
})();
</script>
