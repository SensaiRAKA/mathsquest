var V={sec:null,mode:"practice",topic:"All",len:10,list:[],i:0,right:0,locked:false,
       tid:null,left:0,guess:false,log:[],mock:false,retest:null,L:null};

/* ================= home ================= */
function home(){
  if(V.tid)clearInterval(V.tid);
  V.retest=null;
  touchStreak();
  var acc=S.answered?Math.round(S.correct/S.answered*100):0;
  var h=sky(greet()+", Diksha","The sun rises with your accuracy. Right now it is at "+acc+"%.",Math.min(acc,100));
  h+='<div class="stat"><div><div class="n mono">'+(S.stars||0)+'</div><div class="l">Stars</div></div>'+
     '<div><div class="n mono">'+(S.streak||0)+'</div><div class="l">Day streak</div></div>'+
     '<div><div class="n mono">'+acc+'%</div><div class="l">Accuracy</div></div></div>';
  h+='<div class="grid">';
  SECS.forEach(function(k){
    var m=META[k],tot=BANK[k].length;
    var tried=0;
    BANK[k].forEach(function(it){var s=stat(it._k);if(s.r+s.w)tried++;});
    var pct=tot?Math.round(tried/tot*100):0;
    h+='<button class="sect '+m.cls+'" onclick="openSec(\''+k+'\')">'+
       '<div><div class="em">'+m.em+'</div><div class="nm">'+m.name+'</div>'+
       '<div class="mt">'+m.n+' marks in the paper &middot; '+tried+'/'+tot+' tried</div></div>'+
       '<div class="bar"><span style="width:'+pct+'%"></span></div></button>';
  });
  h+='</div>';
  h+='<button class="btn coral" onclick="startMock()">Mixed mock &middot; 20 questions, no feedback until the end</button>';
  h+='<button class="btn ghost" onclick="bank()">Mistakes Bank ('+S.mistakes.length+')</button>';
  h+='<button class="btn ghost" onclick="backup()">Backup &amp; restore progress</button>';
  h+='<div class="note">Mixed mock copies the real paper: all four subjects jumbled together, answers withheld until an OMR-style sheet at the end. That is the only mode that trains the transfer step.</div>';
  show(h);
}

/* ================= section screen ================= */
function openSec(k){V.sec=k;V.topic="All";drawSec();}
function drawSec(){
  var k=V.sec,m=META[k],tot=BANK[k].length;
  var tried=0;
  BANK[k].forEach(function(it){var s=stat(it._k);if(s.r+s.w)tried++;});
  var h='<div class="top"><button class="back" onclick="home()">&larr;</button><h2>'+m.em+' '+m.name+'</h2></div>';
  h+=sky(m.name,tried+" of "+tot+" questions tried",tot?Math.round(tried/tot*100):0);

  h+='<div class="card"><div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)">Choose a topic</div>';
  h+='<div class="chips"><button class="chip'+(V.topic==="All"?" on":"")+'" onclick="setTopic(\'All\')">All topics</button>';
  topics(k).forEach(function(t){
    var a=topicAcc(k,t),lab=esc(t);
    if(a.pct!==null)lab+=" "+a.pct+"%";
    h+='<button class="chip'+(V.topic===t?" on":"")+'" onclick="setTopic(\''+t.replace(/'/g,"\\'")+'\')">'+lab+
       (isLearned(k,t)?"":' <span style="opacity:.75">&#9733;</span>')+'</button>';
  });
  h+='</div><div class="note">A star means you have not opened the Learn cards for that topic yet.</div></div>';

  if(V.topic!=="All"){
    var nc=(LEARN[k]&&LEARN[k][V.topic])?LEARN[k][V.topic].length:0;
    h+='<button class="btn ghost" onclick="learn(\''+V.topic.replace(/'/g,"\\'")+'\',0)">Learn '+esc(V.topic)+' &middot; '+nc+' cards</button>';
  }

  h+='<div class="card"><div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px">Session length</div>'+
     '<div class="chips">'+
     '<button class="chip'+(V.len===10?" on":"")+'" onclick="setLen(10)">10 questions</button>'+
     '<button class="chip'+(V.len===20?" on":"")+'" onclick="setLen(20)">20 &middot; long session</button>'+
     '</div></div>';

  h+='<button class="btn" onclick="go(\'practice\')">Practice &middot; no clock</button>';
  h+='<button class="btn coral" onclick="go(\'timed\')">Timed drill &middot; 95 seconds each</button>';
  var mn=S.mistakes.filter(function(x){return IDX[x.k]&&IDX[x.k]._s===k;}).length;
  if(mn)h+='<div class="note">'+mn+' question'+(mn>1?"s":"")+' from your Mistakes Bank will be mixed into the next session automatically.</div>';
  h+='<div class="note">Questions you keep getting wrong come up more often than ones you have already mastered.</div>';
  show(h);
}
function setTopic(t){V.topic=t;drawSec();}
function setLen(n){V.len=n;drawSec();}

/* ================= learn mode ================= */
function learn(topic,i,thenGo){
  var cards=(LEARN[V.sec]&&LEARN[V.sec][topic])?LEARN[V.sec][topic]:[];
  if(!cards.length){if(thenGo)return begin(thenGo);return drawSec();}
  V.L={topic:topic,i:i,cards:cards,then:thenGo||null};
  drawLearn();
}
function drawLearn(){
  var L=V.L,c=L.cards[L.i];
  var h='<div class="top"><button class="back" onclick="exitLearn()">&larr;</button>'+
        '<div style="flex:1"><div class="qmeta"><span>Learn &middot; '+esc(L.topic)+'</span>'+
        '<span class="mono">'+(L.i+1)+' / '+L.cards.length+'</span></div></div></div>';
  h+='<div class="lcard"><h3>'+esc(c.h)+'</h3>';
  if(c.b)h+='<p>'+esc(c.b)+'</p>';
  if(c.e)h+='<div class="eg">'+esc(c.e)+'</div>';
  h+='</div>';
  h+='<div class="dots">';
  L.cards.forEach(function(x,n){h+='<i class="'+(n===L.i?"on":"")+'"></i>';});
  h+='</div>';
  h+='<div class="lnav">';
  if(L.i>0)h+='<button class="btn ghost" style="flex:1" onclick="lnav(-1)">Back</button>';
  if(L.i<L.cards.length-1)h+='<button class="btn" style="flex:2" onclick="lnav(1)">Next card</button>';
  else h+='<button class="btn" style="flex:2" onclick="doneLearn()">'+(L.then?"Start practising":"Done")+'</button>';
  h+='</div>';
  show(h);
}
function lnav(d){V.L.i+=d;drawLearn();}
function exitLearn(){var t=V.L?V.L.then:null;V.L=null;if(t)return drawSec();drawSec();}
function doneLearn(){
  S.learned[V.sec+"|"+V.L.topic]=1;save();
  var t=V.L.then;V.L=null;
  if(t)return begin(t);
  drawSec();
}

/* ================= session building ================= */
function weight(it){
  var s=stat(it._k),n=s.r+s.w;
  if(!n)return 2.5;                        // unseen material still circulates
  var acc=s.r/n;
  var w=1+5*(1-acc)+1.5*Math.min(s.w,5);   // repeated misses dominate the draw
  if(s.g)w+=2;                             // ever guessed it right -> not mastered
  if(n===1&&acc===1)w+=0.8;                // one lucky pass is not proof
  return w;
}
function weightedPick(pool,n){
  var src=pool.slice(),out=[];
  while(out.length<n&&src.length){
    var tot=0,i;
    for(i=0;i<src.length;i++)tot+=weight(src[i]);
    var r=Math.random()*tot,acc=0,chosen=src.length-1;
    for(i=0;i<src.length;i++){acc+=weight(src[i]);if(r<=acc){chosen=i;break;}}
    out.push(src.splice(chosen,1)[0]);
  }
  return out;
}
function go(mode){
  if(V.topic!=="All"&&!isLearned(V.sec,V.topic))return learn(V.topic,0,mode);
  begin(mode);
}
function begin(mode){
  V.mode=mode;V.mock=false;
  var pool=(V.topic==="All")?BANK[V.sec].slice():BANK[V.sec].filter(function(q){return q.t===V.topic;});
  // force-requeue mistakes from this section (and topic, if one is chosen)
  var due=[];
  S.mistakes.forEach(function(m){
    var it=IDX[m.k];
    if(!it||it._s!==V.sec)return;
    if(V.topic!=="All"&&it.t!==V.topic)return;
    due.push(it);
  });
  due=shuffle(due).slice(0,Math.min(3,Math.floor(V.len/3)));
  var dueKeys={};due.forEach(function(it){dueKeys[it._k]=1;});
  var rest=pool.filter(function(it){return !dueKeys[it._k];});
  var picked=due.concat(weightedPick(rest,Math.max(0,V.len-due.length)));
  V.list=shuffle(picked).map(prep);
  V.i=0;V.right=0;V.log=[];
  q();
}
function startMock(){
  V.mock=true;V.mode="mock";V.sec=null;V.topic="All";
  var plan={reasoning:2,mathematics:10,science:5,icso:3};
  var out=[];
  SECS.forEach(function(sec){
    out=out.concat(weightedPick(BANK[sec].slice(),plan[sec]));
  });
  // keep subject blocks in paper order, like the real booklet
  V.list=out.map(prep);
  V.i=0;V.right=0;V.log=[];
  q();
}
function prep(it){
  var pairs=it.o.map(function(txt,i){return {txt:txt,ok:(i===it.a)};});
  shuffle(pairs);
  var ans=0;
  pairs.forEach(function(p,i){if(p.ok)ans=i;});
  return {k:it._k,sec:it._s,q:it.q,o:pairs.map(function(p){return p.txt;}),a:ans,t:it.t,trap:it.trap,w:it.w};
}

/* ================= quiz ================= */
function q(){
  if(V.tid)clearInterval(V.tid);
  if(V.i>=V.list.length)return V.mock?mockResults():done();
  V.locked=false;V.guess=false;
  var item=V.list[V.i];
  var label=V.mock?(META[item.sec].name):(META[V.sec].name+" \u00B7 "+item.t);
  var h='<div class="top"><button class="back" onclick="quitQuiz()">&larr;</button>'+
        '<div style="flex:1"><div class="qmeta"><span>'+esc(label)+'</span>'+
        '<span class="mono">'+(V.i+1)+' / '+V.list.length+'</span></div>'+
        '<div class="bar"><span style="width:'+(V.i/V.list.length*100)+'%"></span></div></div></div>';
  if(V.mode==="timed"||V.mock)h+='<div class="timer" id="tw"><span id="tb"></span></div>';
  if(item.trap&&!V.mock)h+='<div class="trapflag">Look before you calculate</div>';
  h+='<div class="qtext">'+esc(item.q)+'</div><div id="opts">';
  var L=["A","B","C","D"];
  item.o.forEach(function(o,idx){
    h+='<button class="opt" id="o'+idx+'" onclick="pick('+idx+')"><span class="lb">'+L[idx]+'</span>'+esc(o)+'</button>';
  });
  h+='</div>';
  h+='<button class="guess" id="gz" onclick="toggleGuess()"><span class="bx" id="gb"></span>'+
     '<span>I am not sure - I am guessing this one</span></button>';
  h+='<div id="fb"></div>';
  show(h);
  if(V.mode==="timed"||V.mock){
    V.left=95;
    V.tid=setInterval(function(){
      V.left--;
      var b=el("tb"),w=el("tw");
      if(!b){clearInterval(V.tid);return;}
      b.style.width=(V.left/95*100)+"%";
      if(V.left<=20&&w)w.className="timer warn";
      if(V.left<=0){clearInterval(V.tid);pick(-1);}
    },1000);
  }
}
function toggleGuess(){
  if(V.locked)return;
  V.guess=!V.guess;
  var g=el("gz"),b=el("gb");
  if(g)g.className="guess"+(V.guess?" on":"");
  if(b)b.innerHTML=V.guess?"&#10003;":"";
}
function record(item,idx,ok){
  var s=S.qs[item.k]||{r:0,w:0,g:0};
  if(ok){s.r++;if(V.guess)s.g++;}else{s.w++;}
  S.qs[item.k]=s;
  S.answered=(S.answered||0)+1;
  if(ok){S.correct=(S.correct||0)+1;S.stars=(S.stars||0)+1;}
  var pickedTxt=(idx===-1)?"Ran out of time":item.o[idx];
  if(!ok){
    var dup=S.mistakes.some(function(m){return m.k===item.k;});
    if(!dup)S.mistakes.unshift({k:item.k,p:pickedTxt});
    if(S.mistakes.length>80)S.mistakes.length=80;
  }else if(!V.guess){
    S.mistakes=S.mistakes.filter(function(m){return m.k!==item.k;});
  }
  V.log.push({item:item,idx:idx,ok:ok,guess:V.guess});
  save();
  return pickedTxt;
}
function pick(idx){
  if(V.locked)return;
  V.locked=true;
  if(V.tid)clearInterval(V.tid);
  var item=V.list[V.i],ok=(idx===item.a);
  if(ok)V.right++;
  var pickedTxt=record(item,idx,ok);

  if(V.mock){ V.i++; return q(); }   // feedback withheld in mock

  for(var n=0;n<item.o.length;n++){
    var b=el("o"+n);
    if(!b)continue;
    b.disabled=true;
    if(n===item.a)b.className="opt right";
    else if(n===idx)b.className="opt wrong";
  }
  var msg;
  if(ok){
    confetti();
    msg=V.guess
      ? '<b>Correct - but you guessed it.</b> '+esc(item.w)+' This one will come back soon so you can get it for the right reason.'
      : '<b>Correct.</b> '+esc(item.w);
  }else{
    var head=(idx===-1)?"<b>Time ran out.</b> The answer is ":"<b>Not quite.</b> The answer is ";
    msg=head+'<b>'+esc(item.o[item.a])+'</b>. '+esc(item.w);
  }
  var lt=(LEARN[item.sec]&&LEARN[item.sec][item.t])?item.t:null;
  el("fb").innerHTML='<div class="fb">'+msg+'</div>'+
    (!ok&&lt?'<button class="btn ghost" onclick="learn(\''+lt.replace(/'/g,"\\'")+'\',0)">Read the '+esc(lt)+' cards</button>':'')+
    '<button class="btn" onclick="next()">'+((V.i+1>=V.list.length)?"See results":"Next question")+'</button>';
  el("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){V.i++;q();}
function quitQuiz(){
  if(V.tid)clearInterval(V.tid);
  if(V.mock)return home();
  drawSec();
}

/* ================= practice results ================= */
function done(){
  if(V.tid)clearInterval(V.tid);
  var pct=Math.round(V.right/V.list.length*100);
  var bk=V.sec+"_"+V.mode,b=S.best[bk]||0;
  if(pct>b){S.best[bk]=pct;save();}
  var line;
  if(pct>=90)line="Exam-ready on this topic.";
  else if(pct>=70)line="Solid. Clear the Mistakes Bank and run it again.";
  else if(pct>=50)line="Half there. Read the Learn cards for the weak topics below.";
  else line="This topic needs a slower pass. Read the Learn cards, then try 10 questions on one topic at a time.";

  // topic breakdown
  var by={};
  V.log.forEach(function(L){
    var t=L.item.t;
    if(!by[t])by[t]={r:0,n:0,g:0};
    by[t].n++;if(L.ok)by[t].r++;if(L.guess&&L.ok)by[t].g++;
  });
  var rows=Object.keys(by).sort(function(a,c){return (by[a].r/by[a].n)-(by[c].r/by[c].n);});

  var h=sky(pct+"%",V.right+" right out of "+V.list.length,pct);
  h+='<div class="card"><h3 style="margin:0 0 6px">'+esc(line)+'</h3>'+
     '<div class="note">Best so far in '+esc(META[V.sec].name)+' '+esc(V.mode)+': '+Math.max(pct,b)+'%</div></div>';
  h+='<div class="card"><div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px">How each topic went</div>';
  rows.forEach(function(t){
    var d=by[t],p=Math.round(d.r/d.n*100),weak=p<70;
    h+='<div class="tb'+(weak?" weak":"")+'"><span class="nm">'+esc(t)+
       (d.g?'<span class="badge">'+d.g+' guessed</span>':'')+'</span>'+
       '<span class="pill"><span style="width:'+p+'%"></span></span>'+
       '<span class="sc">'+d.r+'/'+d.n+'</span></div>';
  });
  h+='</div>';
  var worst=rows.length?rows[0]:null;
  if(worst&&by[worst].r/by[worst].n<0.7&&LEARN[V.sec]&&LEARN[V.sec][worst]){
    h+='<button class="btn" onclick="learn(\''+worst.replace(/'/g,"\\'")+'\',0)">Read the '+esc(worst)+' cards</button>';
    h+='<button class="btn ghost" onclick="V.topic=\''+worst.replace(/'/g,"\\'")+'\';begin(\'practice\')">Practise only '+esc(worst)+'</button>';
  }else{
    if(pct>=70)confetti();
    h+='<button class="btn" onclick="begin(\''+V.mode+'\')">Run it again</button>';
  }
  h+='<button class="btn ghost" onclick="bank()">Mistakes Bank ('+S.mistakes.length+')</button>';
  h+='<button class="btn ghost" onclick="drawSec()">Back to '+esc(META[V.sec].name)+'</button>';
  h+='<button class="btn ghost" onclick="home()">Home</button>';
  show(h);
}

/* ================= mock results: OMR sheet ================= */
function mockResults(){
  if(V.tid)clearInterval(V.tid);
  var pct=Math.round(V.right/V.list.length*100);
  S.mocks.unshift({d:today(),r:V.right,n:V.list.length});
  if(S.mocks.length>20)S.mocks.length=20;
  var b=S.best.mock||0;
  if(pct>b){S.best.mock=pct;}
  save();

  var h=sky(V.right+" / "+V.list.length,"Mixed mock \u00B7 "+pct+"%",pct);
  var byS={};
  V.log.forEach(function(L){
    var s=L.item.sec;
    if(!byS[s])byS[s]={r:0,n:0};
    byS[s].n++;if(L.ok)byS[s].r++;
  });
  h+='<div class="card"><div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px">Section by section</div>';
  SECS.forEach(function(s){
    if(!byS[s])return;
    var d=byS[s],p=Math.round(d.r/d.n*100);
    h+='<div class="tb'+(p<70?" weak":"")+'"><span class="nm">'+esc(META[s].name)+'</span>'+
       '<span class="pill"><span style="width:'+p+'%"></span></span>'+
       '<span class="sc">'+d.r+'/'+d.n+'</span></div>';
  });
  h+='</div>';

  h+='<div class="omr"><div class="hd"><span>ANSWER SHEET</span><span>UDAI &middot; Mock</span></div>';
  var lastSec=null;
  V.log.forEach(function(L,n){
    if(L.item.sec!==lastSec){
      lastSec=L.item.sec;
      h+='<div class="osec">'+esc(META[lastSec].name)+'</div>';
    }
    var lb=["A","B","C","D"],bs="";
    for(var i=0;i<4;i++){
      var cls="b";
      if(i===L.idx)cls+=" mine";
      if(i===L.item.a)cls+=" key";
      bs+='<span class="'+cls+'">'+lb[i]+'</span>';
    }
    h+='<div class="orow" onclick="tog('+n+')"><span class="nu">'+(n+1)+'</span>'+
       '<span class="bs">'+bs+'</span>'+
       '<span class="mk '+(L.ok?"ok":"no")+'">'+(L.ok?"&#10003;":"&#10007;")+'</span></div>'+
       '<div class="expand hide" id="x'+n+'"><b>'+esc(L.item.q)+'</b><br>'+
       'Correct: '+esc(L.item.o[L.item.a])+'<br>'+esc(L.item.w)+'</div>';
  });
  h+='<div class="note" style="color:#6b6152">Tap any row to see the question and why.</div></div>';
  h+='<div class="note">Green ring is the correct bubble, filled black is what you chose. On the real sheet nobody tells you - which is why you solve in the booklet, circle your answer, then transfer.</div>';
  h+='<button class="btn" onclick="startMock()">Another mock</button>';
  h+='<button class="btn ghost" onclick="bank()">Mistakes Bank ('+S.mistakes.length+')</button>';
  h+='<button class="btn ghost" onclick="home()">Home</button>';
  show(h);
}
function tog(n){
  var e=el("x"+n);
  if(e)e.className=(e.className.indexOf("hide")>=0)?"expand":"expand hide";
}

/* ================= mistakes bank: cold recall to clear ================= */
function bank(){
  V.retest=null;
  var h='<div class="top"><button class="back" onclick="home()">&larr;</button><h2>Mistakes Bank</h2></div>';
  if(!S.mistakes.length){
    h+='<div class="card"><div class="note">Nothing here. Questions you get wrong land in this list, and the only way out is to answer one correctly without seeing the options first.</div></div>';
    h+='<button class="btn ghost" onclick="home()">Home</button>';
    return show(h);
  }
  h+='<div class="note">'+S.mistakes.length+' saved. Reading the explanation is not enough - tap Test me and answer it cold. Get it right and it leaves the list.</div>';
  S.mistakes.forEach(function(m,i){
    var it=IDX[m.k];
    if(!it)return;
    var s=stat(m.k);
    h+='<div class="mb"><div class="qq">'+esc(it.q)+'</div>'+
       '<div class="ww">You put: '+esc(m.p)+'</div>'+
       '<div class="note">'+esc(META[it._s].name)+' &middot; '+esc(it.t)+
       (s.w>1?' &middot; missed '+s.w+' times':'')+'</div>'+
       '<div class="row" style="gap:8px">'+
       '<button style="flex:1" onclick="retest('+i+')">Test me</button>'+
       (LEARN[it._s]&&LEARN[it._s][it.t]?'<button style="flex:1" onclick="bankLearn(\''+it._s+'\',\''+it.t.replace(/'/g,"\\'")+'\')">Learn cards</button>':'')+
       '</div></div>';
  });
  show(h);
}
function bankLearn(sec,t){V.sec=sec;learn(t,0);}
function retest(i){
  var m=S.mistakes[i];
  var it=IDX[m.k];
  if(!it)return bank();
  V.retest={i:i,item:prep(it)};
  drawRetest(null);
}
function drawRetest(result){
  var R=V.retest,item=R.item;
  var h='<div class="top"><button class="back" onclick="bank()">&larr;</button><h2>Test me</h2></div>';
  h+='<div class="note">'+esc(META[item.sec].name)+' &middot; '+esc(item.t)+'</div>';
  h+='<div class="qtext">'+esc(item.q)+'</div>';
  var L=["A","B","C","D"];
  item.o.forEach(function(o,idx){
    var cls="opt";
    if(result!==null){
      if(idx===item.a)cls="opt right";
      else if(idx===result)cls="opt wrong";
    }
    h+='<button class="'+cls+'"'+(result!==null?" disabled":"")+' onclick="answerRetest('+idx+')"><span class="lb">'+L[idx]+'</span>'+esc(o)+'</button>';
  });
  if(result!==null){
    var ok=(result===item.a);
    h+='<div class="fb">'+(ok
      ?'<b>Correct, cold.</b> '+esc(item.w)+' Removed from the bank.'
      :'<b>Still not there.</b> The answer is <b>'+esc(item.o[item.a])+'</b>. '+esc(item.w)+' It stays in the bank.')+'</div>';
    h+='<button class="btn" onclick="bank()">Back to the bank</button>';
  }
  show(h);
}
function answerRetest(idx){
  var R=V.retest;
  if(!R||R.done)return;
  R.done=true;
  var ok=(idx===R.item.a);
  var s=S.qs[R.item.k]||{r:0,w:0,g:0};
  if(ok){s.r++;}else{s.w++;}
  S.qs[R.item.k]=s;
  S.answered=(S.answered||0)+1;
  if(ok){
    S.correct=(S.correct||0)+1;
    S.stars=(S.stars||0)+2;
    S.mistakes=S.mistakes.filter(function(m){return m.k!==R.item.k;});
    confetti();
  }else{
    var e=S.mistakes.filter(function(m){return m.k===R.item.k;})[0];
    if(e)e.p=R.item.o[idx];
  }
  save();
  drawRetest(idx);
}

/* ================= backup ================= */
function backup(){
  var code="";
  try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){code="";}
  var h='<div class="top"><button class="back" onclick="home()">&larr;</button><h2>Backup &amp; restore</h2></div>';
  h+='<div class="card"><div class="note">Copy this code somewhere safe. Paste it back on a new device or after clearing browser data.</div>'+
     '<textarea id="code" readonly>'+esc(code)+'</textarea>'+
     '<button class="btn" onclick="copyCode()">Copy code</button></div>';
  h+='<div class="card"><div class="note">Paste a saved code here to restore progress. This replaces what is stored now.</div>'+
     '<textarea id="restore" placeholder="Paste code here"></textarea>'+
     '<button class="btn coral" onclick="doRestore()">Restore from code</button>'+
     '<div id="rmsg" class="note"></div></div>';
  show(h);
}
function copyCode(){
  var t=el("code");t.select();t.setSelectionRange(0,999999);
  try{document.execCommand("copy");t.blur();el("rmsg")&&0;alert("Code copied.");}
  catch(e){alert("Select the text and copy it manually.");}
}
function doRestore(){
  var v=el("restore").value.trim();
  if(!v){el("rmsg").textContent="Paste a code first.";return;}
  try{
    var o=JSON.parse(decodeURIComponent(escape(atob(v))));
    for(var k in o)S[k]=o[k];
    save();
    el("rmsg").textContent="Progress restored.";
    setTimeout(home,700);
  }catch(e){
    el("rmsg").textContent="That code could not be read. Check it was copied in full.";
  }
}

/* ================= go ================= */
load();
home();
</script>
