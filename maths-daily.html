var BADGES = {
  first:["&#127793;","First Day","Finished a daily practice"],
  s3:["&#128293;","3 Days","A 3-day streak"], s7:["&#128293;","1 Week","A 7-day streak"],
  s14:["&#127941;","2 Weeks","A 14-day streak"], s30:["&#127942;","30 Days","A 30-day streak"],
  perfect:["&#127919;","Bullseye","A perfect daily practice"], buster:["&#128170;","Mistake Buster","Fixed 10 mistakes"],
  explorer:["&#129517;","Explorer","Tried every skill once"], bloom:["&#127800;","First Bloom","One whole chapter strong"],
  garden:["&#127966;&#65039;","Full Garden","Every chapter strong"], reader:["&#128218;","Rule Reader","Opened 10 rule cards"]
};
function grant(id){ if(BADGES[id] && S.badges.indexOf(id)<0){ S.badges.push(id); return true; } return false; }
function chapterSkills(ch){ return SKILLS.filter(function(s){ return s.ch===ch && !s.daily; }); }
function chapterStrong(ch){ var l=chapterSkills(ch); return l.length>0 && l.every(function(s){ return skState(s.id).b>=STRONG; }); }
function checkBadges(out){
  var g=function(id){ if(grant(id)) out.push(id); };
  if(S.streak>=3) g("s3"); if(S.streak>=7) g("s7"); if(S.streak>=14) g("s14"); if(S.streak>=30) g("s30");
  if(S.fixed>=10) g("buster");
  if(S.reads>=10) g("reader");
  var act=SKILLS.filter(enabled);
  if(act.length && act.every(function(s){ return skState(s.id).n>0; })) g("explorer");
  var chs=CHAPTERS.filter(function(c){ return !S.off[c.id] && chapterSkills(c.id).length; });
  if(chs.some(function(c){ return chapterStrong(c.id); })) g("bloom");
  if(chs.length && chs.every(function(c){ return chapterStrong(c.id); })) g("garden");
}

/* garden: one plant per chapter, grown by the average box of its skills */
function plantOf(ch){
  var l=chapterSkills(ch); if(!l.length) return {em:"&#127793;", strong:0, total:0, seen:0, avg:0};
  var sum=0, strong=0, seen=0;
  l.forEach(function(s){ var st=skState(s.id); sum+=st.b; if(st.b>=STRONG) strong++; if(st.n>0) seen++; });
  var avg=sum/l.length, em;
  if(strong===l.length) em="&#127800;";
  else if(avg>=4) em="&#127795;";
  else if(avg>=2.5) em="&#129716;";
  else if(avg>=1) em="&#127807;";
  else if(seen>0) em="&#127793;";
  else em="&#127792;";
  return {em:em, strong:strong, total:l.length, seen:seen, avg:avg};
}

/* =======================================================================
   HOME
   ======================================================================= */
var app=document.getElementById("app");
function greet(){ var h=new Date().getHours(); return h<12 ? "Good morning" : (h<17 ? "Good afternoon" : "Good evening"); }
function doneToday(){ return S.done && S.done.d===todayISO(); }
function weekStrip(){
  var t=todayISO(), h='<div class="week">';
  for(var k=6;k>=0;k--){
    var d=addDays(t,-k), on=(S.log||[]).some(function(e){ return e.d===d; });
    var lab=new Date(d+"T00:00:00").toLocaleDateString("en-IN", WEEKDAY_FMT).charAt(0);
    h+='<div class="wd'+(on?" on":"")+(k===0?" now":"")+'"><span>'+(on?"&#10003;":"")+'</span><b>'+lab+'</b></div>';
  }
  return h+'</div>';
}
var WEEKDAY_FMT = {weekday:"short"};
function home(){
  clearTimer(); R=null;
  var p=plan(S.n, false), t=todayISO();
  var rev=p.chosen.filter(function(c){ return c.why==="review"; }).length, nw=p.chosen.filter(function(c){ return c.why==="first" || c.why==="new"; }).length;
  var tot=p.units.length+p.chosen.length+p.mist.length;
  var mins=Math.max(5, Math.round((tot*55 + p.chosen.filter(function(c){ return needsCard(c.sk); }).length*45)/60));
  var h='<h1>Daily Maths Garden &#127793;</h1><p class="sub">'+greet()+', Diksha! A little maths every day keeps it all strong.</p>';
  if(!doneToday()){
    h+='<div class="card today"><div class="qtype">Today&#39;s practice</div>'+
       '<div class="tbig">'+tot+' questions &middot; about '+mins+' min</div>'+
       '<div class="mixline">'+(p.units.length?'<span class="pill">&#129518; 2 tables</span>':'')+(rev?'<span class="pill">&#128257; '+rev+' review'+(rev>1?'s':'')+'</span>':'')+
       (nw?'<span class="pill">&#10024; '+nw+' to try</span>':'')+(p.mist.length?'<span class="pill">&#128170; '+p.mist.length+' to fix</span>':'')+'</div>'+
       '<button class="btn" id="startBtn" onclick="startDaily()">Start today&#39;s practice &#9654;</button>'+
       '<p class="smallnote" style="margin-top:8px">&#9999;&#65039; Keep your rough notebook and a pencil next to you.</p></div>';
  } else {
    h+='<div class="card today done"><div class="qtype">Today&#39;s practice</div><div class="tbig">&#9989; Done for today! '+S.done.score+'/'+S.done.max+'</div>'+
       '<p class="sub" style="margin:4px 0 10px">Come back tomorrow to keep your streak. Want a few more now?</p>'+
       '<button class="btn ghost" onclick="startExtra()">Extra round (6 more)</button></div>';
  }
  h+=weekStrip();
  h+='<div class="tools">'+
     '<button class="tool" onclick="startFix()"><div class="t">&#128170; Fix My Mistakes</div><div class="d">'+(wrongCount()?wrongCount()+' waiting':'Nothing waiting. Great!')+'</div></button>'+
     '<button class="tool" onclick="library()"><div class="t">&#128218; Rule Book</div><div class="d">Every rule, with practice</div></button></div>';
  h+='<h2>My garden</h2><p class="sub" style="margin-top:-4px">Each chapter is a plant. Answer its questions right on different days and it grows into a flower.</p><div class="garden">';
  CHAPTERS.forEach(function(c){
    if(S.off[c.id] || !chapterSkills(c.id).length) return;
    var pl=plantOf(c.id);
    h+='<div class="plant"><div class="pe">'+pl.em+'</div><div class="pn">'+c.name+'</div><div class="ps">'+pl.strong+'/'+pl.total+' strong</div>'+
       '<div class="pbar"><i style="width:'+Math.round(pl.avg/6*100)+'%"></i></div></div>';
  });
  h+='</div>';
  h+='<h2>Badges ('+S.badges.length+'/'+Object.keys(BADGES).length+')</h2><div>';
  Object.keys(BADGES).forEach(function(k){ var b=BADGES[k], got=S.badges.indexOf(k)>=0; h+='<span class="badge" style="'+(got?"":"opacity:.35")+'">'+b[0]+' '+b[1]+'</span>'; });
  h+='</div>';
  h+='<details class="papa" id="papa"><summary>For Papa / Mummy</summary>'+papaHtml()+'</details>';
  h+='<p class="smallnote">'+S.xp+' XP &middot; best streak '+S.best+' day'+(S.best===1?'':'s')+'. Progress saves on this device and syncs if sync is on.</p>';
  app.innerHTML=h; paintHud(); window.scrollTo(0,0);
}
function papaHtml(){
  var t=todayISO(), h='';
  var last7=(S.log||[]).filter(function(e){ return daysBetween(e.d,t)<7; });
  var sc=0, mx=0; last7.forEach(function(e){ sc+=e.s; mx+=e.m; });
  h+='<p class="sub" style="margin-top:10px"><b>Last 7 days:</b> '+last7.length+' of 7 days practised'+(mx?' &middot; '+Math.round(sc/mx*100)+'% right':'')+
     ' &middot; '+wrongCount()+' mistakes waiting.</p>';
  h+='<p class="sub"><b>How it works:</b> each skill sits in a box from 0 to 6. A right answer moves it up one box and pushes the next review further away (1, 2, 4, 7, 14, then 30 days). A skill she gets right the very first time starts at the 4-day gap, because she has already learnt it in class. A wrong answer drops it two boxes and brings it back tomorrow with its rule card first. Green = strong (7+ days).</p>';
  h+='<div class="sktable">';
  CHAPTERS.forEach(function(c){
    var l=SKILLS.filter(function(s){ return s.ch===c.id; }); if(!l.length) return;
    h+='<div class="skh"><span>'+c.icon+' '+c.name+'</span><button class="tog'+(S.off[c.id]?'':' on')+'" onclick="toggleCh(\''+c.id+'\')">'+(S.off[c.id]?'Paused':'On')+'</button></div>';
    l.forEach(function(s){
      var st=skState(s.id), acc=st.n?Math.round(st.r/st.n*100)+'%':'&ndash;';
      var nxt = s.daily ? 'every day' : (st.b===0 ? 'not yet' : (st.due<=t ? 'due now' : 'in '+daysBetween(t,st.due)+' d'));
      var cls = s.daily ? 'dl' : (st.b===0 ? 'b0' : (st.b>=STRONG ? 'bg' : (st.b>=2 ? 'ba' : 'br')));
      h+='<div class="skr"><span class="nm">'+s.name+'</span><span class="bx6 '+cls+'">'+(s.daily?'&#9679;':st.b)+'</span><span class="ac">'+acc+'</span><span class="nx">'+nxt+'</span></div>';
    });
  });
  h+='</div>';
  h+='<p class="sub" style="margin-top:12px"><b>Questions per day</b> (2 tables, up to 2 mistakes, the rest from the schedule):</p><div class="row">'+
     [8,12,16].map(function(n){ return '<button class="btn '+(S.n===n?'warm':'ghost')+'" onclick="setN('+n+')">'+n+'</button>'; }).join("")+'</div>';
  h+='<p class="sub" style="margin-top:12px"><b>Adding a lesson:</b> when a new chapter starts in class, share its worksheets with Claude in the Diksha study project and ask to add it to Daily Maths. New skills enter 2 a day, each with its rule card first, and join the schedule.</p>';
  h+='<div class="card"><button class="btn ghost" onclick="resetAsk()">Reset all progress</button><div id="resetZone"></div></div>';
  return h;
}
function toggleCh(id){ if(S.off[id]) delete S.off[id]; else S.off[id]=true; save(); home(); var p=document.getElementById("papa"); if(p){ p.open=true; if(p.scrollIntoView) p.scrollIntoView(); } }
function setN(n){ S.n=n; save(); home(); var p=document.getElementById("papa"); if(p){ p.open=true; if(p.scrollIntoView) p.scrollIntoView(); } }
function resetAsk(){
  document.getElementById("resetZone").innerHTML='<p class="sub" style="margin-top:12px">Sure? This clears the garden, streak, XP, badges and mistakes.</p>'+
    '<div class="row"><button class="btn warm" onclick="doReset()">Yes, reset</button><button class="btn ghost" onclick="home()">Cancel</button></div>';
}
function doReset(){ try{ localStorage.removeItem(KEY); }catch(e){} S=blank(); S.imp=1; save(); home(); }

/* =======================================================================
   RULE BOOK (concept library)
   ======================================================================= */
function cardsByChapter(){
  var out=[];
  CHAPTERS.forEach(function(c){
    var ids=[]; SKILLS.forEach(function(s){ if(s.ch===c.id && s.learn && LS[s.learn] && ids.indexOf(s.learn)<0) ids.push(s.learn); });
    if(ids.length) out.push({c:c, ids:ids});
  });
  return out;
}
function library(){
  clearTimer(); R=null;
  var h='<div class="qtop"><button class="back" onclick="home()">&#8592;</button><div class="dots"></div></div>'+
    '<h1>&#128218; Rule Book</h1><p class="sub">Forgot how something works? Open its card, read it, then practise 5 fresh questions.</p>';
  cardsByChapter().forEach(function(g){
    if(S.off[g.c.id]) return;
    h+='<h2>'+g.c.icon+' '+g.c.name+'</h2><div class="slist">';
    g.ids.forEach(function(id){
      h+='<button class="scard" onclick="openCard(\''+id+'\')"><div style="flex:1;min-width:0"><div class="t">'+LS[id].title+'</div></div><div class="r">&#9654;</div></button>';
    });
    h+='</div>';
  });
  h+='<button class="btn ghost" style="margin-top:16px" onclick="home()">Back home</button>';
  app.innerHTML=h; window.scrollTo(0,0);
}
function openCard(id){
  var l=LS[id]; if(!l) return library();
  S.reads=(S.reads||0)+1; var nb=[]; checkBadges(nb); save();
  var sks=SKILLS.filter(function(s){ return s.learn===id; });
  var h='<div class="qtop"><button class="back" onclick="library()">&#8592;</button><div class="dots"></div></div>'+
    '<div class="card learn"><div class="qtype" style="color:var(--sky)">'+l.ch+'</div><h3>'+l.title+'</h3>'+l.html+'</div>'+
    (sks.length?'<button class="btn mint" onclick="startPractice(\''+id+'\')">Practise 5 questions &#9654;</button>':'')+
    '<button class="btn ghost" style="margin-top:10px" onclick="library()">Back to the Rule Book</button>';
  app.innerHTML=h; window.scrollTo(0,0);
}

/* =======================================================================
   STARTING SESSIONS
   ======================================================================= */
function startDaily(){
  var list=buildSession(S.n, false);
  runItems({id:"daily", mode:"daily", title:"Today's practice"}, list);
}
function startExtra(){
  var list=buildSession(6, true);
  if(!list.length){ home(); return; }
  runItems({id:"extra", mode:"daily", extra:true, title:"Extra round"}, list);
}
function startPractice(cardId){
  var sks=shuffle(SKILLS.filter(function(s){ return s.learn===cardId; }).map(function(s){ return s.id; }));
  if(!sks.length){ library(); return; }
  var list=[]; for(var i=0;i<5;i++) list.push(makeItem(sks[i%sks.length]));
  runItems({id:"practice", mode:"practice", card:cardId, title:"Practice"}, list);
}
function startFix(){
  var keys=Object.keys(S.wrong);
  if(!keys.length){
    app.innerHTML='<div class="card center" style="margin-top:30px"><div style="font-size:44px">&#127881;</div><h2>No mistakes waiting!</h2>'+
      '<p class="sub">Every question you get wrong lands here, so you can beat it later.</p><button class="btn" onclick="home()">Back</button></div>';
    return;
  }
  keys.sort(function(a,b){ return S.wrong[b].n-S.wrong[a].n; });
  var list=shuffle(keys.slice(0,10).map(function(k){ try{ var it=JSON.parse(S.wrong[k].j); it.fromBank=1; return it; }catch(e){ return null; } }).filter(Boolean));
  runItems({id:"fix", mode:"practice", fixmode:true, title:"Fix My Mistakes"}, list);
}

/* =======================================================================
   GRADING HOOK (shared by every question type)
   ======================================================================= */
function feedback(ok, it, extra){
  if(R.lock) return; R.lock=true;
  R.results[R.i]=ok; R.max+=1;
  var fixedNow=false, t=todayISO();
  if(ok){ R.score+=1; addXP(10); fixedNow=noteRight(it); }
  else { addXP(2); noteWrong(it); }
  if(it.sk){
    var mv=gradeSkill(it.sk, ok, it.fromBank ? "practice" : R.s.mode);
    if(mv>0) R.up=(R.up||0)+1;
    if(mv<0) R.down=(R.down||0)+1;
  }
  S.days[t]=(S.days[t]||0)+1;
  save();
  var h='<div class="fb '+(ok?"good":"bad")+'"><b class="h">'+(ok?"&#9989; Correct!":"&#10060; Not quite")+(fixedNow?" &#128170; Mistake fixed!":"")+'</b>'+
    (extra?extra+"<br>":"")+(it.why||"")+'</div>';
  if(it.slip) h+='<div class="fb bad" style="background:#3b1d2e;border-color:#8a3a62"><b class="h">&#128269; An old slip</b>'+it.slip+'</div>';
  if(it.work) h+='<div class="work"><div class="wt">&#9999;&#65039; Model working</div>'+it.work+'</div>';
  var s=SK[it.sk];
  if(!ok && s && s.learn && LS[s.learn]) h+='<button class="btn ghost" style="margin-top:10px" id="ruleBtn" onclick="toggleRule()">&#128216; Show me the rule</button><div id="ruleZone"></div>';
  document.getElementById("fb").innerHTML=h;
  nextBtn();
}
function toggleRule(){
  var z=document.getElementById("ruleZone"); if(!z || !R) return;
  if(z.innerHTML){ z.innerHTML=""; return; }
  var s=SK[R.items[R.i].sk], l=s && LS[s.learn]; if(!l) return;
  z.innerHTML='<div class="card learn"><h3>'+l.title+'</h3>'+l.html+'</div>';
}

/* =======================================================================
   RESULTS
   ======================================================================= */
function finish(){
  clearTimer();
  if(!R || R.ended) return; R.ended=true;
  var s=R.s, t=todayISO(), pct=R.max?Math.round(R.score/R.max*100):100, newB=[], bonus=0;
  if(s.id==="daily" && !doneToday()){
    S.done={d:t, score:R.score, max:R.max};
    touchStreak();
    S.log.push({d:t, s:R.score, m:R.max}); if(S.log.length>60) S.log.shift();
    bonus=30; addXP(30);
    if(R.max && R.score===R.max){ S.perfect=(S.perfect||0)+1; addXP(20); bonus+=20; if(grant("perfect")) newB.push("perfect"); }
    if(grant("first")) newB.push("first");
  }
  checkBadges(newB);
  save();
  if(pct>=70 && R.max) confetti(pct>=90?140:80);
  var tomorrow=SKILLS.filter(function(x){ var st=skState(x.id); return !x.daily && enabled(x) && st.b>0 && st.due<=addDays(t,1); }).length;
  var msg = !R.max ? "All read. Nice!" : pct>=90 ? "Brilliant. Your garden loves this." : pct>=70 ? "Strong work. The misses will come back tomorrow so you can beat them." :
            pct>=50 ? "Good effort. Read the rule cards for the red ones." : "Tricky day. That is how brains grow. These come back tomorrow with their rules first.";
  var wrong=R.items.map(function(it,k){
    if(R.results[k]!==false) return "";
    return '<div class="card" style="padding:11px"><div style="font-size:14.5px;font-weight:600">'+it.q+'</div>'+
      '<div style="font-size:14.5px;color:#7ee0b5;margin-top:6px">&#10141; '+ansText(it)+'</div></div>';
  }).join("");
  var h='<h1>'+(s.id==="daily"?"Today&#39;s practice done!":(s.extra?"Extra round done":"Round done"))+'</h1>'+
    '<div class="card center"><div class="big" style="color:'+(pct>=70?"#3ddc97":"#ffd166")+'">'+R.score+'/'+R.max+'</div>'+
    '<p class="sub" style="margin:8px 0 0">'+msg+'</p>'+
    (bonus?'<p class="sub" style="margin:6px 0 0">+'+bonus+' XP bonus &middot; &#128293; '+S.streak+'-day streak</p>':'')+'</div>';
  if(R.up || R.down) h+='<div class="card"><b>&#127793; Garden update</b><p class="sub" style="margin:6px 0 0">'+
    (R.up?R.up+' skill'+(R.up>1?'s':'')+' grew':'')+(R.up&&R.down?' &middot; ':'')+(R.down?R.down+' will come back tomorrow':'')+'.'+
    (tomorrow?' Tomorrow: '+tomorrow+' review'+(tomorrow>1?'s':'')+' waiting.':'')+'</p></div>';
  if(newB.length) h+='<div class="card"><b>New badges!</b><div style="margin-top:8px">'+newB.map(function(b){ return '<span class="badge new">'+BADGES[b][0]+' '+BADGES[b][1]+'</span>'; }).join("")+'</div></div>';
  if(wrong) h+='<h2>Look at these once more</h2><p class="sub">They are saved in <b>Fix My Mistakes</b>.</p>'+wrong;
  else if(R.max) h+='<div class="card center"><div style="font-size:34px">&#11088;</div><b>Nothing wrong. Clean sweep!</b></div>';
  h+='<div class="row" style="margin-top:14px">';
  if(s.mode==="practice" && s.card) h+='<button class="btn" onclick="startPractice(\''+s.card+'\')">5 more</button>';
  else if(s.fixmode) h+='<button class="btn" onclick="startFix()">Again</button>';
  else if(doneToday()) h+='<button class="btn" onclick="startExtra()">Extra round</button>';
  h+='<button class="btn ghost" onclick="home()">Home</button></div>';
  app.innerHTML=h; window.scrollTo(0,0); paintHud();
}

/* =======================================================================
   BOOT
   ======================================================================= */
var RENDER={mcq:1, blanks:1, order:1, match:1, sort:1, pickall:1, shade:1, task:1};
/* BOOT_STAMP is taken before anything touches S, so a newer cloud copy always wins. */
var BOOT_STAMP = S.updatedAt || 0;
/* The import is written locally only (no updatedAt bump, no push), so it can never
   look newer than real progress from another device. */
importMidterm();
try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
home();
if(typeof DikshaSync!=="undefined" && DikshaSync.init()){
  try{ DikshaSync.attachUI(); }catch(e){}
  DikshaSync.pull(KEY).then(function(remote){
    if(remote && (remote.updatedAt||0) > BOOT_STAMP){
      for(var k in remote){ if(Object.prototype.hasOwnProperty.call(remote,k)) S[k]=remote[k]; }
      try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      if(!R || R.ended) home();
    }
    DikshaSync.arm();
    try{ DikshaSync.push(KEY, S); }catch(e){}
  });
}
