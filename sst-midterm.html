<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SST Mid-Term Quest - Class IV</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<style>
:root{
  --bg:#0f1b2d; --bg2:#16263f; --card:#1d3251; --card2:#24406a;
  --ink:#eaf2ff; --dim:#9fb6d6; --line:#2e4870;
  --teal:#2fd4c4; --coral:#ff7a6b; --sun:#ffc861; --grape:#a98cff; --leaf:#7ee081;
  --ok:#3ddc97; --bad:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #23406b 0%, #0f1b2d 60%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh; padding-bottom:40px;
}
.wrap{max-width:820px;margin:0 auto;padding:12px}
button{font-family:inherit;cursor:pointer;border:none}

/* ---------- top bar ---------- */
.hud{position:sticky;top:0;z-index:40;background:rgba(15,27,45,.93);backdrop-filter:blur(8px);
  border-bottom:1px solid #2e4870;padding:8px 12px}
.hud-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(140deg,var(--teal),var(--grape));
  display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
.hud-mid{flex:1;min-width:0}
.hud-top{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--dim)}
.hud-top b{color:var(--ink);font-size:14px}
.xpbar{height:9px;border-radius:9px;background:#24374f;overflow:hidden;margin-top:5px}
.xpfill{height:100%;background:linear-gradient(90deg,var(--teal),var(--leaf));width:0%;transition:width .5s}
.streak{flex:0 0 auto;background:#2a2036;border:1px solid #4a3a5e;border-radius:12px;padding:5px 9px;
  font-size:13px;font-weight:700;color:var(--sun)}

/* ---------- generic ---------- */
h1{font-size:23px;margin:14px 0 2px;letter-spacing:.2px}
h2{font-size:18px;margin:18px 0 8px}
.sub{color:var(--dim);font-size:13.5px;margin:0 0 12px;line-height:1.5}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid #33527f;
  border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn{background:linear-gradient(140deg,#2fd4c4,#1f9bd6);color:#05202b;font-weight:800;
  border-radius:14px;padding:13px 16px;font-size:16px;width:100%;box-shadow:0 4px 0 #14647f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #14647f}
.btn.ghost{background:transparent;border:1.5px solid #46688f;color:var(--ink);box-shadow:none;font-weight:700}
.btn.warm{background:linear-gradient(140deg,#ffc861,#ff9a4d);color:#3a2200;box-shadow:0 4px 0 #b06a1d}
.row{display:flex;gap:10px}
.row>*{flex:1}
.pill{display:inline-block;background:#24406a;border:1px solid #3a5d91;border-radius:999px;
  padding:3px 10px;font-size:12px;color:var(--dim);margin-right:6px}
.center{text-align:center}
.hide{display:none!important}

/* ---------- day / session cards ---------- */
.daytag{display:flex;align-items:center;gap:8px;margin:20px 0 4px}
.daytag .dot{width:10px;height:10px;border-radius:50%;background:var(--sun)}
.daytag h2{margin:0}
.slist{display:grid;gap:10px}
.scard{display:flex;gap:12px;align-items:center;background:linear-gradient(150deg,var(--card),var(--card2));
  border:1px solid #33527f;border-radius:18px;padding:12px;width:100%;text-align:left;color:var(--ink)}
.scard.done{border-color:#3ddc97}
.scard .em{width:46px;height:46px;border-radius:14px;background:#12253c;display:flex;align-items:center;
  justify-content:center;font-size:24px;flex:0 0 auto}
.scard .t{font-weight:800;font-size:15.5px}
.scard .d{font-size:12.5px;color:var(--dim);margin-top:2px}
.scard .r{flex:0 0 auto;font-size:12px;color:var(--dim);text-align:right}
.ring{font-weight:800;font-size:13px;color:var(--teal)}
.boss{border-color:#ff7a6b;background:linear-gradient(150deg,#3a2333,#4a2a3a)}
.boss .em{background:#5a2b34}

/* ---------- question ---------- */
.qtop{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.qtop .back{background:#24406a;border-radius:12px;padding:8px 12px;color:var(--ink);font-weight:700;font-size:14px}
.dots{flex:1;display:flex;gap:4px;flex-wrap:wrap}
.dt{width:9px;height:9px;border-radius:50%;background:#33507a}
.dt.ok{background:var(--ok)} .dt.no{background:var(--bad)} .dt.cur{background:var(--sun);transform:scale(1.35)}
.timer{font-weight:800;color:var(--sun);font-size:15px;font-variant-numeric:tabular-nums}
.qtype{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--teal);font-weight:800}
.qtext{font-size:18.5px;line-height:1.45;margin:8px 0 14px;font-weight:600}
.opts{display:grid;gap:9px}
.opt{background:#12253c;border:1.5px solid #3a5d91;border-radius:14px;padding:13px 14px;
  font-size:16px;color:var(--ink);text-align:left;width:100%;line-height:1.35}
.opt:active{background:#1a3355}
.opt.sel{border-color:var(--sun)}
.opt.good{background:#134b39;border-color:var(--ok)}
.opt.bad{background:#4b1d22;border-color:var(--bad)}
.opt .k{display:inline-block;width:24px;font-weight:800;color:var(--dim)}
.fb{margin-top:12px;border-radius:14px;padding:12px;font-size:14.5px;line-height:1.5}
.fb.good{background:#123f31;border:1px solid #2f7d61}
.fb.bad{background:#42181d;border:1px solid #8a3a42}
.fb b{display:block;margin-bottom:3px;font-size:15px}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mcol{display:grid;gap:9px}
.mi{background:#12253c;border:1.5px solid #3a5d91;border-radius:13px;padding:11px;font-size:14.5px;
  color:var(--ink);text-align:left;line-height:1.3}
.mi.active{border-color:var(--sun);background:#2a2f1f}
.mi.paired{opacity:.55}
.mi.good{background:#134b39;border-color:var(--ok);opacity:1}
.mi.bad{background:#4b1d22;border-color:var(--bad);opacity:1}
.mi .tag{display:inline-block;background:#35558a;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:6px}

/* order */
.slots{display:grid;gap:8px;margin-bottom:12px}
.slot{border:1.5px dashed #46688f;border-radius:13px;padding:11px;min-height:44px;font-size:15px;color:var(--dim)}
.slot.filled{border-style:solid;background:#12253c;color:var(--ink)}
.slot.good{border-color:var(--ok);background:#134b39;color:#fff}
.slot.bad{border-color:var(--bad);background:#4b1d22;color:#fff}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#24406a;border:1.5px solid #3a5d91;border-radius:999px;padding:9px 14px;font-size:14.5px;color:var(--ink)}
.chip.used{opacity:.3}

/* word bank */
.bank{display:flex;flex-wrap:wrap;gap:8px}
.ans-slot{background:#12253c;border:1.5px solid #3a5d91;border-radius:13px;padding:13px;
  font-size:17px;min-height:50px;margin-bottom:12px;font-weight:700}
.ans-slot.empty{color:#5d7ba6;font-weight:400}

/* write */
textarea{width:100%;min-height:110px;background:#12253c;border:1.5px solid #3a5d91;border-radius:14px;
  color:var(--ink);font-size:16px;padding:12px;font-family:inherit;line-height:1.45;resize:vertical}
.model{background:#12303c;border:1px solid #2f7d8a;border-radius:14px;padding:12px;margin-top:10px;
  font-size:15px;line-height:1.55}
.model ul{margin:6px 0 0 18px;padding:0}
.model li{margin:4px 0}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rate button{border-radius:13px;padding:11px 6px;font-size:13.5px;font-weight:800;color:#06202b}
.r1{background:#3ddc97}.r2{background:#ffc861}.r3{background:#ff9a8f}

/* map */
.mapbox{background:#0c1a2b;border:1px solid #33527f;border-radius:16px;padding:6px}
svg .rg{fill:#26456f;stroke:#4d7ab0;stroke-width:1.2;cursor:pointer}
svg .rg:active{fill:#35608f}
svg .rg.good{fill:#1f6b4f;stroke:#3ddc97}
svg .rg.bad{fill:#6b2730;stroke:#ff6b6b}
svg .lbl{fill:#cfe2ff;font-size:9px;font-weight:700;pointer-events:none}

/* results */
.big{font-size:44px;font-weight:900;letter-spacing:-1px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#24406a;border:1px solid #4d7ab0;
  border-radius:999px;padding:7px 12px;font-size:13px;margin:4px 4px 0 0}
.badge.new{background:#3b2f14;border-color:var(--sun);color:var(--sun)}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.smallnote{font-size:12px;color:var(--dim);line-height:1.5;margin-top:14px}
.warnbox{background:#3b2f14;border:1px solid #7a6127;border-radius:14px;padding:12px;font-size:13.5px;line-height:1.55}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div class="hud">
  <div class="hud-in">
    <div class="avatar" id="mascot">&#127981;</div>
    <div class="hud-mid">
      <div class="hud-top"><b id="lvlName">Level 1 - Beach Beginner</b><span id="xpTxt">0 XP</span></div>
      <div class="xpbar"><div class="xpfill" id="xpFill"></div></div>
    </div>
    <div class="streak" id="streak">&#128293; 0</div>
  </div>
</div>

<div class="wrap" id="app"></div>
<div class="sync-row" id="syncRow" style="display:none;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px 12px 16px;font-size:12px">
  <span id="syncCodeLabel" style="background:var(--card2);color:var(--teal);font-weight:800;padding:5px 12px;border-radius:99px;cursor:pointer;border:1px solid var(--line)"></span>
  <button id="syncChangeBtn" style="background:none;border:none;color:var(--dim);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline">Use a different code</button>
</div>

var cvs = document.getElementById("confetti"), ctx = cvs.getContext("2d"), parts = [], raf = null;
function sizeCanvas(){ cvs.width = innerWidth; cvs.height = innerHeight; }
sizeCanvas(); addEventListener("resize", sizeCanvas);
function confetti(n){
  if(!ctx) return;
  n = n || 70;
  var cols = ["#2fd4c4","#ffc861","#ff7a6b","#a98cff","#7ee081"];
  for(var i=0;i<n;i++){
    parts.push({x:Math.random()*cvs.width, y:-20-Math.random()*cvs.height*0.4,
      vx:(Math.random()-0.5)*3, vy:2+Math.random()*4, s:5+Math.random()*7,
      c:cols[(Math.random()*cols.length)|0], r:Math.random()*6, vr:(Math.random()-0.5)*0.3});
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  if(!ctx){ parts=[]; raf=null; return; }
  ctx.clearRect(0,0,cvs.width,cvs.height);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.r+=p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore();
    if(p.y>cvs.height+30) parts.splice(i,1);
  }
  if(parts.length) raf = requestAnimationFrame(tick);
  else { raf=null; ctx.clearRect(0,0,cvs.width,cvs.height); }
}

function startSession(id){
  touchStreak();
  var s = SESSIONS.filter(function(x){ return x.id===id; })[0];
  var order = s.items.slice();
  // keep written questions at the end, shuffle the auto ones
  var autos = order.filter(function(i){ return i.t!=="write"; });
  var writes = order.filter(function(i){ return i.t==="write"; });
  shuffle(autos);
  R = {s:s, items:autos.concat(writes), i:0, score:0, max:0, results:[], left:s.timed||0, ended:false};
  if(s.timed){
    timerId = setInterval(function(){
      R.left--;
      var el = document.getElementById("timer");
      if(el) el.textContent = fmt(R.left);
      if(R.left<=0){ clearTimer(); finish(true); }
    },1000);
  }
  renderQ();
}
function fmt(t){ if(t<0)t=0; var m=Math.floor(t/60), s=t%60; return m+":"+(s<10?"0":"")+s; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function qHeader(){

    var c = k<R.i ? (R.results[k] ? "ok":"no") : (k===R.i ? "cur":"");

  return '<div class="qtop"><button class="back" onclick="confirmQuit()">&#8592;</button>'+
    '<div class="dots">'+dots+'</div>'+
    (R.s.timed ? '<div class="timer" id="timer">'+fmt(R.left)+'</div>' : '<div class="timer">'+(R.i+1)+'/'+R.items.length+'</div>')+
    '</div>';

/* MATCH */
var MST = null;
function rMatch(it){
  var left = it.pairs.map(function(p,k){ return {t:p[0], k:k}; });
  var right = shuffle(it.pairs.map(function(p,k){ return {t:p[1], k:k}; }));
  MST = {left:left, right:right, sel:null, made:{}, n:it.pairs.length, done:0};
  document.getElementById("body").innerHTML =
    '<div class="mgrid"><div class="mcol">'+left.map(function(l,i){
      return '<button class="mi" id="L'+i+'" onclick="mTapL('+i+')">'+l.t+'<span class="tag hide" id="LT'+i+'"></span></button>'; }).join("")+
    '</div><div class="mcol">'+right.map(function(r,i){
      return '<button class="mi" id="R'+i+'" onclick="mTapR('+i+')">'+r.t+'<span class="tag hide" id="RT'+i+'"></span></button>'; }).join("")+
    '</div></div><p class="smallnote">Tap a box on the left, then its partner on the right.</p>';
}
function mTapL(i){
  if(MST.made["L"+i]!==undefined) return;
  if(MST.sel!==null) document.getElementById("L"+MST.sel).classList.remove("active");
  MST.sel = i; document.getElementById("L"+i).classList.add("active");
}
function mTapR(j){
  if(MST.sel===null || MST.made["R"+j]!==undefined) return;
  var i=MST.sel;
  MST.made["L"+i]=j; MST.made["R"+j]=i; MST.sel=null; MST.done++;
  var num=MST.done;
  var Le=document.getElementById("L"+i), Re=document.getElementById("R"+j);
  Le.classList.remove("active"); Le.classList.add("paired"); Re.classList.add("paired");
  var lt=document.getElementById("LT"+i), rt=document.getElementById("RT"+j);
  lt.classList.remove("hide"); rt.classList.remove("hide"); lt.textContent=num; rt.textContent=num;
  if(MST.done===MST.n) gradeMatch();
}
function gradeMatch(){
  var it=R.items[R.i], right=0;
  for(var i=0;i<MST.n;i++){
    var j = MST.made["L"+i];
    var good = MST.left[i].k === MST.right[j].k;
    if(good) right++;
    document.getElementById("L"+i).className = "mi "+(good?"good":"bad");
    document.getElementById("R"+j).className = "mi "+(good?"good":"bad");
  }
  var ok = right===MST.n;
  var correctList = it.pairs.map(function(p){ return p[0]+" = "+p[1]; }).join("<br>");
  feedback(ok, it, ok? ("All "+right+" correct!") : ("You got "+right+" of "+MST.n+".<br>"+correctList+"<br>"));
}

/* ORDER */
var OST=null;
function rOrder(it){
  OST={picked:[], pool:shuffle(it.items.slice())};
  drawOrder(it);
}
function drawOrder(it){
  var slots = it.items.map(function(_,k){
    var v = OST.picked[k];
    return '<div class="slot '+(v?"filled":"")+'" id="S'+k+'" onclick="undoOrder('+k+')">'+(v? (k+1)+". "+v : (k+1)+". ...")+'</div>';
  }).join("");
  var pool = OST.pool.map(function(p,k){
    var used = OST.picked.indexOf(p)>=0;
    return '<button class="chip '+(used?"used":"")+'" onclick="pickOrder(\''+p.replace(/'/g,"\\'")+'\')">'+p+'</button>';
  }).join("");
  document.getElementById("body").innerHTML='<div class="slots">'+slots+'</div><div class="pool">'+pool+'</div>'+
    '<p class="smallnote">Tap a chip to place it. Tap a filled slot to take it back.</p>';
}
function pickOrder(p){
  var it=R.items[R.i];
  if(OST.locked) return;
  if(OST.picked.indexOf(p)>=0) return;
  if(OST.picked.length>=it.items.length) return;
  OST.picked.push(p); drawOrder(it);
  if(OST.picked.length===it.items.length) gradeOrder(it);
}
function undoOrder(k){
  var it=R.items[R.i];
  if(OST.locked) return;
  if(OST.picked[k]===undefined) return;
  OST.picked.splice(k,1); drawOrder(it);
}
function gradeOrder(it){
  OST.locked=true;
  var right=0;
  for(var k=0;k<it.items.length;k++){
    var good = OST.picked[k]===it.items[k];
    if(good) right++;
    var el=document.getElementById("S"+k); el.className="slot filled "+(good?"good":"bad");
  }
  var ok = right===it.items.length;
  feedback(ok, it, ok?"":("Correct order:<br>"+it.items.map(function(x,n){ return (n+1)+". "+x; }).join("<br>")+"<br>"));
}

/* MAP */
function rMap(it){
  var svg='<svg viewBox="0 0 300 330" style="width:100%;height:auto">';
  MAPREG.forEach(function(r){
    svg += '<polygon class="rg" id="RG_'+r.id+'" points="'+r.pts+'" onclick="tapMap(\''+r.id+'\')"></polygon>';
  });
  svg += '<circle cx="272" cy="300" r="3" class="rg" onclick="tapMap(\'islands\')"></circle>';
  /* The Islands sit alone in the sea and their drawn shapes are ~13px and ~7px
     wide on a 390px phone - far under the 44px tap minimum, and a miss lands on
     nothing at all. These two transparent shapes widen only the hit area; the
     visible map is unchanged. They go last so they sit on top, and they stay
     clear of the Eastern Coastal Plain (max x 258) so no other region loses a tap. */
  svg += '<rect x="254" y="186" width="42" height="92" fill="transparent" onclick="tapMap(\'islands\')"></rect>';
  svg += '<circle cx="272" cy="300" r="22" fill="transparent" onclick="tapMap(\'islands\')"></circle>';
  svg += '<text class="lbl" x="150" y="320" text-anchor="middle">Tap a region</text></svg>';
  document.getElementById("body").innerHTML='<div class="mapbox">'+svg+'</div>';
}
function tapMap(id){
  var it=R.items[R.i];
  if(document.getElementById("RG_"+MAPREG[0].id).dataset.lock) return;
  MAPREG.forEach(function(r){ document.getElementById("RG_"+r.id).dataset.lock="1"; });
  var ok = id===it.region;
  document.getElementById("RG_"+it.region).classList.add("good");
  if(!ok) document.getElementById("RG_"+id).classList.add("bad");
  var name = MAPREG.filter(function(r){return r.id===it.region;})[0].name;
  feedback(ok, it, ok?"":("The green area is "+name+"."));
}

/* WRITE - self check */
function rWrite(it){
  R.wlock = false;
  document.getElementById("body").innerHTML =
    '<textarea id="wa" placeholder="Write your answer here (or say it out loud), then check."></textarea>'+
    '<button class="btn warm" style="margin-top:10px" onclick="showModel()">Show the model answer</button>'+
    '<div id="modelZone"></div>';
}
function showModel(){
  var it=R.items[R.i];
  if(R.wlock) return;
  document.getElementById("modelZone").innerHTML =
    '<div class="model"><b>Model answer ('+it.marks+' mark'+(it.marks>1?"s":"")+')</b>'+it.model+'</div>'+
    '<p class="smallnote">Be honest - that is how you find out what to revise.</p>'+
    '<div class="rate"><button class="r1" onclick="rateWrite(2)">I got it</button>'+
    '<button class="r2" onclick="rateWrite(1)">Half right</button>'+
    '<button class="r3" onclick="rateWrite(0)">I missed it</button></div>';
}
function rateWrite(v){
  var it=R.items[R.i];
  if(R.wlock) return;
  R.wlock = true;
  R.results[R.i] = v===2;
  R.max += 1; if(v===2) R.score += 1; else if(v===1) R.score += 0.5;
  addXP(v===2?16:(v===1?9:4));
  document.getElementById("modelZone").innerHTML +=
    '<div class="fb '+(v===2?"good":"bad")+'" style="margin-top:10px"><b>'+
    (v===2?"&#9989; Marked as learnt":(v===1?"&#9998; Half marks - read it once more":"&#128214; Add this to revision"))+
    '</b></div>';
  nextBtn(R.i===R.items.length-1 ? "See results" : "Next");
}

/* ---------------- results ---------------- */
function finish(timeUp){
  clearTimer();
  if(R.ended) return; R.ended=true;
  var pct = R.max ? Math.round(R.score/R.max*100) : 0;
  var prev = S.best[R.s.id];
  if(!prev || R.score > prev.score) S.best[R.s.id] = {score:Math.round(R.score*10)/10, max:R.max, pct:pct};
  var newB = [];
  if(pct >= 60 && grant(SBADGE[R.s.id])) newB.push(SBADGE[R.s.id]);
  if(pct === 100 && grant("perfect")) newB.push("perfect");
  ["1","2"].forEach(function(d){
    var ids = SESSIONS.filter(function(s){ return s.day===+d; }).map(function(s){ return s.id; });
    var all = ids.every(function(i){ return S.best[i] && S.best[i].pct>=60; });
    if(all && grant("allday"+d)) newB.push("allday"+d);
  });
  save();
  if(pct>=70) confetti(pct>=90?140:80);

  var msg = pct>=90 ? "Outstanding. You are ready." :
            pct>=70 ? "Strong work. Just polish the misses." :
            pct>=50 ? "Good start - go through the wrong ones once more." :
                      "Worth doing this quest again before the test.";
  var wrongList = R.items.map(function(it,k){
    if(R.results[k]) return "";
    var a = it.t==="write" ? "(written answer - re-read the model)" :
            it.t==="mcq"||it.t==="tf"||it.t==="pic" ? it.o[it.a] :
            it.t==="word" ? it.a :
            it.t==="order" ? it.items.join(" &#8594; ") :
            it.t==="map" ? MAPREG.filter(function(r){return r.id===it.region;})[0].name :
            it.pairs.map(function(p){return p[0]+" = "+p[1];}).join("; ");
    return '<div class="card" style="padding:11px"><div style="font-size:14.5px;font-weight:600">'+it.q+'</div>'+
           '<div style="font-size:14px;color:#7ee081;margin-top:5px">&#10141; '+a+'</div></div>';
  }).join("");

  var h='<h1>'+(timeUp?"Time up!":"Quest complete")+'</h1>'+
    '<div class="card center"><div class="big" style="color:'+(pct>=70?"#3ddc97":"#ffc861")+'">'+pct+'%</div>'+
    '<div class="sub" style="margin:4px 0 0">'+(Math.round(R.score*10)/10)+' out of '+R.max+'</div>'+
    '<p class="sub" style="margin:10px 0 0">'+msg+'</p></div>';

  if(newB.length){
    h += '<div class="card"><b>New badges!</b><div style="margin-top:8px">'+
      newB.map(function(b){ return '<span class="badge new">'+BADGES[b][0]+' '+BADGES[b][1]+'</span>'; }).join("")+'</div></div>';
  }
  if(wrongList.trim()){
    h += '<h2>Revise these</h2>'+wrongList;
  } else {
    h += '<div class="card center"><div style="font-size:34px">&#11088;</div><b>Nothing wrong. Clean sweep.</b></div>';
  }
  h += '<div class="row" style="margin-top:14px">'+
       '<button class="btn" onclick="startSession(\''+R.s.id+'\')">Play again</button>'+
       '<button class="btn ghost" onclick="home()">Back to quests</button></div>';
  app.innerHTML=h; window.scrollTo(0,0); paintHud();
}

/* ---------------- boot ---------------- */
var BOOT_STAMP = S.updatedAt || 0;
touchStreak();
home();

/* cross-device sync (optional, no-op if firebase-config.js is empty or blocked) */
if(typeof DikshaSync!=="undefined" && DikshaSync.init()){
  try{ DikshaSync.attachUI(); }catch(e){}
  DikshaSync.pull(KEY).then(function(remote){
    if(remote && (remote.updatedAt||0) > BOOT_STAMP){
      for(var k in remote){ if(Object.prototype.hasOwnProperty.call(remote,k)) S[k]=remote[k]; }
      home();
    }
    DikshaSync.arm();
    DikshaSync.push(KEY, S);
  });
}
</script>
</body>
</html>
